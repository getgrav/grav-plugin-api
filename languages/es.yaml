  ACCESS_ADMIN_SUPER: "Superusuario"
  ACCESS_ADMIN_CACHE: "Vaciar caché"
  ACCESS_ADMIN_CONFIGURATION: "Configuración"
  ACCESS_ADMIN_CONFIGURATION_SYSTEM: "Administrar la configuración del sistema"
  ACCESS_ADMIN_CONFIGURATION_SITE: "Administrar la configuración del sitio"
  ACCESS_ADMIN_CONFIGURATION_MEDIA: "Administrar la configuración de medios"
  ACCESS_ADMIN_CONFIGURATION_SECURITY: "Administrar la configuración de seguridad"
  ACCESS_ADMIN_CONFIGURATION_INFO: "Ver información del servidor"
  ACCESS_ADMIN_SETTINGS: "Configuración"
  ACCESS_ADMIN_PAGES: "Gestionar páginas"
  ACCESS_ADMIN_MAINTENANCE: "Mantenimiento del sitio"
  ACCESS_ADMIN_STATISTICS: "Estadísticas del sitio"
  ACCESS_ADMIN_PLUGINS: "Administrar plugins"
  ACCESS_ADMIN_THEMES: "Administrar temas"
  ACCESS_ADMIN_TOOLS: "Acceso a herramientas"
  ACCESS_ADMIN_USERS: "Gestionar usuarios"
  # Etiquetas del formulario de la cuenta de usuario (valores de reserva para las claves PLUGIN_ADMIN.*)
  ACCOUNT: "Cuenta"
  USERNAME: "Nombre de usuario"
  EMAIL: "Correo electrónico"
  EMAIL_VALIDATION_MESSAGE: "Debe ser una dirección de correo electrónico válida"
  PASSWORD: "Contraseña"
  PASSWORD_VALIDATION_MESSAGE: "La contraseña debe cumplir el patrón configurado"
  FULL_NAME: "Nombre completo"
  TITLE: "Título"
  LANGUAGE: "Idioma"
  LANGUAGE_HELP: "Establece el idioma para este usuario"
  CONTENT_EDITOR: "Editor de contenido"
  CONTENT_EDITOR_HELP: "Sobrescribe el editor de contenido para este usuario"
  2FA_TITLE: "Autenticación en dos factores"
  2FA_ENABLED: "2FA habilitado"
  2FA_SECRET: "Secreto 2FA"
  2FA_SECRET_HELP: "Escanea el código QR con tu aplicación de autenticación"
  YUBIKEY_ID: "ID de YubiKey"
  YUBIKEY_HELP: "Inserta tu YubiKey y haz clic para generar un OTP. Los primeros 12 caracteres son tu ID de cliente."
  YES: "Sí"
  NO: "No"
  PERMISSIONS: "Permisos"
  GROUPS: "Grupos"
  GROUPS_HELP: "Asigna al usuario a grupos para heredar permisos"
  ACCESS_LEVELS: "Niveles de acceso"
  AVATAR_HASH: "Introduce un identificador único para tu multiavatar"
  # Compresión de respuestas
  COMPRESSION: "Compresión de respuestas"
  COMPRESSION_HELP: "Comprime con Gzip las grandes respuestas JSON (más de 8 KB) para los clientes que lo acepten, lo que reduce a una fracción el tamaño de las listas de páginas y las descargas de traducciones. Automático deja la salida tal cual cuando PHP ya comprime. Elige Desactivado para dejar la compresión al servidor web."
  COMPRESSION_AUTO: "Automático"
  COMPRESSION_OFF: "Desactivado"
  PLUGIN_STATUS: "Estado del plugin"
  GENERAL: "General"
  GENERAL_SETTINGS: "Configuración general"
  API_ROUTE: "Ruta de la API"
  API_ROUTE_HELP: "La ruta base de la API"
  VERSION_PREFIX: "Prefijo de versión"
  VERSION_PREFIX_HELP: "Prefijo de la versión actual de la API"
  BACKEND: "Backend"
  FLEX_PAGES_BACKEND: "Backend de páginas Flex"
  FLEX_PAGES_BACKEND_HELP: "Usa Flex-Objects para listados de páginas (búsqueda, filtrado y paginación más rápidos)"
  FLEX_ACCOUNTS_BACKEND: "Backend de cuentas Flex"
  FLEX_ACCOUNTS_BACKEND_HELP: "Usa Flex-Objects para listados de usuarios (búsqueda y paginación más rápidas)"
  KEEP_CACHE_FOR_API_REQUESTS: "Mantener caché para solicitudes de la API"
  KEEP_CACHE_FOR_API_REQUESTS_HELP: "Mantiene la caché de objetos de Grav activa para las solicitudes de la API aunque la caché global esté desactivada. Desactivar la caché es una comodidad para desarrolladores frontend (para ver cambios de plantillas en tiempo real), pero la API no renderiza páginas frontend, así que dejarlo activado mantiene el administrador rápido mientras el frontend se ejecuta sin caché. Desactívalo solo si necesitas que la API respete la configuración global de caché."
  AUTHENTICATION: "Autenticación"
  API_KEY_AUTHENTICATION: "Autenticación por clave API"
  JWT_AUTHENTICATION: "Autenticación JWT"
  JWT_ACCESS_TOKEN_EXPIRY: "Caducidad del token de acceso JWT"
  JWT_ACCESS_TOKEN_EXPIRY_HELP: "Tiempo de vida del token de acceso en segundos"
  JWT_REFRESH_TOKEN_EXPIRY: "Caducidad del token de actualización JWT"
  JWT_REFRESH_TOKEN_EXPIRY_HELP: "Tiempo de vida del token de actualización en segundos"
  JWT_SIGNING_ALGORITHM: "Algoritmo de firma JWT"
  JWT_SIGNING_ALGORITHM_HELP: "Algoritmo HMAC usado para firmar y verificar tokens de API. Solo se admiten variantes simétricas HS porque los tokens se firman con un único secreto compartido. Mantén HS256 salvo que tengas un motivo específico para cambiarlo."
  SESSION_AUTHENTICATION: "Autenticación por sesión"
  SESSION_AUTHENTICATION_HELP: "Permitir que las sesiones de administración existentes accedan a la API"
  API_KEY_VERIFICATION_CACHE: "Caché de verificación de clave API"
  API_KEY_VERIFICATION_CACHE_HELP: "Cuánto tiempo (en segundos) recordar una clave API verificada para que las solicitudes repetidas omitan la comprobación bcrypt intencionalmente lenta. Revocar, desactivar o caducar una clave sigue teniendo efecto de inmediato. Pon 0 para verificar cada solicitud."
  RELEASE_SESSION_LOCK_EARLY: "Liberar bloqueo de sesión antes"
  RELEASE_SESSION_LOCK_EARLY_HELP: "Confirma la sesión justo después de la autenticación en solicitudes de solo lectura (GET) para que las llamadas paralelas del nuevo administrador no queden detrás del bloqueo de archivo por sesión de PHP. Recomendado activado. Desactívalo solo si un endpoint de lectura personalizado escribe en la sesión."
  PROTECT_FRONTEND_SESSION: "Proteger sesión del frontend"
  PROTECT_FRONTEND_SESSION_HELP: "Impide que las llamadas a la API toquen la sesión del sitio público. Las llamadas hechas con un token o clave API y sin cookie de sesión omiten por completo la sesión PHP, y cualquier otra llamada que llegue sin su propia cookie de sesión nunca crea una nueva. Esto evita que la API inicie una sesión de visitante que ha iniciado sesión en el sitio público en el mismo navegador. Recomendado activado."
  TRANSLATION_OVERRIDES: "Sobrescrituras de traducción"
  TRANSLATION_OVERRIDES_HELP: "Aplica las sobrescrituras de traducción guardadas en user/languages para que también sustituyan las cadenas del tema activo. Si se desactiva, los archivos siguen en su sitio pero dejan de sobrescribir el texto del tema. Recomendado activado."
  ALLOW_DRAFT_PREVIEW: "Permitir vista previa de borradores"
  ALLOW_DRAFT_PREVIEW_HELP: "Permite que el editor de páginas del nuevo administrador previsualice una página no publicada en el frontend. La vista previa la autoriza un token de corta duración emitido solo para usuarios que pueden leer la página, así que desactivarlo deshabilita por completo las vistas previas de borradores. Recomendado activado."
  LOGIN_CAPTCHA: "Captcha de inicio de sesión"
  LOGIN_CAPTCHA_HELP: "Exige un desafío captcha en el formulario de inicio de sesión del administrador. El inicio de sesión ya está limitado por tasa y admite 2FA por cuenta, así que esto es una capa extra y no la única."
  CAPTCHA_PROVIDER: "Proveedor de captcha"
  CAPTCHA_PROVIDER_HELP: "Cap es un desafío de prueba de trabajo servido por este plugin: sin claves ni servicio externo. Turnstile y reCAPTCHA requieren el plugin Form y usan las claves ya configuradas allí."
  CAPTCHA_MODE: "Modo de captcha"
  CAPTCHA_MODE_HELP: "Las soluciones invisibles se resuelven en segundo plano mientras el usuario escribe sus credenciales. La casilla hace que hagan clic. Lo respetan Cap y Turnstile."
  GUARD_LOGIN: "Proteger inicio de sesión"
  GUARD_FORGOTTEN_PASSWORD: "Proteger contraseña olvidada"
  GUARD_FORGOTTEN_PASSWORD_HELP: "Recomendado: el endpoint de contraseña olvidada envía correo, lo que lo hace más atractivo como objetivo que el propio inicio de sesión."
  GUARD_FIRST_RUN_SETUP: "Proteger configuración inicial"
  GUARD_FIRST_RUN_SETUP_HELP: "Solo es accesible en un sitio sin cuentas todavía."
  CAP_DIFFICULTY: "Dificultad de Cap"
  CAP_DIFFICULTY_HELP: "Bits de cero inicial que cada subdesafío debe producir. Cuanto más alto, más trabajo para el cliente: aumentarlo solo si ves que los intentos automatizados consiguen pasar."
  CAP_SUB_CHALLENGES: "Subdesafíos de Cap"
  CAP_SUB_CHALLENGES_HELP: "Cuántos subdesafíos forman un captcha. El valor predeterminado tarda bien menos de un segundo en un teléfono."
  CORS: "CORS"
  CORS_SETTINGS: "Configuración de CORS"
  ENABLE_CORS: "Activar CORS"
  ALLOWED_ORIGINS: "Orígenes permitidos"
  ALLOWED_ORIGINS_HELP: "Orígenes exactos (esquema + host) permitidos para llamar a la API desde un navegador, por ejemplo https://app.example.com. Vacío significa solo mismo origen. Evita \"*\": permite que cualquier sitio lea respuestas autenticadas, por lo que un comodín configurado solo se acepta para endpoints no autenticados."
  ALLOWED_METHODS: "Métodos permitidos"
  ALLOWED_METHODS_HELP: "Métodos HTTP permitidos para solicitudes CORS"
  ALLOWED_HEADERS: "Cabeceras permitidas"
  RATE_LIMITING: "Limitación de velocidad"
  ENABLE_RATE_LIMITING: "Activar limitación de velocidad"
  REQUESTS_PER_WINDOW: "Solicitudes por ventana"
  REQUESTS_PER_WINDOW_HELP: "Número máximo de solicitudes por ventana temporal"
  TIME_WINDOW: "Ventana temporal"
  TIME_WINDOW_HELP: "Ventana de limitación de velocidad en segundos"
  CONTENT: "Contenido"
  MEDIA_METADATA: "Metadatos de medios"
  MAXIMUM_VALUE_LENGTH: "Longitud máxima del valor"
  MAXIMUM_VALUE_LENGTH_HELP: "Valor de metadatos más largo (caracteres) aceptado al guardar. Los valores también se eliminan de etiquetas HTML, ya que se renderizan en atributos de imagen del sitio."
  EDITABLE_METADATA_FIELDS: "Campos de metadatos editables"
  EDITABLE_METADATA_FIELDS_HELP: "Campos descriptivos mostrados en el editor de metadatos de medios. La clave se escribe tal cual en el sidecar .meta.yaml. Cualquier otra clave (EXIF, dimensiones, información de subida) se deja intacta al guardar."
  KEY: "Clave"
  KEY_HELP: "Clave del sidecar, por ejemplo alt, title, caption. Solo se permiten letras, números, punto, guion y guion bajo."
  LABEL: "Etiqueta"
  FIELD_TYPE: "Tipo de campo"
  SINGLE_LINE: "Línea única"
  MULTI_LINE: "Varias líneas"
  TAGS_LIST: "Etiquetas (lista)"
  PAGE_STATISTICS: "Estadísticas de páginas"
  TRACK_PAGE_VIEWS: "Registrar visitas de páginas"
  TRACK_PAGE_VIEWS_HELP: "Registra visitas del frontend en el panel de estadísticas de páginas"
  EXCLUDE_LOGGED_IN_ADMINS: "Excluir administradores conectados"
  EXCLUDE_LOGGED_IN_ADMINS_HELP: "Omite las visitas realizadas mientras se está conectado con acceso de administrador para que tus pruebas y visitas de demostración no distorsionen las estadísticas"
  EXCLUDED_IP_ADDRESSES: "Direcciones IP excluidas"
  EXCLUDED_IP_ADDRESSES_HELP: "IPs o rangos CIDR a excluir del seguimiento, por ejemplo 203.0.113.7 o 203.0.113.0/24. Se admiten IPv4 e IPv6."
  EXCLUDE_NON_BROWSER_CLIENTS: "Excluir clientes no navegadores"
  EXCLUDE_NON_BROWSER_CLIENTS_HELP: "Omite las visitas de clientes HTTP de línea de comandos y bibliotecas como curl, wget, Go-http-client y python-requests. Estos se identifican como navegadores en lugar de bots, así que un escáner que golpee el sitio contaría como tráfico real."
  EXCLUDED_USER_AGENTS: "Agentes de usuario excluidos"
  EXCLUDED_USER_AGENTS_HELP: "Fragmentos adicionales de User-Agent para excluir del seguimiento, emparejados en cualquier parte de la cabecera e ignorando mayúsculas/minúsculas, por ejemplo uptimerobot o my-scanner. Se añaden a la lista incorporada anterior."
  AUDIT_TRAIL: "Traza de auditoría"
  ENABLE_AUDIT_TRAIL: "Activar traza de auditoría"
  ENABLE_AUDIT_TRAIL_HELP: "Registra la actividad de la API (inicios de sesión, contenido, usuarios, configuración y cambios de paquetes) en un registro consultable visible en Herramientas. Solo lo ven los superadministradores. Está desactivado por defecto."
  DETAIL_LEVEL: "Nivel de detalle"
  DETAIL_LEVEL_HELP: "Lo normal registra quién hizo qué, cuándo y desde dónde. El detallado además captura valores a nivel de campo antes y después en las ediciones de páginas (más almacenamiento)."
  RETENTION_DAYS: "Retención (días)"
  RETENTION_DAYS_HELP: "Elimina automáticamente las entradas más antiguas de este número de días. Elige 0 para conservarlas indefinidamente."
  MAXIMUM_ENTRIES: "Entradas máximas"
  MAXIMUM_ENTRIES_HELP: "Límite máximo de entradas almacenadas; las más antiguas se recortan cuando se excede. Elige 0 para no limitar."
  ANONYMIZE_IP_ADDRESSES: "Anonimizar direcciones IP"
  ANONYMIZE_IP_ADDRESSES_HELP: "Oculta la última parte de cada IP antes de almacenarla (último octeto para IPv4, últimos 80 bits para IPv6), para unos registros más respetuosos con el GDPR. Desactivado conserva direcciones completas para detalle forense."
  CAPTURE_AUTHENTICATION: "Capturar autenticación"
  CAPTURE_AUTHENTICATION_HELP: "Inicios de sesión, fallidos, cierres de sesión y restablecimientos de contraseña"
  CAPTURE_CONTENT_CHANGES: "Capturar cambios de contenido"
  CAPTURE_CONTENT_CHANGES_HELP: "Crear, actualizar, eliminar, mover y traducir páginas"
  CAPTURE_MEDIA_CHANGES: "Capturar cambios de medios"
  CAPTURE_MEDIA_CHANGES_HELP: "Subidas y eliminaciones de medios"
  CAPTURE_USER_GROUP_CHANGES: "Capturar cambios de usuarios y grupos"
  CAPTURE_USER_GROUP_CHANGES_HELP: "Crear, actualizar y eliminar usuarios y grupos"
  CAPTURE_CONFIGURATION_CHANGES: "Capturar cambios de configuración"
  CAPTURE_CONFIGURATION_CHANGES_HELP: "Actualizaciones de configuración del sistema y plugins"
  CAPTURE_PACKAGE_CHANGES: "Capturar cambios de paquetes"
  CAPTURE_PACKAGE_CHANGES_HELP: "Instalación, actualización, eliminación y actualizaciones de Grav de plugins y temas"
  DEMO_MODE: "Modo demostración"
  DEMO_NOTICE: "El modo demostración está activado **por cuenta**, concediendo a una cuenta la bandera de acceso *Modo demostración* (`access.api.demo`) en sus permisos. Una cuenta de demostración puede navegar por todo pero no puede guardar cambios salvo en los recursos de abajo, y las rutas del servidor, registros y copias de seguridad quedan ocultas. Captura la línea base y restablece el contenido desde el panel **Set Baseline / Reset Now**, o con `bin/plugin api demo:baseline` y `bin/plugin api demo:reset`."
  WRITABLE_RESOURCES: "Recursos escribibles"
  WRITABLE_RESOURCES_HELP: "Recursos que aún puede crear, actualizar o eliminar una cuenta de demostración. Déjalo vacío para una demostración totalmente de solo lectura; selecciona Páginas para permitir edición de contenido sin subidas de medios. Configuración, usuarios, paquetes, sistema, copias de seguridad y webhooks siempre quedan bloqueados sin importar esta lista."
  RESET_INTERVAL_MINUTES: "Intervalo de reinicio (minutos)"
  RESET_INTERVAL_MINUTES_HELP: "Con qué frecuencia se reinicia el contenido de demostración a la línea base capturada. Solo tiene efecto una vez que exista una línea base."
  RESET_ON_REQUEST: "Reiniciar al solicitar (perezoso)"
  RESET_ON_REQUEST_HELP: "Reinicia de forma oportunista al entrar solicitudes a la API cuando el contenido está desactualizado. Recomendado para instalaciones que no ejecutan `bin/grav scheduler` mediante cron."
  RESET_ON_SCHEDULE: "Reiniciar según programación"
  RESET_ON_SCHEDULE_HELP: "También registra una tarea del planificador, para instalaciones que ejecutan `bin/grav scheduler` mediante cron."
  SAFETY_SNAPSHOTS_TO_RETAIN: "Instantáneas de seguridad a conservar"
  SAFETY_SNAPSHOTS_TO_RETAIN_HELP: "Antes de cada reinicio se toma una instantánea de seguridad del contenido actual por si la propia línea base fuera incorrecta. Las instantáneas antiguas más allá de este número se eliminan."
  STANDARD_ACTIVITY_STREAM: "Estándar (flujo de actividad)"
  DETAILED_WITH_CHANGE_DIFFS: "Detallado (con diferencias de cambios)"
  INVISIBLE: "Invisible"
  CHECKBOX: "Casilla de verificación"
  PAGES: "Páginas"
  MEDIA: "Multimedia"
