  ACCESS_ADMIN_CONFIGURATION_SITE: "Manage Site Configuration"
  ACCESS_ADMIN_CONFIGURATION_MEDIA: "Manage Media Configuration"
  ACCESS_ADMIN_CONFIGURATION_SECURITY: "Manage Security Configuration"
  ACCESS_ADMIN_CONFIGURATION_INFO: "See Server Information"
  ACCESS_ADMIN_SETTINGS: "Settings"
  ACCESS_ADMIN_PAGES: "Manage Pages"
  ACCESS_ADMIN_MAINTENANCE: "Site Maintenance"
  ACCESS_ADMIN_STATISTICS: "Site Statistics"
  ACCESS_ADMIN_PLUGINS: "Manage Plugins"
  ACCESS_ADMIN_THEMES: "Manage Themes"
  ACCESS_ADMIN_TOOLS: "Access to Tools"
  ACCESS_ADMIN_USERS: "Manage Users"
  # User account form labels (fallbacks for PLUGIN_ADMIN.* keys)
  ACCOUNT: "Account"
  USERNAME: "Username"
  EMAIL: "Email"
  EMAIL_VALIDATION_MESSAGE: "Must be a valid email address"
  PASSWORD: "Password"
  PASSWORD_VALIDATION_MESSAGE: "Password must match the configured pattern"
  FULL_NAME: "Full Name"
  TITLE: "Title"
  LANGUAGE: "Language"
  LANGUAGE_HELP: "Set the language for this user"
  CONTENT_EDITOR: "Content Editor"
  CONTENT_EDITOR_HELP: "Override the content editor for this user"
  2FA_TITLE: "2-Factor Authentication"
  2FA_ENABLED: "2FA Enabled"
  2FA_SECRET: "2FA Secret"
  2FA_SECRET_HELP: "Scan the QR code with your Authenticator app"
  YUBIKEY_ID: "YubiKey ID"
  YUBIKEY_HELP: "Insert your YubiKey and click to generate an OTP. The first 12 chars are your client ID."
  YES: "Yes"
  NO: "No"
  PERMISSIONS: "Permissions"
  GROUPS: "Groups"
  GROUPS_HELP: "Assign user to groups for permission inheritance"
  ACCESS_LEVELS: "Access Levels"
  AVATAR_HASH: "Enter a unique identifier for your multiavatar"
  # Response compression
  COMPRESSION: "Response Compression"
  COMPRESSION_HELP: "Gzip large JSON responses (over 8 KB) for clients that accept it, which cuts page lists and translation downloads to a fraction of their size. Automatic leaves the output alone when PHP already compresses it. Choose Off to leave compression to the web server."
  COMPRESSION_AUTO: "Automatic"
  COMPRESSION_OFF: "Off"
  PLUGIN_STATUS: "Plugin Status"
  GENERAL: "General"
  GENERAL_SETTINGS: "General Settings"
  API_ROUTE: "API Route"
  API_ROUTE_HELP: "The base route for the API"
  VERSION_PREFIX: "Version Prefix"
  VERSION_PREFIX_HELP: "Current API version prefix"
  BACKEND: "Backend"
  FLEX_PAGES_BACKEND: "Flex Pages Backend"
  FLEX_PAGES_BACKEND_HELP: "Use Flex-Objects for page listings (faster search, filtering, and pagination)"
  FLEX_ACCOUNTS_BACKEND: "Flex Accounts Backend"
  FLEX_ACCOUNTS_BACKEND_HELP: "Use Flex-Objects for user listings (faster search and pagination)"
  KEEP_CACHE_FOR_API_REQUESTS: "Keep Cache for API Requests"
  KEEP_CACHE_FOR_API_REQUESTS_HELP: "Keep Grav's object cache on for API requests even when the global cache is turned off. Disabling the cache is a frontend-dev convenience (to see template changes live), but the API renders no frontend pages — so leaving this on keeps the admin fast while the frontend runs uncached. Turn off only if you need the API to honor the global cache setting."
  AUTHENTICATION: "Authentication"
  API_KEY_AUTHENTICATION: "API Key Authentication"
  JWT_AUTHENTICATION: "JWT Authentication"
  JWT_ACCESS_TOKEN_EXPIRY: "JWT Access Token Expiry"
  JWT_ACCESS_TOKEN_EXPIRY_HELP: "Access token lifetime in seconds"
  JWT_REFRESH_TOKEN_EXPIRY: "JWT Refresh Token Expiry"
  JWT_REFRESH_TOKEN_EXPIRY_HELP: "Refresh token lifetime in seconds"
  JWT_SIGNING_ALGORITHM: "JWT Signing Algorithm"
  JWT_SIGNING_ALGORITHM_HELP: "HMAC algorithm used to sign and verify API tokens. Only symmetric HS variants are supported because tokens are signed with a single shared secret. Leave on HS256 unless you have a specific reason to change it."
  SESSION_AUTHENTICATION: "Session Authentication"
  SESSION_AUTHENTICATION_HELP: "Allow existing admin sessions to access the API"
  API_KEY_VERIFICATION_CACHE: "API Key Verification Cache"
  API_KEY_VERIFICATION_CACHE_HELP: "How long (seconds) to remember a verified API key so repeat requests skip the deliberately-slow bcrypt check. Revoking, disabling or expiring a key still takes effect immediately. Set to 0 to verify every request."
  RELEASE_SESSION_LOCK_EARLY: "Release Session Lock Early"
  RELEASE_SESSION_LOCK_EARLY_HELP: "Commit the session right after authentication on read-only (GET) requests so the new admin's parallel calls don't queue behind PHP's per-session file lock. Recommended on. Turn off only if a custom read endpoint writes to the session."
  PROTECT_FRONTEND_SESSION: "Protect Front-end Session"
  PROTECT_FRONTEND_SESSION_HELP: "Keep API calls from touching the public site's session. Calls made with a token or API key and no session cookie skip the PHP session entirely, and any other call that arrives without its own session cookie never plants a new one. This stops the API from booting a visitor who is logged in to the public site in the same browser. Recommended on."
  TRANSLATION_OVERRIDES: "Translation Overrides"
  TRANSLATION_OVERRIDES_HELP: "Apply the translation overrides stored in user/languages so they also beat the active theme's own strings. Turning this off leaves the files in place but stops them overriding theme wording. Recommended on."
  ALLOW_DRAFT_PREVIEW: "Allow Draft Preview"
  ALLOW_DRAFT_PREVIEW_HELP: "Let the new admin's page editor preview an unpublished page on the front end. The preview is authorized by a short-lived token minted only for users who can read the page, so turning this off disables draft previews entirely. Recommended on."
  LOGIN_CAPTCHA: "Login Captcha"
  LOGIN_CAPTCHA_HELP: "Require a captcha challenge on the admin login form. The login is already rate-limited and supports per-account 2FA, so this is an extra layer rather than the only one."
  CAPTCHA_PROVIDER: "Captcha Provider"
  CAPTCHA_PROVIDER_HELP: "Cap is a proof-of-work challenge served by this plugin — no keys and no third-party service. Turnstile and reCAPTCHA require the Form plugin, and use the keys already configured there."
  CAPTCHA_MODE: "Captcha Mode"
  CAPTCHA_MODE_HELP: "Invisible solves in the background while the user types their credentials. Checkbox makes them click. Honored by Cap and Turnstile."
  GUARD_LOGIN: "Guard Login"
  GUARD_FORGOTTEN_PASSWORD: "Guard Forgotten Password"
  GUARD_FORGOTTEN_PASSWORD_HELP: "Recommended — the forgotten-password endpoint sends mail, which makes it a more attractive target than login itself."
  GUARD_FIRST_RUN_SETUP: "Guard First-run Setup"
  GUARD_FIRST_RUN_SETUP_HELP: "Only reachable on a site with no accounts yet."
  CAP_DIFFICULTY: "Cap Difficulty"
  CAP_DIFFICULTY_HELP: "Leading zero bits each sub-challenge must produce. Higher is more work for the client — raise only if you are seeing scripted attempts get through."
  CAP_SUB_CHALLENGES: "Cap Sub-challenges"
  CAP_SUB_CHALLENGES_HELP: "How many sub-challenges make up one captcha. The default takes well under a second on a phone."
  CORS: "CORS"
  CORS_SETTINGS: "CORS Settings"
  ENABLE_CORS: "Enable CORS"
  ALLOWED_ORIGINS: "Allowed Origins"
  ALLOWED_ORIGINS_HELP: "Exact origins (scheme + host) allowed to call the API from a browser, e.g. https://app.example.com. Empty means same-origin only. Avoid \"*\": it lets any website read authenticated responses, so a configured wildcard is honored only for unauthenticated endpoints."
  ALLOWED_METHODS: "Allowed Methods"
  ALLOWED_METHODS_HELP: "HTTP methods allowed for CORS requests"
  ALLOWED_HEADERS: "Allowed Headers"
  RATE_LIMITING: "Rate Limiting"
  ENABLE_RATE_LIMITING: "Enable Rate Limiting"
  REQUESTS_PER_WINDOW: "Requests Per Window"
  REQUESTS_PER_WINDOW_HELP: "Maximum number of requests per time window"
  TIME_WINDOW: "Time Window"
  TIME_WINDOW_HELP: "Rate limit window in seconds"
  CONTENT: "Content"
  MEDIA_METADATA: "Media Metadata"
  MAXIMUM_VALUE_LENGTH: "Maximum Value Length"
  MAXIMUM_VALUE_LENGTH_HELP: "Longest metadata value (characters) accepted when saving. Values are also stripped of HTML tags, since they render into image attributes on the site."
  EDITABLE_METADATA_FIELDS: "Editable Metadata Fields"
  EDITABLE_METADATA_FIELDS_HELP: "Descriptive fields shown in the media metadata editor. The key is written verbatim into the .meta.yaml sidecar. Any other keys (EXIF, dimensions, upload info) are left untouched on save."
  KEY: "Key"
  KEY_HELP: "Sidecar key, e.g. alt, title, caption. Letters, numbers, dot, dash and underscore only."
  LABEL: "Label"
  FIELD_TYPE: "Field Type"
  SINGLE_LINE: "Single line"
  MULTI_LINE: "Multi-line"
  TAGS_LIST: "Tags (list)"
  PAGE_STATISTICS: "Page Statistics"
  TRACK_PAGE_VIEWS: "Track Page Views"
  TRACK_PAGE_VIEWS_HELP: "Record frontend page views for the Page Statistics dashboard"
  EXCLUDE_LOGGED_IN_ADMINS: "Exclude Logged-in Admins"
  EXCLUDE_LOGGED_IN_ADMINS_HELP: "Skip page views made while logged in with admin access, so your own testing and demo visits do not skew the stats"
  EXCLUDED_IP_ADDRESSES: "Excluded IP Addresses"
  EXCLUDED_IP_ADDRESSES_HELP: "Visitor IPs or CIDR ranges to exclude from tracking, e.g. 203.0.113.7 or 203.0.113.0/24. IPv4 and IPv6 are both supported."
  EXCLUDE_NON_BROWSER_CLIENTS: "Exclude Non-Browser Clients"
  EXCLUDE_NON_BROWSER_CLIENTS_HELP: "Skip page views from command-line and library HTTP clients such as curl, wget, Go-http-client and python-requests. These report themselves as browsers rather than bots, so a scanner hitting your site would otherwise count as real traffic"
  EXCLUDED_USER_AGENTS: "Excluded User Agents"
  EXCLUDED_USER_AGENTS_HELP: "Additional User-Agent fragments to exclude from tracking, matched anywhere in the header and ignoring case, e.g. uptimerobot or my-scanner. Added to the built-in list above."
  AUDIT_TRAIL: "Audit Trail"
  ENABLE_AUDIT_TRAIL: "Enable Audit Trail"
  ENABLE_AUDIT_TRAIL_HELP: "Record API activity (logins, content, user, config, and package changes) to a queryable log shown under Tools. Visible to super admins only. Off by default."
  DETAIL_LEVEL: "Detail Level"
  DETAIL_LEVEL_HELP: "Standard records who did what, when, and from where. Detailed additionally captures field-level before/after values for page edits (more storage)."
  RETENTION_DAYS: "Retention (days)"
  RETENTION_DAYS_HELP: "Automatically delete entries older than this many days. Set 0 to keep entries indefinitely."
  MAXIMUM_ENTRIES: "Maximum Entries"
  MAXIMUM_ENTRIES_HELP: "Hard cap on stored entries; the oldest are trimmed once exceeded. Set 0 for no cap."
  ANONYMIZE_IP_ADDRESSES: "Anonymize IP Addresses"
  ANONYMIZE_IP_ADDRESSES_HELP: "Mask the last part of each IP before storing (last octet for IPv4, last 80 bits for IPv6), for GDPR-friendlier logs. Off keeps full addresses for forensic detail."
  CAPTURE_AUTHENTICATION: "Capture Authentication"
  CAPTURE_AUTHENTICATION_HELP: "Logins, failed logins, logouts, and password resets"
  CAPTURE_CONTENT_CHANGES: "Capture Content Changes"
  CAPTURE_CONTENT_CHANGES_HELP: "Page create, update, delete, move, and translate"
  CAPTURE_MEDIA_CHANGES: "Capture Media Changes"
  CAPTURE_MEDIA_CHANGES_HELP: "Media uploads and deletions"
  CAPTURE_USER_GROUP_CHANGES: "Capture User & Group Changes"
  CAPTURE_USER_GROUP_CHANGES_HELP: "User and group create, update, and delete"
  CAPTURE_CONFIGURATION_CHANGES: "Capture Configuration Changes"
  CAPTURE_CONFIGURATION_CHANGES_HELP: "System and plugin configuration updates"
  CAPTURE_PACKAGE_CHANGES: "Capture Package Changes"
  CAPTURE_PACKAGE_CHANGES_HELP: "Plugin and theme install, update, remove, and Grav upgrades"
  DEMO_MODE: "Demo Mode"
  DEMO_NOTICE: "Demo mode is turned on **per account**, by granting an account the *Demo Mode* access flag (`access.api.demo`) in its permissions. A demo account can browse everything but cannot save changes except to the resources below, and server paths, logs, and backups are hidden from it. Capture the baseline and reset the content from the **Set Baseline / Reset Now** panel, or with `bin/plugin api demo:baseline` and `bin/plugin api demo:reset`."
  WRITABLE_RESOURCES: "Writable Resources"
  WRITABLE_RESOURCES_HELP: "Resources a demo account may still create, update, or delete. Leave empty for a fully read-only demo; select Pages only to allow content editing without media uploads. Config, users, packages, system, backups, and webhooks are always blocked regardless of this list."
  RESET_INTERVAL_MINUTES: "Reset Interval (minutes)"
  RESET_INTERVAL_MINUTES_HELP: "How often demo content resets back to the captured baseline. Only takes effect once a baseline exists."
  RESET_ON_REQUEST: "Reset On Request (Lazy)"
  RESET_ON_REQUEST_HELP: "Reset opportunistically on incoming API requests when the content is stale. Recommended for installs that do not run `bin/grav scheduler` via cron."
  RESET_ON_SCHEDULE: "Reset On Schedule"
  RESET_ON_SCHEDULE_HELP: "Also register a Scheduler job, for installs that run `bin/grav scheduler` via cron."
  SAFETY_SNAPSHOTS_TO_RETAIN: "Safety Snapshots to Retain"
  SAFETY_SNAPSHOTS_TO_RETAIN_HELP: "A safety snapshot of the current content is taken before every reset, in case the baseline itself is wrong. Oldest snapshots beyond this count are purged."
  STANDARD_ACTIVITY_STREAM: "Standard (activity stream)"
  DETAILED_WITH_CHANGE_DIFFS: "Detailed (with change diffs)"
  INVISIBLE: "Invisible"
  CHECKBOX: "Checkbox"
  PAGES: "Pages"
  MEDIA: "Media"
