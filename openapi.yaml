  # ---------------------------------------------------------------------------
  # UI Extensions registries
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Scheduler
  # ---------------------------------------------------------------------------
  /scheduler/jobs:
    get:
      operationId: listSchedulerJobs
      tags: [Scheduler]
      summary: List scheduler jobs
      description: |
        Return all configured scheduler jobs with their cron expressions,
        enabled state, last run time, and error status. Requires
        `api.scheduler.read`.
      responses:
        "200":
          description: List of scheduler jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
              example:
                data:
                  - id: default-site-backup
                    command: Grav\Common\Backup\Backups::backup
                    expression: "0 3 * * *"
                    enabled: true
                    status: success
                    last_run: "2026-03-26T03:00:00+00:00"
                    last_run_trigger: cron
                    next_run: "2026-03-27T03:00:00+00:00"
                    overdue: false
                    error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scheduler/status:
    get:
      operationId: getSchedulerStatus
      tags: [Scheduler]
      summary: Get cron status
      description: |
        Return the current status of the system cron integration, including
        whether the cron tab entry is properly installed and the commands
        used. Requires `api.scheduler.read`. Every field is best-effort: a
        host that cannot report how its scheduler is triggered still gets a
        200. For demo accounts, `cron_command`, `scheduler_command` and
        `whoami` are replaced with `(hidden in demo mode)`.
      responses:
        "200":
          description: Scheduler status returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      crontab_status:
                        type: string
                        description: Whether the scheduler is being triggered by cron.
                        enum: [installed, not_installed, unknown]
                        example: installed
                      cron_detection:
                        type: string
                        description: How `crontab_status` was determined.
                        enum: [last-run, crontab, unavailable]
                        example: last-run
                      process_available:
                        type: boolean
                        description: Whether PHP can start processes (`proc_open`), which running jobs from the admin needs.
                        example: true
                      last_run:
                        type: string
                        format: date-time
                        nullable: true
                        description: Time of the last automated (non-manual) scheduler run.
                      last_manual_run:
                        type: string
                        format: date-time
                        nullable: true
                        description: Time of the last run started from the admin.
                      environment:
                        type: string
                        nullable: true
                        description: Environment this request booted with.
                        example: localhost
                      environment_has_overrides:
                        type: boolean
                        description: Whether that environment has config overrides that a plain CLI run would not load.
                      last_run_environment:
                        type: string
                        nullable: true
                        description: Environment of the last real run (`cli` for an unpinned crontab).
                        example: cli
                      cron_command:
                        type: string
                        description: The cron command as it should appear in the crontab.
                        example: "* * * * * cd /var/www/grav && bin/grav scheduler 1>> /dev/null 2>&1"
                      scheduler_command:
                        type: string
                        description: The Grav scheduler CLI command.
                        example: bin/grav scheduler
                      whoami:
                        type: string
                        description: System user running the cron process.
                        example: www-data
                      health:
                        type: object
                        description: Core's scheduler health report; empty when unavailable.
                        additionalProperties: true
                        properties:
                          status:
                            type: string
                            enum: [healthy, warning]
                          message:
                            type: string
                          last_run:
                            type: string
                            nullable: true
                          last_run_age:
                            type: integer
                            nullable: true
                            description: Seconds since the last run.
                          queue_size:
                            type: integer
                          failed_jobs_24h:
                            type: integer
                          scheduled_jobs:
                            type: integer
                          jobs_due:
                            type: integer
                          webhook_enabled:
                            type: boolean
                          health_check_enabled:
                            type: boolean
                          timestamp:
                            type: string
                            format: date-time
                      triggers:
                        type: array
                        description: Active trigger methods.
                        items:
                          type: string
                          enum: [cron, webhook]
                      webhook_installed:
                        type: boolean
                        description: Whether the scheduler-webhook plugin is installed.
                      webhook_enabled:
                        type: boolean
                        description: Whether the scheduler-webhook plugin is enabled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scheduler/history:
    get:
      operationId: getSchedulerHistory
      tags: [Scheduler]
      summary: Get job execution history
      description: |
        Return the most recent run of each scheduler job, ordered by run time
        (newest first) and paginated. Only the latest run per job is kept, so
        this lists one entry per job that has run, not every past run.
        Requires `api.scheduler.read`.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Paginated job execution history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            job_id:
                              type: string
                              example: default-site-backup
                            status:
                              type: string
                              description: Outcome of the last run (`unknown` when not recorded).
                              example: success
                            last_run:
                              type: string
                              format: date-time
                              nullable: true
                              example: "2026-03-26T03:00:00+00:00"
                            error:
                              type: string
                              nullable: true
                              description: Output of the last run when it failed.
                              example: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scheduler/run:
    post:
      operationId: triggerSchedulerRun
      tags: [Scheduler]
      summary: Trigger a scheduler run
      description: |
        Run scheduler jobs now, without waiting for cron.

        By default this runs every job that has missed the last slot its
        schedule gave it (`overdue`). That is almost always what is wanted from
        a manual trigger: a job is only "due" during the exact minute its cron
        expression names, so `due` mode from a button press usually runs
        nothing at all.

        Runs triggered this way are recorded as manual, and deliberately do not
        count as evidence that the scheduler is being triggered automatically.
        Pressing this on a site with no crontab will not make it report one.

        Requires `api.scheduler.write`. Returns 501 when PHP's `proc_open` is
        disabled on the host, and 400 for an unknown `mode`. For demo
        accounts each job's `output` is replaced with
        `(hidden in demo mode)`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [overdue, due, all]
                  default: overdue
                  description: >
                    `overdue` runs the jobs that missed their last scheduled
                    slot. `due` runs only what a cron tick this minute would
                    have run. `all` runs every enabled job whatever its
                    schedule says.
                job:
                  type: string
                  description: >
                    Run only this job, whatever its schedule says. Ignores
                    `mode`.
                  example: default-site-backup
                force:
                  type: boolean
                  description: "Legacy alias for `mode: all`."
                  default: false
            example:
              mode: overdue
      responses:
        "200":
          description: Scheduler run completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 2 jobs ran successfully.
                      mode:
                        type: string
                        enum: [overdue, due, all, job]
                        example: overdue
                      forced:
                        type: boolean
                        description: Whether the run used `all` mode.
                        example: false
                      jobs_run:
                        type: integer
                        description: Number of jobs that were executed.
                        example: 2
                      jobs_failed:
                        type: integer
                        description: How many of those jobs failed.
                        example: 0
                      duration:
                        type: number
                        description: Seconds the run took.
                        example: 3.41
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: default-site-backup
                            successful:
                              type: boolean
                              example: true
                            output:
                              type: string
                              description: Whatever the job wrote, trimmed.
                              example: ""
                      job_states:
                        type: object
                        description: |
                          Stored state of every job after the run, keyed by job
                          ID, as core records it (`state`, `last-run` Unix
                          timestamp, `trigger`, and `error` on failure).
                        additionalProperties:
                          type: object
                          additionalProperties: true
                          properties:
                            state:
                              type: string
                              enum: [success, failure]
                            last-run:
                              type: integer
                            trigger:
                              type: string
                              enum: [cron, manual]
                            error:
                              type: string
                              nullable: true
        "400":
          description: Unknown run mode.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No job with the requested id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The requested job is disabled.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Running jobs is not available because `proc_open` is disabled on the host.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /systeminfo:
    get:
      operationId: getSystemInfoAlias
      tags: [System]
      summary: Get system info overview
      description: |
        Return a system info overview including PHP info, Grav status, disk
        usage, plugin counts, and cache status. Requires
        `api.system.read`, the same as `GET /system/info`.
      responses:
        "200":
          description: System info returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      php:
                        type: object
                        description: PHP runtime details.
                        properties:
                          version:
                            type: string
                            example: 8.3.14
                          sapi:
                            type: string
                            example: fpm-fcgi
                          extensions:
                            type: array
                            items:
                              type: string
                          memory_limit:
                            type: string
                            example: 256M
                          max_execution_time:
                            type: string
                            example: "30"
                          upload_max_filesize:
                            type: string
                            example: 64M
                          post_max_size:
                            type: string
                            example: 64M
                      grav:
                        type: object
                        properties:
                          version:
                            type: string
                            example: 2.1.0
                          php_version:
                            type: string
                            example: 8.3.14
                      disk:
                        type: object
                        description: Disk usage of the volume holding the Grav root.
                        properties:
                          free_space:
                            oneOf:
                              - type: number
                              - type: boolean
                            description: Free disk space in bytes, or `false` when PHP cannot read it.
                            example: 21474836480
                          total_space:
                            oneOf:
                              - type: number
                              - type: boolean
                            description: Total disk space in bytes, or `false` when PHP cannot read it.
                            example: 53687091200
                      plugins:
                        type: object
                        properties:
                          total:
                            type: integer
                            example: 30
                          enabled:
                            type: integer
                            example: 24
                          disabled:
                            type: integer
                            example: 6
                      cache:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            example: true
                          driver:
                            type: string
                            example: auto
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Reports
  # ---------------------------------------------------------------------------
  /reports:
    get:
      operationId: getReports
      tags: [Reports]
      summary: Get plugin-extensible reports
      description: |
        Returns an array of diagnostic reports. Built-in reports are a
        Security Check (XSS scan, `security-check`), Twig in Content
        (`twig-content`) and a YAML Linter (`yaml-linter`). Plugins can add
        their own reports via the `onApiGenerateReports` event, optionally
        specifying a web component for custom rendering. Requires
        `api.reports.read`.

        The whole-site scans behind the built-in reports (the XSS check, the
        Twig leak check and the YAML linter) are cached until page content,
        configuration, the active language or theme, the Grav version, or a
        config, blueprint or environment YAML file changes. The recent Twig
        block events and reports added by plugins are always current.
      parameters:
        - name: refresh
          in: query
          description: When `true`, run the built-in scans again instead of using the cached result.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Reports returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique report identifier.
                          example: security-check
                        title:
                          type: string
                          description: Human-readable report title.
                          example: Grav Security Check
                        provider:
                          type: string
                          description: Source of the report (core or plugin name).
                          example: core
                        component:
                          type: string
                          nullable: true
                          description: Optional web component tag name for custom rendering.
                          example: null
                        status:
                          type: string
                          enum: [success, warning, error]
                          description: Overall report status.
                          example: success
                        message:
                          type: string
                          description: Summary message for the report.
                          example: "Security Scan complete: No issues found."
                        meta:
                          type: object
                          additionalProperties: true
                          description: |
                            Report-specific summary values. The `twig-content`
                            report sends `gate`, `sandbox`, `editor_enabled`,
                            `leak_count`, `event_count`,
                            `global_request_gated` and
                            `frontmatter_request_gated`.
                        items:
                          type: array
                          description: |
                            Report-specific detail items: `{route, field}` for
                            `security-check`, `{file, error}` for
                            `yaml-linter`, and `kind: leak` / `kind: event`
                            rows for `twig-content`.
                          items:
                            type: object
                            additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/twig-content/allowlist:
    post:
      operationId: addTwigSandboxAllowlistEntry
      tags: [Reports]
      summary: Add a blocked token to the Twig sandbox allowlist
      description: |
        Appends one token to the matching `security.twig_sandbox.allowed_*` list and saves it to `user/config/security.yaml`. The shipped defaults live in code, so the file only holds the site's own additions. The live config is updated, the standard cache is cleared and `onApiConfigUpdated` fires with scope `security`.

        Flat rules (`tag`, `filter`, `function`) de-duplicate case-insensitively. Class rules (`method`, `property`) need `class` and append to that class's row (or add a new row).

        Ring-buffer events matching the rule, token and class are removed, so the report stops listing a block that is now allowed; `resolved` counts them.

        Super admin only. An API key needs `admin.super` in its scopes; demo accounts are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule, token]
              properties:
                rule:
                  type: string
                  enum: [tag, filter, function, method, property]
                  description: Sandbox rule the token was blocked by (the suffix of a `sandbox_*` event type).
                token:
                  type: string
                  description: The tag, filter, function, method or property name to allow.
                  example: dump
                class:
                  type: string
                  description: Owning class. Required for `method` and `property`, ignored otherwise.
                  example: Grav\Common\Page\Page
            example:
              rule: filter
              token: markdown
      responses:
        "200":
          description: Token added (or already present) and the allowlist saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rule:
                        type: string
                        example: filter
                      key:
                        type: string
                        description: The `security.twig_sandbox` key that was written.
                        enum: [allowed_tags, allowed_filters, allowed_functions, allowed_methods, allowed_properties]
                        example: allowed_filters
                      value:
                        description: The full new value of that key. A list of names for flat rules, or a list of `{class, methods}` rows for class rules.
                        oneOf:
                          - type: array
                            items:
                              type: string
                          - type: array
                            items:
                              $ref: "#/components/schemas/TwigContentClassMembersRow"
                        example: [markdown]
                      resolved:
                        type: integer
                        description: Number of ring-buffer events removed because this addition resolved them.
                        example: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/twig-content/events:
    delete:
      operationId: clearTwigContentEvents
      tags: [Reports]
      summary: Clear the Twig in Content event log
      description: |
        Empties the ring buffer of recent blocked or blanked content-Twig tokens that the Twig in Content report and the page-editor banner read. `logs/security.log` is untouched.

        Requires `api.system.write` (not the report's read permission), so demo accounts cannot clear it.
      responses:
        "200":
          description: Buffer cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cleared:
                        type: boolean
                        description: True when the buffer file was removed or did not exist; false if it could not be deleted.
                        example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/twig-content/page:
    get:
      operationId: getTwigContentPageStatus
      tags: [Reports]
      summary: Get Twig in Content status for one page
      description: |
        Single-page status for the page-editor banner: whether this page would show raw `{{ }}` / `{% %}` markers to visitors, and the recent blocked events recorded for its route. Checks one page rather than scanning the site.

        `leak` is null when the page has no Twig markers, uses modular/theme Twig, will render its Twig normally, or cannot be found (a missing page is not an error). `events` only includes buffer entries whose `route` matches the query value exactly.

        Requires `api.reports.read`.
      parameters:
        - name: route
          in: query
          required: true
          description: Page route, with leading slash.
          schema:
            type: string
          example: /blog/my-first-post
      responses:
        "200":
          description: Page status returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      route:
                        type: string
                        example: /blog/my-first-post
                      gate:
                        type: boolean
                        description: Value of `security.twig_content.process_enabled`, the master gate.
                        example: false
                      sandbox:
                        type: boolean
                        description: Value of `security.twig_sandbox.enabled`.
                        example: true
                      leak:
                        type: object
                        allOf:
                          - $ref: "#/components/schemas/TwigContentLeak"
                        nullable: true
                      events:
                        type: array
                        description: Recent events for this route, newest first.
                        items:
                          $ref: "#/components/schemas/TwigContentEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/twig-content/scan:
    get:
      operationId: scanTwigContentUsage
      tags: [Reports]
      summary: Scan page content for Twig the sandbox would block
      description: |
        Walks every page (skipping modular/theme Twig) and lists the Twig tags, filters and functions used in content that the effective sandbox allowlists do not permit, meaning what content would need before the gate is switched on. It is a lexical approximation; the authoritative signal is the render-time events in the report.

        Each list maps a token to the routes that use it. PHP encodes an empty map as `[]`, so a list with no findings arrives as an empty array rather than `{}`.

        Requires `api.reports.read`. Cost grows with the number of pages.
      responses:
        "200":
          description: Scan results returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tags:
                        $ref: "#/components/schemas/TwigContentTokenRoutes"
                      filters:
                        $ref: "#/components/schemas/TwigContentTokenRoutes"
                      functions:
                        $ref: "#/components/schemas/TwigContentTokenRoutes"
              example:
                data:
                  tags:
                    include: [/blog/my-first-post]
                  filters:
                    raw: [/about]
                  functions:
                    source: [/about, /contact]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/twig-content/sandbox-policy:
    get:
      operationId: getTwigSandboxPolicy
      tags: [Reports]
      summary: Get the effective Twig sandbox policy
      description: |
        Read-only breakdown of the page-content Twig sandbox: for each list, the built-in defaults from code, the site's additive `allowed_*` entries, its `denied_*` removals, and the effective result. Built from configuration only; additions made by plugins through `onBuildTwigSandboxPolicy` are not included.

        Requires `api.reports.read`.
      responses:
        "200":
          description: Policy returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Value of `security.twig_sandbox.enabled`.
                        example: true
                      config_access:
                        type: boolean
                        description: Value of `security.twig_content.config_access`.
                        example: false
                      lists:
                        type: object
                        properties:
                          tags:
                            $ref: "#/components/schemas/TwigContentSandboxFlatList"
                          filters:
                            $ref: "#/components/schemas/TwigContentSandboxFlatList"
                          functions:
                            $ref: "#/components/schemas/TwigContentSandboxFlatList"
                          methods:
                            $ref: "#/components/schemas/TwigContentSandboxClassList"
                          properties:
                            $ref: "#/components/schemas/TwigContentSandboxClassList"
                      config_denied_paths:
                        type: object
                        description: Config paths hidden from content Twig.
                        properties:
                          defaults:
                            type: array
                            items:
                              type: string
                          added:
                            type: array
                            items:
                              type: string
                          effective:
                            type: array
                            items:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Audit trail
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Sidebar
  # ---------------------------------------------------------------------------
  /sidebar/items:
    get:
      operationId: getSidebarItems
      tags: [Sidebar]
      summary: Get admin sidebar navigation items
      description: |
        Returns an array of sidebar navigation items contributed by installed
        plugins through the `onApiSidebarItems` event. Each item defines a
        route, label, icon, and optional badge for rendering in the admin
        sidebar. Requires `api.access`.

        Items whose `authorize` permission (a string, or an array meaning
        any-of) the caller lacks are left out, and `authorize` itself is
        removed from the response. Labels are translated into the caller's
        admin language, and items are sorted by `priority`, highest first.
      responses:
        "200":
          description: Sidebar items returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SidebarItem"
              example:
                data:
                  - id: dashboard
                    plugin: admin-next
                    label: Dashboard
                    icon: gauge
                    route: /dashboard
                    priority: 100
                    badge: null
                  - id: pages
                    plugin: admin-next
                    label: Pages
                    icon: file-text
                    route: /pages
                    priority: 90
                    badge: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # MCP
  # ---------------------------------------------------------------------------
  /mcp/tools:
    get:
      operationId: getMcpTools
      tags: [MCP]
      summary: Get the MCP tools contributed by plugins
      description: |
        Return every MCP tool the enabled plugins describe, either in an
        `mcp.yaml` manifest at the plugin root or through the `onApiMcpTools`
        event. An MCP server calls this at startup and registers one tool per
        entry.

        Tools are filtered by the caller's permissions: a tool naming a
        permission the caller does not hold is left out, tools naming no
        permission are always included, and a super admin sees everything.
        `plugins[].tools` counts what this caller can see.

        `fingerprint` hashes the enabled-plugin set plus the manifest file
        modification times, so a client can tell whether anything changed
        without diffing the list. It is also the response's `ETag`, and a
        matching `If-None-Match` gets a 304.

        Requires `api.access`.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: A previously received `ETag`; when it still matches, the response is an empty 304.
          schema:
            type: string
          example: '"5f1d9c2a7b3e4d08"'
      responses:
        "200":
          description: Tool manifests returned successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tools:
                        type: array
                        items:
                          $ref: "#/components/schemas/McpTool"
                      plugins:
                        type: array
                        description: The contributing plugins, with the number of tools this caller can see.
                        items:
                          type: object
                          properties:
                            slug:
                              type: string
                              example: kahunacart
                            name:
                              type: string
                              nullable: true
                              example: KahunaCart
                            version:
                              type: string
                              nullable: true
                              example: 0.1.0
                            tools:
                              type: integer
                              example: 48
                      warnings:
                        type: array
                        description: One entry per manifest entry that was skipped, and why. Contains no secrets.
                        items:
                          type: string
                        example:
                          - "kahunacart: tool 'upload_image' skipped: unsupported schema keyword 'oneOf' at properties.file"
                      fingerprint:
                        type: string
                        description: Identity of the manifest set, also sent as the ETag.
                        example: 5f1d9c2a7b3e4d08
              example:
                data:
                  tools:
                    - name: kahunacart_list_products
                      plugin: kahunacart
                      title: List products
                      description: List catalog products with paging, search and status filters.
                      method: GET
                      path: /kahunacart/products
                      permission: kahunacart.products.manage
                      annotations:
                        readOnly: true
                        destructive: false
                        idempotent: true
                      input_schema:
                        type: object
                        properties:
                          q:
                            type: string
                      path_params: []
                      query: []
                  plugins:
                    - slug: kahunacart
                      name: KahunaCart
                      version: 0.1.0
                      tools: 48
                  warnings: []
                  fingerprint: 5f1d9c2a7b3e4d08
        "304":
          description: The manifest set has not changed since the ETag the client sent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  /dashboard/notifications:
    get:
      operationId: getDashboardNotifications
      tags: [Dashboard]
      summary: Get notifications
      description: |
        Return current notifications for the dashboard, grouped by location.
        Notifications are fetched from getgrav.org and cached per user for
        `system.session.timeout` seconds; plugins can add or change them
        through the `onApiDashboardNotifications` event. Notifications the
        caller has hidden are left out (until their `reappear_after` delay
        passes). A failed fetch is silent and returns the cached copy.
        Requires `api.system.read`.
      parameters:
        - name: location
          in: query
          description: |
            Return only this location (e.g. `feed`, `dashboard-row`). The
            result still has the `{location: [...]}` structure, with an empty
            list when the location has no notifications.
          schema:
            type: string
          example: feed
        - name: force
          in: query
          description: When `true`, bypass the notification cache and fetch fresh data.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notifications returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      notifications:
                        type: object
                        description: Notifications keyed by location, newest first.
                        additionalProperties:
                          type: array
                          items:
                            $ref: "#/components/schemas/Notification"
                      last_checked:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the cache was last refreshed before this request, or `null` if never.
              example:
                data:
                  notifications:
                    feed:
                      - id: 214
                        date: "2026-07-31 12:00"
                        type: info
                        location: [feed]
                        message: Run a real community on your own site with **Forum Pro** for Grav 2, now available.
                        link: https://getgrav.org/premium/forum-pro
                  last_checked: "2026-09-21T08:00:00+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/notifications/{id}/hide:
    post:
      operationId: hideNotification
      tags: [Dashboard]
      summary: Dismiss a notification
      description: |
        Mark a notification as hidden/dismissed for the calling user so it no
        longer appears in the dashboard. The hide time is recorded, so a
        notification with `reappear_after` comes back later. The ID is not
        checked against known notifications, but it must look like one: 1-64
        letters, digits, `.`, `_` or `-`, starting with a letter or digit
        (getgrav.org uses numbers, plugins use slugs such as `login-lockout`);
        anything else is 422. Hiding an already hidden notification is fine.
        Requires `api.system.write`.
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID.
          schema:
            type: string
          example: "214"
      responses:
        "204":
          description: Notification dismissed. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/feed:
    get:
      operationId: getDashboardFeed
      tags: [Dashboard]
      summary: Get news feed
      description: |
        Return up to 10 of the latest posts from the getgrav.org blog Atom
        feed. The feed is cached per user for `system.session.timeout`
        seconds, and a failed fetch is silent and returns the cached copy.
        Requires `api.system.read`.
      parameters:
        - name: force
          in: query
          description: When `true`, bypass the feed cache and fetch fresh data.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Feed items returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      feed:
                        type: array
                        items:
                          $ref: "#/components/schemas/FeedItem"
                      last_checked:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the cache was last refreshed before this request, or `null` if never.
              example:
                data:
                  feed:
                    - title: Grav 2.1 Released
                      url: https://getgrav.org/blog/grav-2-1-released
                      date: "2026-09-11T12:00:00+00:00"
                      summary: ""
                  last_checked: "2026-09-21T08:00:00+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [Dashboard]
      summary: Get statistics snapshot
      description: |
        Return a summary of site statistics suitable for rendering a
        dashboard overview, including available GPM updates. The update
        figures come only from the repository data GPM already has on disk;
        this endpoint never contacts the package server. When that data is
        missing or expired (for example right after a cache clear),
        `plugins.updatable`, `themes.updatable`, `themes.active_updatable` and
        `grav.updatable` are `null`, meaning unknown. `GET /gpm/updates`
        refreshes the data. Requires `api.system.read`.
      responses:
        "200":
          description: Dashboard stats returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardStats"
              example:
                data:
                  pages:
                    total: 42
                    published: 40
                  users:
                    total: 5
                  plugins:
                    total: 12
                    active: 10
                    updatable: 2
                  themes:
                    total: 2
                    updatable: 0
                    active_updatable: false
                  grav:
                    updatable: false
                  media:
                    total: 120
                  theme: quark
                  grav_version: 2.1.0
                  php_version: 8.3.14
                  last_backup: "2026-03-26T03:00:00+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/popularity:
    get:
      operationId: getDashboardPopularity
      tags: [Dashboard]
      summary: Get page view statistics
      description: |
        Return page view statistics from the admin popularity tracker.
        Includes daily chart data (last 14 days, oldest first), summary
        counters (today, the last 7 days, this calendar month), and the top
        10 pages by total views. Requires `api.system.read`.
      responses:
        "200":
          description: Page view statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          today:
                            type: integer
                            example: 12
                          week:
                            type: integer
                            example: 84
                          month:
                            type: integer
                            example: 312
                      chart:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              example: "Mar 28"
                            views:
                              type: integer
                              example: 27
                      top_pages:
                        type: array
                        items:
                          type: object
                          properties:
                            route:
                              type: string
                              example: "/blog"
                            views:
                              type: integer
                              example: 30
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/widgets:
    get:
      operationId: getDashboardWidgets
      tags: [Dashboard]
      summary: Get the resolved dashboard widget list
      description: |
        Returns the widgets for the Admin Next dashboard, merged from the built-in core registry, plugin contributions (`onApiDashboardWidgets`), the site default layout, and the current user's layout. Widgets whose `authorize` permission the user lacks are left out (super-admins within their API-key scope see every widget), and widgets the site layout hides are removed entirely so a user cannot re-enable them. Each widget is annotated with its effective `visible`, `size` and `order`, and the list is sorted by `order`.

        Requires `api.access`. This endpoint exists to support Admin Next.
      responses:
        "200":
          description: Widget list and layouts returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardWidgetsResult"
              example:
                data:
                  widgets:
                    - id: core.stats
                      source: core
                      label: ADMIN_NEXT.DASHBOARD.WIDGETS.STATS
                      icon: BarChart3
                      sizes: [md, lg, xl]
                      defaultSize: xl
                      priority: 100
                      visible: true
                      size: xl
                      order: 9000
                  user_layout: {}
                  site_layout: {}
                  can_edit_site: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/layout:
    patch:
      operationId: updateDashboardUserLayout
      tags: [Dashboard]
      summary: Save the current user's dashboard layout
      description: |
        Saves the calling user's dashboard layout to `admin_next.dashboard` in their account YAML. Despite the PATCH verb the stored layout is replaced as a whole: send every widget entry you want kept. Entries without a string `id` are dropped, `size` values outside `xs`-`xl` are stored as `null`, and an entry without a numeric `order` is stored without one, so that widget keeps its priority-based position.

        Requires `api.access`. Demo accounts are refused. Returns the resolved widget list, the same as `GET /dashboard/widgets`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardWidgetLayout"
            example:
              preset: custom
              widgets:
                - id: core.stats
                  visible: true
                  size: lg
                  order: 10
                - id: core.news-feed
                  visible: false
                  order: 20
      responses:
        "200":
          description: Layout saved; resolved widget list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardWidgetsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/site-layout:
    patch:
      operationId: updateDashboardSiteLayout
      tags: [Dashboard]
      summary: Save the site-wide default dashboard layout
      description: |
        Saves the default dashboard layout for every user to `dashboard.site_layout` in `user/config/admin-next.yaml`. The stored layout is replaced as a whole. A widget marked `visible: false` here is hidden for all users and cannot be re-enabled per user; sizes and orders act as defaults that user layouts can override.

        Requires super-admin (`admin.super`, subject to the API-key scope cap). Demo accounts are refused. Returns the resolved widget list for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardWidgetLayout"
      responses:
        "200":
          description: Site layout saved; resolved widget list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardWidgetsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/security/exposure-probe:
    get:
      operationId: getDashboardExposureProbe
      tags: [Dashboard]
      summary: Get storage exposure probe URLs
      description: |
        Supports the Admin Next security check that tests whether private storage folders are reachable over HTTP. For each of `user://data`, `backup://` and `tmp://` that lives inside the web root, the server makes sure a sentinel file `grav-security-probe.{dat,txt,zip,json}` exists (creating it with a random hex token if missing, never overwriting an existing file or following a symlink) and returns its public URL and token.

        The browser then requests each URL through the site's real web server: if the response body matches the token, that folder and extension are publicly exposed. Folders relocated outside the web root are skipped. The top-level `url`, `token` and `available` fields repeat the first `user://data` probe for older Admin Next builds.

        Note that this GET creates files on first call. Requires `api.system.read`.
      responses:
        "200":
          description: Probe list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardExposureProbeResult"
              example:
                data:
                  url: https://example.com/user/data/grav-security-probe.dat
                  token: 3f9c2a7e5b1d4c8a9e0f6b2d7c4a1e8f
                  available: true
                  probes:
                    - location: user/data
                      extension: dat
                      url: https://example.com/user/data/grav-security-probe.dat
                      token: 3f9c2a7e5b1d4c8a9e0f6b2d7c4a1e8f
                      available: true
                    - location: tmp
                      extension: txt
                      url: https://example.com/tmp/grav-security-probe.txt
                      token: 8b1e4d7a2c9f0e3b6a5d8c1f4e7b0a2d
                      available: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # GPM: Grav changelog + Admin Next extension scripts
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Webhooks
  # ---------------------------------------------------------------------------
  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhooks
      description: |
        Return all configured outbound webhooks with their event
        subscriptions and enabled state. Secrets are masked. Requires
        `api.webhooks.read`.
      responses:
        "200":
          description: List of webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
              example:
                data:
                  - id: wh_abc123
                    url: https://example.com/hooks/grav
                    secret: whsec_************************************************a1b2
                    events:
                      - page.created
                      - page.updated
                    enabled: true
                    headers: {}
                    created: 1774008000
                    failure_count: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook
      description: |
        Register a new outbound webhook. The response includes a
        `secret` field that can be used to verify delivery signatures.
        The secret is only returned once at creation time. Requires
        `api.webhooks.write`.

        The URL must be a well-formed `http` or `https` URL whose host
        resolves only to public addresses (private, loopback, link-local
        and reserved targets are rejected with 422), `events` must be an
        array whose every entry is one of the names listed in the `Webhook`
        schema, and `headers` must be an object of header names to string
        values. Custom headers may not use `X-Grav-Signature`,
        `X-Grav-Event` or `X-Grav-Delivery` (in any letter case) or contain
        line breaks; each of these is a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: Destination URL for webhook deliveries.
                  example: https://example.com/hooks/grav
                events:
                  type: array
                  items:
                    type: string
                  description: |
                    Event types to subscribe to. When omitted, the webhook
                    is subscribed to `*` (all events).
                  default: ["*"]
                  example: [page.created, page.updated, page.deleted]
                enabled:
                  type: boolean
                  description: Whether the webhook is active.
                  default: true
                headers:
                  type: object
                  additionalProperties:
                    type: string
                  description: |
                    Custom HTTP headers to include in deliveries. They may
                    override `Content-Type` and `User-Agent`; the signing
                    headers (`X-Grav-Signature`, `X-Grav-Event`,
                    `X-Grav-Delivery`) are always set by Grav and cannot be
                    replaced.
                  example: {}
            example:
              url: https://example.com/hooks/grav
              events: [page.created, page.updated]
              enabled: true
      responses:
        "201":
          description: Webhook created. The `secret` is returned only once.
          headers:
            Location:
              description: URL of the newly created webhook resource.
              schema:
                type: string
                example: /api/v1/webhooks/wh_abc123
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Webhook"
                      - type: object
                        properties:
                          secret:
                            type: string
                            description: |
                              HMAC secret for verifying delivery signatures.
                              Store it securely -- it is shown only once.
                            example: whsec_0123456789abcdef0123456789abcdef0123456789abcdef
              example:
                data:
                  id: wh_abc123
                  url: https://example.com/hooks/grav
                  secret: whsec_0123456789abcdef0123456789abcdef0123456789abcdef
                  events: [page.created, page.updated]
                  enabled: true
                  headers: {}
                  created: 1774526400
                  failure_count: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Get a webhook
      description: Retrieve a single webhook by its ID. The secret is masked. Requires `api.webhooks.read`.
      parameters:
        - $ref: "#/components/parameters/webhookId"
      responses:
        "200":
          description: Webhook returned.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Update a webhook
      description: |
        Partially update a webhook. Only the fields included in the request
        body are modified; the secret cannot be changed and is masked in the
        response. `url`, `events` and `headers` are validated as on create
        (422).
        Requires `api.webhooks.write`.
      parameters:
        - $ref: "#/components/parameters/webhookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  example: https://example.com/hooks/grav-v2
                events:
                  type: array
                  items:
                    type: string
                  example: [page.created, page.updated, page.deleted]
                enabled:
                  type: boolean
                  example: true
                headers:
                  type: object
                  additionalProperties:
                    type: string
            example:
              url: https://example.com/hooks/grav-v2
              events: [page.created, page.updated, page.deleted]
      responses:
        "200":
          description: Webhook updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook
      description: Permanently remove a webhook and all its delivery history. Requires `api.webhooks.write`.
      parameters:
        - $ref: "#/components/parameters/webhookId"
      responses:
        "204":
          description: Webhook deleted. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List webhook deliveries
      description: |
        Return a paginated log of deliveries for a specific webhook,
        ordered newest first. Only the 50 most recent deliveries are kept.
        Requires `api.webhooks.read`.
      parameters:
        - $ref: "#/components/parameters/webhookId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Paginated delivery log.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks/{id}/test:
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Send a test delivery
      description: |
        Send a test payload to the webhook's URL to verify connectivity.
        The test event type is `test`. The delivery is recorded in the
        delivery log and counts toward the failure counter like any other.
        Requires `api.webhooks.write`.
      parameters:
        - $ref: "#/components/parameters/webhookId"
      responses:
        "200":
          description: Test delivery sent and the receiver answered with a 2xx status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WebhookDelivery"
        "502":
          description: |
            The test delivery failed (non-2xx answer or transport error). The
            body is the same delivery record, with `success: false`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Blueprints
  # ---------------------------------------------------------------------------
  /blueprints/pages:
    get:
      operationId: listPageTypes
      tags: [Blueprints]
      summary: List available page templates
      description: |
        Returns all page template types available in the active theme.
        Requires `api.pages.read`. Templates hidden through
        `plugins.admin.hide_page_types` (or `hide_modular_page_types`) are
        left out, and plugins can adjust the list through the
        `onAdminPageTypes` / `onAdminModularPageTypes` events.
      parameters:
        - name: modular
          in: query
          required: false
          description: |
            When `1`, `true` or `yes`, return modular templates (the ones used
            as sub-pages of a modular parent) instead of regular templates.
          schema:
            type: string
            default: "false"
          example: "true"
      responses:
        "200":
          description: List of page types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: blog
                        label:
                          type: string
                          example: Blog
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /blueprints/pages/{template}:
    get:
      operationId: getPageBlueprint
      tags: [Blueprints]
      summary: Get resolved blueprint for a page template
      description: |
        Returns the fully resolved blueprint for the given page template.
        Inheritance via `extends@` and `import@` directives is resolved
        server-side, producing a complete field tree ready for client-side
        form rendering. Requires `api.pages.read`.

        A template with no blueprint of its own (for example one left over
        after a theme switch) falls back to the `default` page blueprint.
        Plugins can adjust the fields through the `onApiBlueprintResolved`
        event (context `page`).
      parameters:
        - name: template
          in: path
          required: true
          schema:
            type: string
          description: |
            Page template name (e.g., `default`, `blog`, `item`). Modular
            templates include their folder, sent with an unencoded slash
            (`modular/hero`).
          example: blog
      responses:
        "200":
          description: Resolved blueprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

