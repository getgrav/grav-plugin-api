openapi: 3.0.3

info:
  title: Grav CMS API
  description: |
    RESTful API for managing Grav CMS content, media, configuration, users, and
    system operations.

    ## Authentication

    The API supports three authentication methods. All three provide the same
    level of access — the authenticated user's permissions apply regardless of
    method. Every request (except `/auth/*` endpoints) must include one of:

    | Method | Header / mechanism | Best for |
    |---|---|---|
    | **API key** | `X-API-Key: grav_...` | CLI tools, MCP servers, server-to-server, automation |
    | **JWT token** (recommended) | `X-API-Token: <token>` | SPAs, mobile apps, admin-next plugin bundles |
    | **JWT Bearer token** (alt) | `Authorization: Bearer <token>` | Standard HTTP clients on hosts that don't strip the header |
    | **Session cookie** | `grav-site` cookie | Admin panel extensions |

    > Prefer `X-API-Token` over `Authorization: Bearer` when portability matters:
    > PHP under FastCGI / CGI / PHP-FPM (notably MAMP's `mod_fastcgi`) silently
    > strips `Authorization` before it reaches the application. A custom `X-*`
    > header bypasses this entirely. The server accepts either transport for the
    > same JWT.

    **API keys** are long-lived credentials that don't expire by default. Generate
    them via `bin/plugin api keys:generate` or the admin panel. Best for any
    server-side or automated integration.

    **JWT tokens** are short-lived (1 hour default). Obtain them by posting
    credentials to `/auth/token`, then refresh before expiry via `/auth/refresh`.
    The refresh flow uses token rotation — each refresh revokes the previous
    refresh token. Best for client-side apps where long-lived secrets shouldn't
    be stored.

    ## Response Envelope

    All successful responses use a standard JSON envelope:

    ```json
    {
      "data": { ... },
      "meta": { ... },
      "links": { ... }
    }
    ```

    `meta` and `links` are present only on paginated responses.

    ## Error Format (RFC 7807)

    Error responses use `application/problem+json`:

    ```json
    {
      "status": 422,
      "title": "Unprocessable Entity",
      "detail": "Missing required fields: title",
      "errors": [
        { "field": "title", "message": "The 'title' field is required." }
      ]
    }
    ```

    ## Environments

    Send the optional `X-Grav-Environment` header to target a specific Grav
    environment. If omitted, defaults to the auto-detected environment (from
    hostname). Use `GET /system/environments` to discover available environments.

    ## Rate Limiting

    When rate limiting is enabled, every response includes:

    - `X-RateLimit-Limit` -- maximum requests per window
    - `X-RateLimit-Remaining` -- requests remaining
    - `X-RateLimit-Reset` -- UTC epoch when the window resets

    ## Compression

    JSON responses larger than 8 KB are gzipped when the request's
    `Accept-Encoding` allows it, and every JSON response carries
    `Vary: Accept-Encoding`. Smaller bodies, `304` and `204` responses, `HEAD`
    requests, downloads (`Content-Disposition`) and hosts where PHP already
    compresses its output (`zlib.output_compression`) are sent as they are.
    Set `plugins.api.compression: off` to turn it off.

    ## Sessions

    Requests that carry `X-API-Token`, `X-API-Key` or `Authorization: Bearer`
    run without a PHP session: no session cookie is read or sent, and no
    `Expires` / `Pragma` headers from PHP's session cache limiter are added.
    Requests signed in by the session cookie alone keep their session, and so
    do the SSO `start` and `callback` routes. `plugins.api.protect_frontend_session: false`
    restores the old behaviour.

    ## Optimistic Concurrency (ETags)

    Single-resource GET responses include an `ETag` header. For PATCH requests,
    send the same value in `If-Match` to detect mid-air collisions. A `409
    Conflict` response is returned when the resource has changed since the last
    GET.
  version: 1.0.0-beta.1
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team Grav
    url: https://getgrav.org
    email: devs@getgrav.org

servers:
  - url: "{baseUrl}/api/v1"
    description: Default Grav CMS API server
    variables:
      baseUrl:
        default: ""
        description: >
          The base URL of the Grav installation. Leave empty when using
          relative paths, or set to a full origin such as
          https://example.com.

tags:
  - name: Auth
    description: JWT token management -- obtain, refresh, and revoke tokens.
  - name: Pages
    description: Create, read, update, delete, move, and copy Grav pages.
  - name: Media
    description: Manage media files attached to pages or the site-level images folder.
  - name: Config
    description: Read and update Grav configuration (system, site, plugins, themes).
  - name: Users
    description: User account and API key management.
  - name: System
    description: System information, cache management, logs, and backups.
  - name: Languages
    description: Site language configuration and page translations.
  - name: GPM
    description: Package management -- install, remove, update plugins, themes, and Grav core.
  - name: Scheduler
    description: Job scheduling, status, and execution history.
  - name: Sidebar
    description: Admin sidebar navigation items contributed by plugins.
  - name: MCP
    description: Tool manifests contributed by plugins, for an MCP server to offer to a model.
  - name: Dashboard
    description: Notifications, news feed, and statistics.
  - name: Webhooks
    description: Outbound webhook configuration and delivery management.
  - name: Blueprints
    description: Form schema definitions for pages, plugins, themes, and system configuration. Blueprints define the fields, types, validation, and layout used to render editing interfaces.
  - name: Data
    description: Resolve blueprint data-options@ directives and other dynamic data lookups.
  - name: Thumbnails
    description: Serve cached image thumbnails.
  - name: Menubar
    description: Admin toolbar buttons contributed by plugins, and the actions they run.
  - name: Groups
    description: User groups and the access rules they grant, stored in `user/config/groups.yaml`.
  - name: Demo
    description: Demo-mode engine control -- reset status, baseline capture, and on-demand resets.
  - name: Reports
    description: Diagnostic reports, plus the Twig in Content report's per-page status, content scan, sandbox policy and allowlist actions.
  - name: Audit
    description: Read-only access to the admin audit trail (super admins only, off by default).
  - name: Translations Editor
    description: Browse this site's translation strings across every source and edit its per-language overrides in `user/languages`. Authenticated, unlike the public `/translations/{lang}` dictionary.
  - name: Admin Next
    description: |
      UI preferences and site branding for Admin Next (admin2). These endpoints exist to support the Admin Next single-page admin: site-wide defaults, per-user overrides, and the logo/favicon/sign-in copy stored in `user/config/admin-next.yaml`. Other clients can use them, but the payloads follow what Admin Next needs.
  - name: UI Extensions
    description: |
      Registries that let plugins and themes extend the Admin Next (admin2) interface: custom blueprint field types, editor toolbar buttons, floating widgets, page-editor context panels, and Settings page panels. Each list is collected at request time from an `onApi*` event, so its contents depend on which plugins are enabled. The matching JavaScript web components are served by the `/gpm/.../*-script` and `/gpm/.../field(s)` endpoints (tag GPM).

security:
  - apiToken: []
  - apiKey: []
  - bearerAuth: []
  - sessionAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/token:
    post:
      operationId: createToken
      tags: [Auth]
      summary: Obtain a JWT token pair
      description: |
        Authenticate with username and password to receive an access token and a
        refresh token. The access token is short-lived; use the refresh token to
        obtain a new pair without re-authenticating.

        If the site requires a login captcha, `captcha_token` is mandatory and
        the request fails with 422 without it. Call `GET /auth/captcha` first to
        find out.

        Every token pair carries the `user` profile (resolved permissions and
        demo-mode state, the same data `GET /me` returns). When the account has
        2FA enabled, the response is an `AuthTwoFactorChallenge` (`requires_2fa:
        true` plus a `challenge_token`) instead of tokens; finish the login with
        `POST /auth/2fa/verify`.

        The account must be a super admin or hold `admin.login` or `api.access`,
        and must not be disabled; otherwise the request fails with 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: Pa$$w0rd!
                captcha_token:
                  type: string
                  description: >-
                    A solved captcha, required only when the site has a login
                    captcha configured. For the built-in `cap` provider this is
                    the token returned by `POST /auth/captcha/redeem`; for
                    Turnstile or reCAPTCHA it is the widget's response token.
                    Single use.
            example:
              username: admin
              password: Pa$$w0rd!
      responses:
        "200":
          description: Token pair with the user profile, or a 2FA challenge when the account has 2FA enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/AuthTokenPairWithUser"
                      - $ref: "#/components/schemas/AuthTwoFactorChallenge"
              examples:
                tokens:
                  summary: Token pair
                  value:
                    data:
                      access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      token_type: Bearer
                      expires_in: 3600
                      user:
                        username: admin
                        fullname: Site Administrator
                        email: admin@example.com
                        avatar_url: null
                        super_admin: true
                        access:
                          admin:
                            super: true
                        content_editor: ""
                        demo_mode:
                          enabled: false
                          writable: []
                          reset_interval: 30
                          seconds_until_reset: null
                challenge:
                  summary: 2FA challenge
                  value:
                    data:
                      requires_2fa: true
                      challenge_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      expires_in: 300
                      token_type: Challenge
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/captcha:
    get:
      operationId: getCaptchaConfig
      tags: [Auth]
      summary: Discover the login captcha
      description: |
        Report which captcha (if any) guards the unauthenticated auth endpoints,
        so a client can render the right challenge before submitting. Public,
        and never returns a secret.
      security: []
      responses:
        "200":
          description: Captcha configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      provider:
                        type: string
                        nullable: true
                        enum: [cap, turnstile, recaptcha, null]
                      mode:
                        type: string
                        enum: [invisible, checkbox]
                      token_field:
                        type: string
                        description: Body field to send the solved token in.
                      flows:
                        type: object
                        description: Which unauthenticated flows are gated.
                        properties:
                          login:
                            type: boolean
                          forgot_password:
                            type: boolean
                          setup:
                            type: boolean
                      endpoint:
                        type: string
                        description: Base URL of the cap challenge/redeem pair. Only for the `cap` provider.
                      site_key:
                        type: string
                        description: Public widget key. Only for the `turnstile` and `recaptcha` providers.
                      version:
                        type: string
                        description: reCAPTCHA widget version from the Form plugin's config (default `2-checkbox`). Only for the `recaptcha` provider.
                        example: 2-checkbox
              example:
                data:
                  enabled: true
                  provider: cap
                  mode: invisible
                  token_field: captcha_token
                  flows:
                    login: true
                    forgot_password: true
                    setup: false
                  endpoint: https://example.com/api/v1/auth/captcha/

  /auth/captcha/challenge:
    post:
      operationId: createCaptchaChallenge
      tags: [Auth]
      summary: Mint a proof-of-work challenge
      description: |
        Issue a cap.js challenge for the client to solve. Only available while
        `cap` is the active provider; 404 otherwise. The response is the cap.js
        wire format, not this API's `data` envelope.
      security: []
      responses:
        "200":
          description: Challenge issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: object
                    properties:
                      c:
                        type: integer
                        description: Number of sub-challenges.
                      s:
                        type: integer
                        description: Salt length.
                      d:
                        type: integer
                        description: Required leading zero digits.
                  token:
                    type: string
                  expires:
                    type: integer
                    format: int64
              example:
                challenge: { c: 30, s: 32, d: 4 }
                token: 72d323130ee3541275ca2dc1aa9607b4ca61095a08
                expires: 1787332679923
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/captcha/redeem:
    post:
      operationId: redeemCaptchaChallenge
      tags: [Auth]
      summary: Exchange solutions for a captcha token
      description: |
        Trade the solved sub-challenges for a single-use token to send with the
        login, forgotten-password or setup request. Only available while `cap`
        is the active provider; 404 otherwise. The response is the cap.js wire
        format, not this API's `data` envelope.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, solutions]
              properties:
                token:
                  type: string
                  description: The challenge token from `/auth/captcha/challenge`.
                solutions:
                  type: array
                  description: One nonce per sub-challenge, in order.
                  items:
                    type: integer
      responses:
        "200":
          description: Result of the redemption. `success` is false when the solutions don't verify.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  expires:
                    type: integer
                    format: int64
                  message:
                    type: string
              example:
                success: true
                token: e734e7c49c34bb0d:d43a6be90ca08cf9f91171a5320e0a
                expires: 1787333298530
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Refresh a JWT token pair
      description: |
        Exchange a valid refresh token for a new access/refresh pair. The
        provided refresh token is automatically revoked (token rotation).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: The refresh token obtained from `/auth/token` or a previous refresh.
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: New token pair, with the user profile, returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthTokenPairWithUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/revoke:
    post:
      operationId: revokeToken
      tags: [Auth]
      summary: Revoke a refresh token
      description: |
        Explicitly revoke a refresh token so it can no longer be used. This is
        the recommended way to implement logout on the client side.

        If the request also presents an access token (`X-API-Token` or
        `Authorization: Bearer`), that access token is revoked too, so the
        current session ends immediately. Always returns 204, even for an
        unknown or already-revoked refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "204":
          description: Token revoked successfully. No content returned.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/2fa/verify:
    post:
      operationId: verifyTwoFactorLogin
      tags: [Auth]
      summary: Complete a 2FA login
      description: |
        Second step of a login for an account with two-factor authentication enabled. `POST /auth/token` (or an SSO exchange) returns a `requires_2fa` challenge instead of tokens; send its `challenge_token` here with the current TOTP code to receive the token pair. The challenge token is burned on success so it cannot be replayed.
        Public. Shares the login rate limiter with `POST /auth/token`, keyed by the challenged username.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token:
                  type: string
                  description: The `challenge_token` from the `requires_2fa` login response.
                code:
                  type: string
                  description: Current six-digit code from the authenticator app.
                  example: "123456"
            example:
              challenge_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              code: "123456"
      responses:
        "200":
          description: Code verified. Token pair returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthTokenPairWithUser"
        "401":
          description: The challenge token is invalid or expired, or the code is wrong.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                title: Unauthorized
                detail: Invalid 2FA code.
        "403":
          description: The account is disabled, or the Login plugin's 2FA support is not installed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Send a password reset link to the account that owns `email`. The response is the same neutral message whether or not the address matches an account, whether the Email and Login plugins are configured, and whether sending failed, so it cannot be used to find accounts.
        The link points at the admin's own `/reset` route. Its base is taken from `admin_base_url`, then the `Referer`, then the `Origin` header, and each candidate is accepted only when its origin is the site's own or is listed in the API's `cors.origins`; anything else falls back to the site's root URL. The reset token is valid for 24 hours.
        Public. When the site has a login captcha that covers the forgotten-password flow, the solved token is required (see `GET /auth/captcha`). Repeated requests for one account are limited by the Login plugin's `pw_resets` bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                admin_base_url:
                  type: string
                  format: uri
                  description: The admin's base URL (origin plus admin route) to build the reset link from. Ignored unless its origin is trusted.
                  example: https://example.com/admin
                captcha_token:
                  type: string
                  description: A solved captcha. Required only when the site's login captcha covers this flow.
            example:
              email: jane@example.com
              admin_base_url: https://example.com/admin
      responses:
        "200":
          description: Neutral acknowledgement, returned whether or not an email was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                data:
                  message: If an account exists for that email, a reset link has been sent.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Set a new password with a reset token
      description: |
        Complete a password reset using the `user` and `token` values from the reset link. Every failure (unknown user, wrong token, expired token) returns the same 422 message so tokens cannot be probed. Once the link is valid, the new password must meet the site's password policy (`system.pwd_regex`, or at least 8 characters when none is set; see `GET /auth/password-policy`), otherwise a 422 names the `password` field and the link stays usable. On success every access and refresh token issued to the account before the reset stops working.
        Public. Rate limited per username through the Login plugin's login bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, token, password]
              properties:
                username:
                  type: string
                token:
                  type: string
                  description: The reset token from the emailed link.
                password:
                  type: string
                  format: password
                  description: The new password.
            example:
              username: jane
              token: 5f4dcc3b5aa765d61d8327deb882cf99
              password: N3w-Pa$$w0rd
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                data:
                  message: Password reset successfully.
        "422":
          description: A required field is missing, the reset link is invalid or expired, or the new password does not meet the password policy.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: Invalid or expired reset link.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password-policy:
    get:
      operationId: getPasswordPolicy
      tags: [Auth]
      summary: Read the password policy
      description: |
        Return the site's password policy (`system.pwd_regex`, plus the checklist rules from `system.pwd_rules` or parsed from the regex) so setup, reset and user-creation forms can validate as the user types. With no `pwd_regex` set, the API still requires at least 8 characters, so the response reports `min_length: 8` and a single length rule. The same policy is enforced by setup, invite accept, password reset, and user create/update. Public.
      security: []
      responses:
        "200":
          description: Password policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthPasswordPolicy"
              example:
                data:
                  regex: "(?=.*\\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                  min_length: 8
                  rules:
                    - { id: length, label: At least 8 characters, pattern: ".{8,}" }
                    - { id: digit, label: At least one number, pattern: "\\d" }
                    - { id: lowercase, label: At least one lowercase letter, pattern: "[a-z]" }
                    - { id: uppercase, label: At least one uppercase letter, pattern: "[A-Z]" }

  /auth/setup:
    get:
      operationId: getSetupStatus
      tags: [Auth]
      summary: Check whether first-run setup is needed
      description: |
        Report whether the site has no user accounts yet, in which case the admin shows its create-the-first-account screen. Also returns the password policy so that screen can validate without a second call. Public.
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      setup_required:
                        type: boolean
                        description: True while `user/accounts/` holds no accounts.
                      password_policy:
                        $ref: "#/components/schemas/AuthPasswordPolicy"
              example:
                data:
                  setup_required: true
                  password_policy:
                    regex: ""
                    min_length: 8
                    rules:
                      - { id: length, label: At least 8 characters, pattern: ".{8,}" }
    post:
      operationId: completeSetup
      tags: [Auth]
      summary: Create the first super-admin account
      description: |
        Create the site's first account with `api.super` and `site.login` access, then log it in and return a token pair. Only works while no accounts exist; afterwards it returns 409.
        The username must be 3 to 64 characters, may not start with a period or contain `..`, and may not contain `\ / ? * : ; { }` or a line break. The password must match `system.pwd_regex`, or be at least 8 characters when no regex is set.
        Public. Rate limited per IP address, and requires a solved captcha when the site's login captcha covers the setup flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                  example: admin
                password:
                  type: string
                  format: password
                email:
                  type: string
                  format: email
                fullname:
                  type: string
                  description: Defaults to the username.
                title:
                  type: string
                  description: Defaults to `Administrator`.
                captcha_token:
                  type: string
                  description: A solved captcha. Required only when the site's login captcha covers the setup flow.
            example:
              username: admin
              password: Pa$$w0rd!
              email: admin@example.com
              fullname: Site Administrator
      responses:
        "200":
          description: Account created and logged in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthTokenPairWithUser"
        "409":
          description: Setup has already been completed (an account exists).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Conflict
                detail: Setup has already been completed.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/invite/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The invitation token from the emailed invite link.
        schema:
          type: string
    get:
      operationId: validateInvitation
      tags: [Auth]
      summary: Check an invitation link
      description: |
        Look up an invitation so the accept screen can show who it is for. An expired invitation still returns 200, with `valid: false` and `expired: true`; an unknown token returns 404. Public: the token is the only credential.
      security: []
      responses:
        "200":
          description: Invitation status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      expired:
                        type: boolean
                      email:
                        type: string
                        format: email
                        description: The invited address.
                      fullname:
                        type: string
                        description: Name the inviter entered. Omitted when the invitation has expired.
              example:
                data:
                  valid: true
                  expired: false
                  email: jane@example.com
                  fullname: Jane Doe
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: acceptInvitation
      tags: [Auth]
      summary: Accept an invitation
      description: |
        Create the invited account and log it in. The email address, access and groups come from the invitation and cannot be changed by the request. The username must be 3 to 64 characters, may not start with a period or contain `..`, and may not contain `\ / ? * : ; { }` or a line break; the password must match `system.pwd_regex`, or be at least 8 characters when no regex is set. The invitation is consumed on success, and an expired one is deleted and answered with 410.
        Public: the token is the only credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  format: password
                fullname:
                  type: string
                  description: Defaults to the name on the invitation.
                title:
                  type: string
            example:
              username: jane
              password: Pa$$w0rd!
              fullname: Jane Doe
      responses:
        "200":
          description: Account created and logged in. Sends `X-Invalidates` for the users list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthTokenPairWithUser"
        "403":
          description: The account was created, but the invitation's access grants no API or admin login (`api.access`, `admin.login` or super), so no tokens are issued. This is the same check a password login runs.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An account with that username already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The invitation has expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 410
                title: Gone
                detail: This invitation has expired.
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/sso/providers:
    get:
      operationId: listSsoProviders
      tags: [Auth]
      summary: List SSO login providers
      description: |
        Return the single sign-on buttons to show on the login screen, collected from every plugin that answers the `onApiLoginProviders` event (for example Login OAuth2). An empty list means password login only. Public.
      security: []
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuthSsoProvider"
              example:
                data:
                  providers:
                    - id: github
                      label: GitHub
                      icon: fa-github
                      plugin: login-oauth2

  /auth/sso/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider id from `GET /auth/sso/providers`.
        schema:
          type: string
        example: github
    get:
      operationId: startSsoLogin
      tags: [Auth]
      summary: Begin an SSO login
      description: |
        Browser navigation, not an XHR call. Stores the provider's CSRF state and the admin's return target in the PHP session, then redirects to the provider's authorization URL built by the plugin that answers `onApiLoginStart`. When no plugin handles the provider, redirects back to the admin's `/login?sso_error=<code>` instead. This route keeps its session cookie so the callback can read the state back. Public.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: In-app path to land on after login. Only a root-relative path is kept; absolute URLs, `//host` and control characters are dropped.
          schema:
            type: string
          example: /pages
      responses:
        "302":
          description: Redirect to the provider, or to the admin login screen with an `sso_error` query parameter (default `sso_unavailable`).
          headers:
            Location:
              description: Provider authorization URL, or `<admin>/login?sso_error=<code>`.
              schema:
                type: string
                format: uri

  /auth/sso/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider id.
        schema:
          type: string
        example: github
    get:
      operationId: handleSsoCallback
      tags: [Auth]
      summary: Receive the SSO provider's response
      description: |
        The provider redirects the browser here. The plugin that answers `onApiLoginCallback` validates the state and resolves a Grav user; the same API-access, account-state and 2FA checks as password login then run. The resulting token pair or 2FA challenge is stored under a single-use code (valid for 120 seconds) and the browser is redirected to `<admin>/oauth-callback?code=<code>[&returnTo=<path>]`, where the admin trades it via `POST /auth/sso/exchange`. On failure the browser is sent to `<admin>/login?sso_error=<code>` (`sso_failed`, `sso_forbidden`, or a provider-specific code). Public.
      security: []
      responses:
        "302":
          description: Redirect back into the admin, carrying either a one-time exchange code or an `sso_error`.
          headers:
            Location:
              description: "`<admin>/oauth-callback?code=...` on success, `<admin>/login?sso_error=...` on failure."
              schema:
                type: string
                format: uri

  /auth/sso/exchange:
    post:
      operationId: exchangeSsoCode
      tags: [Auth]
      summary: Trade an SSO code for tokens
      description: |
        Exchange the one-time code from the SSO callback redirect for the stored login result: the same body `POST /auth/token` returns, either a token pair or a `requires_2fa` challenge to finish with `POST /auth/2fa/verify`. The code is deleted on first use. Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Hex code from the `oauth-callback` redirect.
            example:
              code: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      responses:
        "200":
          description: Login result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/AuthTokenPairWithUser"
                      - $ref: "#/components/schemas/AuthTwoFactorChallenge"
        "401":
          description: The code is unknown, malformed, already used or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                title: Unauthorized
                detail: Invalid or expired exchange code.
        "422":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # Current user
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Ping
  # ---------------------------------------------------------------------------
  /ping:
    get:
      operationId: ping
      tags: [System]
      summary: Health check / keep-alive
      description: |
        Simple health check endpoint. Returns a static response to confirm the
        API is reachable. This is a public route: no credentials are needed
        and no permission is checked.
      security: []
      responses:
        "200":
          description: API is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pong:
                        type: boolean
                        example: true
              example:
                data:
                  pong: true
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Pages
  # ---------------------------------------------------------------------------
  /pages:
    get:
      operationId: listPages
      tags: [Pages]
      summary: List pages
      description: |
        Retrieve a paginated list of all pages. Supports filtering by
        published state, template, routable/visible flags, and parent route.
        Results can be sorted by date, title, slug, modified time, or order.

        `children_of` and `root=true` read the parent folder's own children
        rather than every page in the site. Pages that tie on the sort key
        (the same date, or a folder whose collection order has no key of its
        own) keep the folder's order.

        The listing uses a lightweight serialization that excludes content,
        media, and children for performance. Every row carries a `permissions`
        object with the caller's effective per-page capabilities; rows are never
        dropped for a page whose own rules deny reading.

        Requires `api.pages.read`.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/lang"
        - name: sort
          in: query
          description: |
            Field to sort by. When omitted the default sort is `date` descending.
            `default` uses native page ordering: combined with `children_of` it
            follows the parent's collection order (`content.order.by` /
            `content.order.dir`, unless `admin.children_display_order` says
            otherwise), or else numbered folders first and unnumbered ones by
            slug; without `children_of` it sorts by `order` ascending. An
            unknown field returns 422.
          schema:
            type: string
            enum: [date, title, slug, modified, order, default]
        - name: order
          in: query
          description: Sort direction. Ignored when `sort` is omitted.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: published
          in: query
          description: Filter by published state.
          schema:
            type: boolean
        - name: template
          in: query
          description: Filter by page template name (e.g. `blog`, `default`).
          schema:
            type: string
          example: blog
        - name: routable
          in: query
          description: Filter by routable flag.
          schema:
            type: boolean
        - name: visible
          in: query
          description: Filter by visible flag.
          schema:
            type: boolean
        - name: parent
          in: query
          description: |
            Filter pages whose route starts with this parent path (e.g. `/blog`
            returns `/blog/post-1`, `/blog/post-2`, etc.). Returns all descendants.
          schema:
            type: string
        - name: children_of
          in: query
          description: |
            Return only **direct children** of the given route (one level deep).
            Unlike `parent`, this does not return deeper descendants.
            Use `children_of=/` for root-level pages. Ideal for lazy-loading
            tree views and miller column interfaces.
          schema:
            type: string
          example: /blog
        - name: root
          in: query
          description: |
            Filter to top-level (root) pages only: direct children of the
            pages root, resolved from the real hierarchy, so children of the
            home page are not counted as top-level. `root=false` returns
            only pages that are not top-level.
          schema:
            type: boolean
          example: true
        - name: search
          in: query
          description: |
            Free-text search: a case-insensitive substring match on each
            page's title, menu label, slug and route, so a query such as
            `docs/` finds every page under that folder. Works the same with or without
            the Flex pages directory, combines with every other filter
            (including `children_of` and `parent`), and the pagination totals
            count only matching pages. Leading and trailing whitespace is
            ignored, and a blank value means no search.
          schema:
            type: string
        - name: locate
          in: query
          description: |
            Route of a page to jump to. When the page is in the filtered,
            sorted result set, the server returns the chunk that contains it
            (overriding `page`) and reports its absolute position in
            `meta.pagination.located_at_index`.
          schema:
            type: string
          example: /blog/my-first-post
        - name: translations
          in: query
          description: |
            When `true`, each row also carries `translated_languages`,
            `untranslated_languages`, `has_default_file` and
            `explicit_language_files`.
          schema:
            type: boolean
            default: false
        - name: fields
          in: query
          description: |
            `summary` returns the same rows without the `header` key (the
            page's full frontmatter), which is about half of a large listing.
            Every other key, the filters, the sorting and the pagination are
            unchanged, and `title`, `menu`, `published` and `visible` still
            honour the frontmatter. Without this parameter, or with any other
            value, rows include `header` as before.
          schema:
            type: string
            enum: [summary]
          example: summary
      responses:
        "200":
          description: Paginated list of pages.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PageSummary"
              example:
                data:
                  - route: /blog/my-first-post
                    slug: my-first-post
                    title: My First Post
                    template: blog
                    header:
                      title: My First Post
                      taxonomy:
                        category: [blog]
                        tag: [intro, grav]
                    taxonomy:
                      category: [blog]
                      tag: [intro, grav]
                    published: true
                    visible: true
                    routable: true
                    date: "2026-03-20T12:00:00+00:00"
                    modified: "2026-03-22T09:30:00+00:00"
                    order: 1
                    has_children: true
                meta:
                  pagination:
                    page: 1
                    per_page: 20
                    total: 42
                    total_pages: 3
                links:
                  self: "/api/v1/pages?page=1&per_page=20"
                  next: "/api/v1/pages?page=2&per_page=20"
                  last: "/api/v1/pages?page=3&per_page=20"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      operationId: createPage
      tags: [Pages]
      summary: Create a new page
      description: |
        Create a new page at the given route. The parent page must already
        exist (except when creating top-level pages). Supply an optional
        `order` to create an ordered (visible) page, or pass `"auto"` to let
        the server pick the next free prefix based on existing siblings.
        Include `lang` in the body to create the page in a specific language.

        The new frontmatter is built from the template blueprint's
        non-toggleable `default:` values, then `title`, then the supplied
        `header`. A missing parent or an already occupied target returns 422.

        Requires `api.pages.write`, and the parent page's own `create` rule
        (if any) must allow it: a page-level grant can stand in for the
        account permission, a page-level deny refuses it. Setting
        `process.twig: true` additionally needs the Twig-in-content
        permission (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageRequest"
            example:
              route: /blog/my-new-post
              title: My New Post
              template: blog
              content: |
                # Hello World

                This is the body of my new blog post.
              header:
                taxonomy:
                  category: [blog]
                  tag: [new, grav]
              order: 3
      responses:
        "201":
          description: Page created successfully.
          headers:
            Location:
              description: URL of the newly created page resource.
              schema:
                type: string
                example: /api/v1/pages/blog/my-new-post
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: |
                      The created page. For `kind: folder` the folder may not
                      resolve as a page, in which case only `route` and `kind`
                      are returned.
                    oneOf:
                      - $ref: "#/components/schemas/Page"
                      - type: object
                        required: [route, kind]
                        properties:
                          route:
                            type: string
                            example: /blog/archive
                          kind:
                            type: string
                            enum: [page, folder, module]
                            example: folder
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}:
    get:
      operationId: getPage
      tags: [Pages]
      summary: Get a single page
      description: |
        Retrieve a single page by its route. Returns the full page object
        including raw Markdown content and media. Optionally render the
        content to HTML and/or include child pages.

        The response includes an `ETag` header for use with optimistic
        concurrency on subsequent PATCH requests.

        Requires `api.pages.read`, subject to the page's own `read` rule (a
        page-level grant can stand in for the account permission, a deny
        refuses it). A page that already has `process.twig: true` also needs
        the Twig-in-content permission to be read here (403 otherwise).
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/lang"
        - name: summary
          in: query
          description: |
            When `true`, the raw `content` is left out and a plain-text
            `summary` (rendered, tags stripped, truncated) is returned in its
            place.
          schema:
            type: boolean
            default: false
        - name: summary_size
          in: query
          description: Maximum length of `summary` in characters. Only used with `summary=true`.
          schema:
            type: integer
            default: 300
        - name: render
          in: query
          description: When `true`, include the rendered HTML in `content_html`.
          schema:
            type: boolean
            default: false
        - name: children
          in: query
          description: When `true`, include child pages in the response.
          schema:
            type: boolean
            default: false
        - name: children_depth
          in: query
          description: Maximum depth for recursive child inclusion. Only effective when `children=true`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: translations
          in: query
          description: |
            When `true`, include `translated_languages`, `untranslated_languages`,
            `has_default_file` and `explicit_language_files` in the response.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page returned successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updatePage
      tags: [Pages]
      summary: Partially update a page
      description: |
        Apply a partial update to an existing page. Only the fields included
        in the request body are modified; all others are left unchanged.

        **Optimistic concurrency:** If the `If-Match` header is provided, it
        is compared against the current ETag. A `409 Conflict` is returned if
        the resource has been modified since the client last fetched it.

        With `?lang=` on a multi-language site the translation must already
        exist; otherwise 422 is returned (create it with
        `POST /pages/{route}/translate` first). Submitted fields are
        validated against the page blueprint (422 on failure).

        Requires `api.pages.write`, subject to the page's own `update` rule.
        Enabling `process.twig`, or editing a page that already has it on,
        also needs the Twig-in-content permission (403 otherwise).
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/lang"
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePageRequest"
            example:
              title: Updated Post Title
              content: |
                # Updated Content

                The body has been revised.
              header:
                taxonomy:
                  tag: [updated]
              published: true
      responses:
        "200":
          description: Page updated successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deletePage
      tags: [Pages]
      summary: Delete a page
      description: |
        Delete a page and its directory from disk. By default, child pages
        are deleted as well. Set `children=false` to prevent deletion of a
        page that has children (a 422 error will be returned instead).

        With `?lang=` on a multi-language site only that language's file is
        removed (404 if the page has no such translation). When it is the
        page's only translation the whole page directory is deleted, so
        `children=false` applies just as it does to a plain delete: a page
        with children is refused with a 422.

        Requires `api.pages.write`, subject to the page's own `delete` rule.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/lang"
        - name: children
          in: query
          description: |
            Whether to also delete child pages. Set to `false` to prevent
            accidental deletion of pages with children.
          schema:
            type: boolean
            default: true
      responses:
        "204":
          description: Page deleted successfully. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/move:
    post:
      operationId: movePage
      tags: [Pages]
      summary: Move a page to a new location
      description: |
        Move an existing page to a different parent and/or change its slug or
        ordering prefix. The destination parent must exist and the target
        path must not already be occupied (422 otherwise, as is a move to the
        page's current location). The slug must be a single path segment.

        If the moved page cannot be resolved at its new route afterwards,
        only `route` and `slug` are returned, without an `ETag`.

        Requires `api.pages.write`, subject to the page's own `update` rule
        and the destination parent's `create` rule.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovePageRequest"
            example:
              parent: /tutorials
              slug: renamed-post
              order: 5
      responses:
        "200":
          description: |
            Page moved successfully. The `ETag` header is sent only with the
            full page record.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/Page"
                      - $ref: "#/components/schemas/PageRouteStub"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/copy:
    post:
      operationId: copyPage
      tags: [Pages]
      summary: Copy a page to a new location
      description: |
        Create a duplicate of an existing page (including all of its files)
        at a new route. The destination parent must exist and the target
        route must not already be occupied (422 otherwise). If the source
        declares a `slug:` in its frontmatter, the copy's is rewritten to the
        new folder name. If the copy cannot be resolved afterwards, only
        `route` and `slug` are returned.

        Requires `api.pages.write`, subject to the source page's `read` rule
        and the destination parent's `create` rule.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route]
              properties:
                route:
                  type: string
                  description: The full route for the copied page.
                  example: /blog/my-post-copy
            example:
              route: /blog/my-post-copy
      responses:
        "201":
          description: Page copied successfully.
          headers:
            Location:
              description: URL of the newly created page resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/Page"
                      - $ref: "#/components/schemas/PageRouteStub"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/languages:
    get:
      operationId: listPageTranslations
      tags: [Pages]
      summary: List translations for a page
      description: |
        Return the list of languages the page has been translated into and
        those still missing. Useful for building translation management UIs.
        On a single-language site both lists are empty.

        Requires `api.pages.read`, subject to the page's own `read` rule.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      responses:
        "200":
          description: Translation status for the page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TranslationInfo"
              example:
                data:
                  route: /blog/my-first-post
                  default_language: en
                  translated:
                    en: /blog/my-first-post
                    fr: /blog/mon-premier-article
                  untranslated:
                    - de
                    - es
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/translate:
    post:
      operationId: createPageTranslation
      tags: [Pages]
      summary: Create a translation for a page
      description: |
        Create a new language translation for an existing page. The `lang`
        field specifies the target language code; it must be one of the
        site's configured languages, and multi-language must be enabled. If a
        translation already exists for that language, `422` is returned (use
        `PATCH /pages/{route}?lang=` to update it). Fields left out are copied
        from the source page, and the result is validated against the page
        blueprint. The response is the page in the new language.

        Requires `api.pages.write`, subject to the page's own `update` rule.
        Enabling `process.twig` in `header` also needs the Twig-in-content
        permission (403 otherwise).
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang]
              properties:
                lang:
                  type: string
                  description: Language code for the translation.
                  example: fr
                title:
                  type: string
                  description: Page title in the target language. Defaults to the source page's title.
                  example: Mon Premier Article
                content:
                  type: string
                  description: Raw Markdown body in the target language. Defaults to the source page's content.
                  example: |
                    # Bonjour le Monde

                    Ceci est le corps de l'article.
                header:
                  type: object
                  additionalProperties: true
                  description: |
                    Frontmatter for the translation. Defaults to the source
                    page's full header; template blueprint defaults fill in
                    anything missing either way.
            example:
              lang: fr
              title: Mon Premier Article
              content: |
                # Bonjour le Monde

                Ceci est le corps de l'article.
      responses:
        "201":
          description: Translation created successfully.
          headers:
            Location:
              description: |
                URL of the page resource. It carries no `lang` query, so add
                `?lang=<code>` to fetch the new translation.
              schema:
                type: string
                example: /api/v1/pages/blog/my-first-post
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/batch:
    post:
      operationId: batchPages
      tags: [Pages]
      summary: Batch operations on multiple pages
      description: |
        Apply the same operation to multiple pages at once. Supported
        operations are `publish`, `unpublish`, `delete`, and `copy`. Each
        route is processed independently; partial failures are reported in
        the results array.

        The request is rejected with 422 before anything runs when the
        operation is unknown, `routes` is empty, it lists more than
        `batch.max_items` routes (default 50), or any route does not resolve
        to a page. A page whose own rules deny the action (`publish`, falling
        back to `update`, for publish/unpublish; `delete`; `read` for copy)
        is reported as an `error` result rather than failing the batch.

        Requires `api.pages.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, routes]
              properties:
                operation:
                  type: string
                  enum: [publish, unpublish, delete, copy]
                  description: The operation to apply to all specified pages.
                  example: publish
                routes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Array of page routes to operate on.
                  example: [/blog/draft-one, /blog/draft-two]
                options:
                  type: object
                  description: Optional parameters, used by `copy` only.
                  properties:
                    destination:
                      type: string
                      description: |
                        Route of the parent to copy into (`/` for the top
                        level). Defaults to each page's own parent.
                      example: /archive
                    suffix:
                      type: string
                      default: "-copy"
                      description: |
                        Appended to each page's slug to name the copy. Must be
                        a single path segment.
                      example: "-copy"
            example:
              operation: publish
              routes:
                - /blog/draft-one
                - /blog/draft-two
      responses:
        "200":
          description: Batch operation completed. Check individual results for status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [operation, results, total, successful, failed]
                    properties:
                      operation:
                        type: string
                        enum: [publish, unpublish, delete, copy]
                        example: publish
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/BatchResult"
                      total:
                        type: integer
                        description: Number of routes processed.
                        example: 2
                      successful:
                        type: integer
                        example: 1
                      failed:
                        type: integer
                        example: 1
              example:
                data:
                  operation: publish
                  results:
                    - route: /blog/draft-one
                      status: success
                    - route: /blog/draft-two
                      status: error
                      message: Page permissions deny 'publish' on this page.
                  total: 2
                  successful: 1
                  failed: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/reorganize:
    post:
      operationId: reorganizePages
      tags: [Pages]
      summary: Reorganize multiple pages (move and reorder atomically)
      description: |
        Move and/or reorder multiple pages in a single atomic operation. Each
        operation specifies a page route and optionally a new parent and/or
        position. All operations are validated before any changes are applied.

        Use this endpoint for drag-and-drop tree reorganization where pages may
        be moved across parents and reordered within the same request.

        Validation failures return 422 and change nothing: more than
        `batch.max_items` operations (default 50), a duplicate route, a route
        or parent that does not resolve, two operations claiming the same
        position under one parent, a move into the page's own subtree, or a
        target parent that is itself being moved in the same request. A
        filesystem failure part-way is rolled back on a best-effort basis and
        also returns 422.

        The response lists every child of each affected parent (old and new),
        not only the pages named in the request.

        Requires `api.pages.write`. A page whose own rules deny `update`, or
        a destination parent that denies `create`, fails the whole request
        with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items:
                    type: object
                    required: [route]
                    properties:
                      route:
                        type: string
                        description: Current route of the page to reorganize.
                        example: /blog/post-a
                      parent:
                        type: string
                        description: |
                          New parent route. Use `/` for root. Omit to keep the
                          page under its current parent.
                        example: /tutorials
                      position:
                        type: integer
                        minimum: 1
                        description: |
                          1-based ordering position under the target parent. Omit
                          to keep the current order value.
                        example: 1
                  description: |
                    Array of reorganize operations to apply atomically. All are
                    validated before any filesystem changes are made.
            example:
              operations:
                - route: /blog/post-a
                  parent: /tutorials
                  position: 1
                - route: /blog/post-b
                  position: 2
                - route: /tutorials/old-guide
                  parent: /blog
                  position: 3
      responses:
        "200":
          description: Pages reorganized successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        route:
                          type: string
                          example: /tutorials/post-a
                        slug:
                          type: string
                          example: post-a
                        title:
                          type: string
                          example: Post A
                        order:
                          $ref: "#/components/schemas/PageOrder"
                        parent:
                          type: string
                          description: |
                            Structural route of the parent the row was listed
                            under (`/` for the top level).
                          example: /tutorials
              example:
                data:
                  - route: /tutorials/post-a
                    slug: post-a
                    title: Post A
                    order: 1
                    parent: /tutorials
                  - route: /blog/post-b
                    slug: post-b
                    title: Post B
                    order: 2
                    parent: /blog
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/reorder:
    post:
      operationId: reorderPages
      tags: [Pages]
      summary: Reorder children of a page
      description: |
        Set the ordering of child pages under the specified parent route.
        The slugs in `order` get numeric folder prefixes 1, 2, 3… in the
        order given (keeping the widest prefix width already used among the
        siblings). Every slug must be an immediate child of the page (422
        otherwise). Children not listed keep their current folder name and
        prefix.

        Requires `api.pages.write`, subject to the parent page's own
        `update` rule.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items:
                    type: string
                  description: Ordered list of child slugs.
                  example: [third-post, first-post, second-post]
            example:
              order:
                - third-post
                - first-post
                - second-post
      responses:
        "200":
          description: |
            Children reordered successfully. Returns every child of the page
            in its new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [route, slug, title, order]
                      properties:
                        route:
                          type: string
                          example: /blog/third-post
                        slug:
                          type: string
                          example: third-post
                        title:
                          type: string
                          example: Third Post
                        order:
                          $ref: "#/components/schemas/PageOrder"
              example:
                data:
                  - route: /blog/third-post
                    slug: third-post
                    title: Third Post
                    order: "01."
                  - route: /blog/first-post
                    slug: first-post
                    title: First Post
                    order: "02."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Page Media
  # ---------------------------------------------------------------------------
  /pages/{route}/media:
    get:
      operationId: listPageMedia
      tags: [Media]
      summary: List media for a page
      description: |
        Return all media files attached to the specified page, optionally
        filtered and sorted by their `.meta.yaml` metadata. Only the fields
        configured in `media_metadata.fields` can be filtered or sorted on.

        Requires `api.media.read`; a page whose own rules deny `read` returns
        403.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - name: filter
          in: query
          description: |
            Metadata filter clause, `field:value` or `field:operator:value`.
            Repeat as `filter[]=` for several clauses (at most 10), which are
            combined with AND. Operators: `==`, `!=`, `>`, `>=`, `<`, `<=`,
            `in` (comma-separated values), `contains`. The shorthand form uses
            `contains` for a `tags` field and `==` otherwise; a `tags` field
            accepts only `in` and `contains`. A clause naming an unconfigured
            field is ignored; a malformed clause or bad operator returns 422.
          schema:
            type: string
          example: tags:contains:beach
        - name: sort
          in: query
          description: |
            Sort by a configured metadata field, or by `filename`, `size` or
            `modified`. Any other value returns 422.
          schema:
            type: string
          example: title
        - name: order
          in: query
          description: Sort direction for `sort`. `dir` is accepted as an alias.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: List of media items for the page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      operationId: uploadPageMedia
      tags: [Media]
      summary: Upload media to a page
      description: |
        Upload one or more files to the specified page's directory. Files are
        sent as `multipart/form-data`. The maximum upload size per file is
        64 MB. Dangerous file extensions (as configured in Grav's security
        settings) are rejected, checked against every dot-separated part of
        the name, and SVG content is sanitized on arrival.

        Requires `api.media.write`; a page whose own rules deny `update`
        returns 403.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    File to upload. Any field name works, including nested
                    array names, and several file parts may be sent in one
                    request.
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Alternative field name for uploading multiple files.
                random_name:
                  type: boolean
                  description: Replace the file name with a random one (extension kept).
                  default: false
                avoid_overwriting:
                  type: boolean
                  description: Add a prefix instead of replacing an existing file of the same name.
                  default: false
                accept:
                  type: string
                  description: Comma-separated allowlist of extensions (`.pdf`, `*.jpg`) or MIME patterns (`image/*`). May also be sent as an array.
                  example: "image/*,.pdf"
                filesize:
                  type: number
                  description: Per-field maximum size in MB. Can only tighten the 64 MB cap.
                  example: 5
      responses:
        "201":
          description: |
            Files uploaded successfully. The response lists all of the page's
            media after the upload, not only the new files.
          headers:
            Location:
              description: URL of the page media collection.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/media/{filename}:
    delete:
      operationId: deletePageMedia
      tags: [Media]
      summary: Delete a media file from a page
      description: |
        Remove a single media file (and its `.meta.yaml` sidecar, if present)
        from the specified page. Retina variants of the file (`name@2x.jpg`,
        `name@3x.jpg`, …) and their sidecars are removed too, so an image
        stored only as a retina variant can still be deleted by its base
        name.

        Requires `api.media.write`; a page whose own rules deny `update`
        returns 403.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - name: filename
          in: path
          required: true
          description: Name of the media file to delete.
          schema:
            type: string
          example: hero-image.jpg
      responses:
        "204":
          description: Media file deleted successfully. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/media/{filename}/meta:
    get:
      operationId: getPageMediaMeta
      tags: [Media]
      summary: Read a page media file's metadata
      description: |
        Return the editable metadata fields (from the `<filename>.meta.yaml`
        sidecar) for a page media file, together with any other keys stored in
        the sidecar (EXIF, dimensions, upload info) as read-only `extra` data.

        Requires `api.media.read`; a page whose own rules deny `read` returns
        403. An invalid filename (leading dot, `..`) returns 422.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/mediaFilename"
      responses:
        "200":
          description: Media metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MediaMetadata"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: savePageMediaMeta
      tags: [Media]
      summary: Save a page media file's metadata
      description: |
        Write the editable metadata fields for a page media file. Only the
        configured fields present in the request are changed (an empty string
        clears a field); every other key already in the sidecar is preserved.
        Values are stripped of HTML tags and control characters on save, since
        they render into `<img>` attributes on the site.

        Requires `api.media.write`; a page whose own rules deny `update`
        returns 403.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/mediaFilename"
      requestBody:
        $ref: "#/components/requestBodies/MediaMetadataWrite"
      responses:
        "200":
          description: Updated media metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MediaMetadata"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: deletePageMediaMeta
      tags: [Media]
      summary: Clear a page media file's metadata
      description: |
        Remove all editable (configured) metadata fields for a page media file.
        Reserved/technical keys are preserved; the sidecar is deleted only if
        nothing else remains in it.

        Requires `api.media.write`; a page whose own rules deny `update`
        returns 403.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/mediaFilename"
      responses:
        "204":
          description: Metadata cleared. No content returned.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /pages/{route}/compare:
    get:
      operationId: comparePageLanguages
      tags: [Pages]
      summary: Compare two language versions of a page
      description: |
        Return the title, raw Markdown, frontmatter and modified date of a page in two languages side by side. A side is `null` when the page does not resolve in that language, and `exists` is false when the page resolves only through the default-language fallback rather than its own file. Needs multi-language enabled (422 otherwise). Requires `api.pages.read`, and neither the source nor the target page may deny the caller read access. A language code that is not a string (for example `source[]=`) is a 422.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - name: source
          in: query
          required: true
          description: Source language code.
          schema:
            type: string
          example: en
        - name: target
          in: query
          required: true
          description: Target language code.
          schema:
            type: string
          example: fr
      responses:
        "200":
          description: Both language versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      route:
                        type: string
                        example: /blog/my-first-post
                      source:
                        type: object
                        allOf:
                          - $ref: "#/components/schemas/PageLanguageVersion"
                        nullable: true
                      target:
                        type: object
                        allOf:
                          - $ref: "#/components/schemas/PageLanguageVersion"
                        nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/neighbors:
    get:
      operationId: getPageNeighbors
      tags: [Pages]
      summary: Get a page's parent, siblings and first child
      description: |
        Where a page sits among its siblings, for page-to-page navigation:
        its parent, the previous and next sibling, its first child, its
        zero-based position and the number of siblings.

        Siblings are the parent's children in exactly the order
        `GET /pages?children_of=<parent>&sort=default&order=asc` lists them
        (`children_of=/` for a top-level page), and `first_child` is the first
        row of the same listing for the page's own children. Every row is
        serialized exactly like a `GET /pages?fields=summary` row, including
        `permissions`. Only the parent's and the page's own children are read,
        never the whole site.

        `parent` is null for a top-level page, `prev` for the first sibling,
        `next` for the last and `first_child` when the page has no children.
        A page that its parent's listing leaves out (a folder with no content
        file) gets `index: -1` and null `prev` and `next`.

        Requires `api.pages.read`, and the page's own rules must allow
        reading it. An unknown route is a 404.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/lang"
        - name: translations
          in: query
          description: When `true`, each row also carries the translation fields, as on `GET /pages`.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The page's neighbours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [parent, prev, next, first_child, index, total]
                    properties:
                      parent:
                        type: object
                        description: The parent page, or null for a top-level page.
                        allOf:
                          - $ref: "#/components/schemas/PageSummary"
                        nullable: true
                      prev:
                        type: object
                        description: The previous sibling, or null for the first one.
                        allOf:
                          - $ref: "#/components/schemas/PageSummary"
                        nullable: true
                      next:
                        type: object
                        description: The next sibling, or null for the last one.
                        allOf:
                          - $ref: "#/components/schemas/PageSummary"
                        nullable: true
                      first_child:
                        type: object
                        description: The first child in default order, or null when the page has none.
                        allOf:
                          - $ref: "#/components/schemas/PageSummary"
                        nullable: true
                      index:
                        type: integer
                        description: Zero-based position among the siblings; -1 when the page is not listed among them.
                        example: 3
                      total:
                        type: integer
                        description: Number of siblings, the page included.
                        example: 12
              example:
                data:
                  parent:
                    route: /blog
                    raw_route: /blog
                    parent_route: /
                    slug: blog
                    folder: 03.blog
                    title: Blog
                    menu: Blog
                    template: blog
                    language: null
                    taxonomy: {}
                    published: true
                    visible: true
                    routable: true
                    date: "2026-03-20T12:00:00+00:00"
                    modified: "2026-03-22T09:30:00+00:00"
                    order: 3
                    has_children: true
                  prev:
                    route: /blog/first-post
                    raw_route: /blog/first-post
                    parent_route: /blog
                    slug: first-post
                    folder: 01.first-post
                    title: First Post
                    menu: First Post
                    template: item
                    language: null
                    taxonomy: {}
                    published: true
                    visible: true
                    routable: true
                    date: "2026-03-20T12:00:00+00:00"
                    modified: "2026-03-22T09:30:00+00:00"
                    order: 1
                    has_children: false
                  next:
                    route: /blog/third-post
                    raw_route: /blog/third-post
                    parent_route: /blog
                    slug: third-post
                    folder: 03.third-post
                    title: Third Post
                    menu: Third Post
                    template: item
                    language: null
                    taxonomy: {}
                    published: true
                    visible: true
                    routable: true
                    date: "2026-03-20T12:00:00+00:00"
                    modified: "2026-03-22T09:30:00+00:00"
                    order: 3
                    has_children: true
                  first_child:
                    route: /blog/second-post/gallery
                    raw_route: /blog/second-post/gallery
                    parent_route: /blog/second-post
                    slug: gallery
                    folder: 01.gallery
                    title: Gallery
                    menu: Gallery
                    template: default
                    language: null
                    taxonomy: {}
                    published: true
                    visible: true
                    routable: true
                    date: "2026-03-20T12:00:00+00:00"
                    modified: "2026-03-22T09:30:00+00:00"
                    order: 1
                    has_children: false
                  index: 1
                  total: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/sync:
    post:
      operationId: syncPageTranslation
      tags: [Pages]
      summary: Overwrite a translation from another language
      description: |
        Copy the frontmatter and Markdown of the page in `source_lang` over its existing `target_lang` translation. The target translation file must already exist (create it with `POST /pages/{route}/translate`). The same Twig-content and validation checks as a normal page save apply. Needs multi-language enabled. A language code that is not a string is a 422. Requires `api.pages.write` and update access to the page.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_lang, target_lang]
              properties:
                source_lang:
                  type: string
                  example: en
                target_lang:
                  type: string
                  example: fr
            example:
              source_lang: en
              target_lang: fr
      responses:
        "200":
          description: Target translation overwritten. Returns the updated page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pages/{route}/adopt-language:
    post:
      operationId: adoptPageLanguage
      tags: [Pages]
      summary: Assign an untyped page file to a language
      description: |
        Rename a page's language-less file (for example `default.md`) to the language-specific name (`default.fr.md`) without touching its contents. Meant for sites that started single-language and later enabled multi-language. Fails with 422 when multi-language is off, when there is no language-less file, or when a file for that language already exists. Requires `api.pages.write` and update access to the page.
      parameters:
        - $ref: "#/components/parameters/pageRoute"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang]
              properties:
                lang:
                  type: string
                  description: Language code to assign the file to.
                  example: en
            example:
              lang: en
      responses:
        "200":
          description: File renamed. Returns the page as loaded in the adopted language.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The file could not be renamed on disk.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pages/{route}/preview-token:
    post:
      operationId: createPagePreviewToken
      tags: [Pages]
      summary: Get a draft preview token
      description: |
        Mint a short-lived signed token that lets the frontend render this page even when it is unpublished. Append it to the page's frontend URL as `?admin_preview=1&preview_token=<token>`; the token unlocks only this page. For a modular section, `route` is the parent page to load and `anchor` suggests where to scroll. Lifetime is `plugins.api.preview_token_ttl` seconds (default 300, minimum 30). Returns 403 when `plugins.api.allow_draft_preview` is off. Requires `api.pages.read` and read access to the page (and to its parent for a module).
      parameters:
        - $ref: "#/components/parameters/pageRoute"
        - $ref: "#/components/parameters/lang"
      responses:
        "200":
          description: Preview token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expires_in:
                        type: integer
                        description: Lifetime in seconds.
                      route:
                        type: string
                        description: Frontend route the browser should load.
                      anchor:
                        type: string
                        nullable: true
                        description: Suggested element id to scroll to when previewing a module inside its parent; null otherwise.
              example:
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expires_in: 300
                  route: /blog/my-first-post
                  anchor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Users list extensions and 2FA
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Site-level Media
  # ---------------------------------------------------------------------------
  /media/meta:
    get:
      operationId: getSiteMediaMeta
      tags: [Media]
      summary: Read a site media file's metadata
      description: |
        Return the editable metadata fields for a site-level media file,
        addressed by the `path` query parameter (site paths contain slashes).
        Requires `api.media.read`. A missing or invalid `path` returns 422.
      parameters:
        - $ref: "#/components/parameters/mediaMetaPath"
      responses:
        "200":
          description: Media metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MediaMetadata"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: saveSiteMediaMeta
      tags: [Media]
      summary: Save a site media file's metadata
      description: |
        Write the editable metadata fields for a site-level media file. Only the
        configured fields present in the request are changed; other keys in the
        sidecar are preserved. Values are sanitized on save. Requires
        `api.media.write`.
      parameters:
        - $ref: "#/components/parameters/mediaMetaPath"
      requestBody:
        $ref: "#/components/requestBodies/MediaMetadataWrite"
      responses:
        "200":
          description: Updated media metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MediaMetadata"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: deleteSiteMediaMeta
      tags: [Media]
      summary: Clear a site media file's metadata
      description: |
        Remove all editable metadata fields for a site-level media file.
        Reserved/technical keys are preserved; the sidecar is deleted only if
        nothing else remains. Requires `api.media.write`.
      parameters:
        - $ref: "#/components/parameters/mediaMetaPath"
      responses:
        "204":
          description: Metadata cleared. No content returned.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /media:
    get:
      operationId: listSiteMedia
      tags: [Media]
      summary: List site-level media
      description: |
        Return a paginated list of files in one folder of the site-level media
        directory (`user/media`), plus that folder's subfolders in
        `meta.folders`. Requires `api.media.read`.

        Files follow the folder's saved manual order (`POST /media/order`)
        when one exists, otherwise natural filename order. A folder that does
        not exist returns an empty list. `search` switches to a recursive
        filename search across every folder and cannot be combined with
        `filter` or `sort` (422).
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: path
          in: query
          description: Subfolder path relative to the media root directory.
          schema:
            type: string
          example: blog/2026
        - name: search
          in: query
          description: Case-insensitive search term for recursive filename matching across all subfolders.
          schema:
            type: string
          example: hero
        - name: type
          in: query
          description: Filter by media type category, from the file's detected MIME type. `document` means anything that is not image, video or audio.
          schema:
            type: string
            enum: [image, video, audio, document]
          example: image
        - name: filter
          in: query
          description: |
            Metadata filter clause, `field:value` or `field:operator:value`,
            on a field from the configured `media_metadata.fields`. Repeatable
            as `filter[]=`, up to 10 clauses. Operators: `==`, `!=`, `>`,
            `>=`, `<`, `<=`, `in` (comma-separated values), `contains`. A
            `tags` field accepts only `in` and `contains` (the shorthand uses
            `contains`). Unknown fields are ignored; a malformed clause or
            unsupported operator returns 422.
          schema:
            type: string
          example: tags:contains:hero
        - name: sort
          in: query
          description: |
            Sort by a configured metadata field, or by `filename`, `size` or
            `modified`. Overrides the folder's manual order. An unknown field
            returns 422.
          schema:
            type: string
          example: title
        - name: order
          in: query
          description: Sort direction for `sort`. `dir` is accepted as an alias.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Paginated list of site media files.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaItem"
                      meta:
                        type: object
                        properties:
                          path:
                            type: string
                            description: The listed folder, relative to the media root. Empty for the root and in search mode.
                          folders:
                            type: array
                            description: Immediate subfolders of the listed folder. Empty in search mode.
                            items:
                              $ref: "#/components/schemas/FolderInfo"
                          ordered:
                            type: boolean
                            description: Whether the folder has a saved manual order. Absent in search mode and for a missing folder.
                          search:
                            type: string
                            description: The search term. Only present in search mode.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      operationId: uploadSiteMedia
      tags: [Media]
      summary: Upload site-level media
      description: |
        Upload one or more files to the site-level media directory
        (`user/media`). Requires `api.media.write`. The maximum upload size per
        file is 64 MB. Files must have an extension, and no dot-separated part
        of the name may be on `security.uploads_dangerous_extensions`; SVG
        content is sanitized on save. Any 422 aborts the request at that file,
        and files already saved before it are kept.

        The optional `random_name`, `avoid_overwriting`, `accept` and
        `filesize` form fields apply a blueprint file field's upload settings
        on top of those checks. Without `avoid_overwriting`, a file with the
        same name is replaced.
      parameters:
        - name: path
          in: query
          description: Subfolder path to upload into. Created automatically if it does not exist.
          schema:
            type: string
          example: blog/2026
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload. Any field name works (nested names such as `files[]` included), and several file parts may be sent in one request.
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Alternative field name for uploading multiple files.
                random_name:
                  type: boolean
                  description: Replace the file name with a random one (extension kept).
                  default: false
                avoid_overwriting:
                  type: boolean
                  description: Add a suffix instead of replacing an existing file of the same name.
                  default: false
                accept:
                  type: string
                  description: Comma-separated allowlist of extensions (`.pdf`, `*.jpg`) or MIME patterns (`image/*`). May also be sent as an array.
                  example: "image/*,.pdf"
                filesize:
                  type: number
                  description: Per-field maximum size in MB. Can only tighten the 64 MB cap.
                  example: 5
      responses:
        "201":
          description: Files uploaded successfully.
          headers:
            Location:
              description: URL of the site media collection.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/{filename}:
    delete:
      operationId: deleteSiteMedia
      tags: [Media]
      summary: Delete a site-level media file
      description: |
        Remove a file (and its `.meta.yaml` sidecar, if present) from the
        site-level media directory, and drop it from the folder's manual
        order. Requires `api.media.write`. A path segment that is empty,
        starts with a period or contains `..` returns 422.
      parameters:
        - name: filename
          in: path
          required: true
          description: Name of the file to delete (may include subdirectory path).
          schema:
            type: string
          example: hero-banner.jpg
      responses:
        "204":
          description: File deleted successfully. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/folders:
    post:
      operationId: createMediaFolder
      tags: [Media]
      summary: Create a media folder
      description: |
        Create a new folder in the site-level media directory (`user/media`).
        Parent directories are created automatically if they do not exist.
        Requires `api.media.write`. Returns 422 when the folder already
        exists or the path is invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Folder path to create, relative to the media root.
                  example: blog/2026/april
      responses:
        "201":
          description: Folder created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FolderInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/folders/{path}:
    delete:
      operationId: deleteMediaFolder
      tags: [Media]
      summary: Delete an empty media folder
      description: |
        Remove an empty folder from the site-level media directory. The folder
        must be empty (contain no files or subdirectories, hidden files and
        sidecars included); otherwise 422. Requires `api.media.write`.
      parameters:
        - name: path
          in: path
          required: true
          description: Folder path relative to the media root.
          schema:
            type: string
          example: blog/2026
      responses:
        "204":
          description: Folder deleted successfully. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/rename:
    post:
      operationId: renameSiteMedia
      tags: [Media]
      summary: Rename or move a media file
      description: |
        Rename a file or move it to a different folder within the site-level
        media directory. The destination directory is created automatically
        if it does not exist. Any `.meta.yaml` sidecar is also moved, and the
        folders' manual orders are kept in step. Requires `api.media.write`.

        The new name is cleaned: whitespace becomes a dash, characters other
        than letters, digits, `.`, `_` and `-` are dropped, and the source
        file's extension is always kept (any extension given in `to` is
        replaced). If the cleaned name equals the source, nothing changes and
        the file is returned as is. Returns 422 when a file already exists at
        the destination or the cleaned name is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  description: Current file path relative to the media root.
                  example: blog/hero.jpg
                to:
                  type: string
                  description: New file path relative to the media root.
                  example: blog/banner.jpg
      responses:
        "200":
          description: File renamed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MediaItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/folders/rename:
    post:
      operationId: renameMediaFolder
      tags: [Media]
      summary: Rename a media folder
      description: |
        Rename a folder within the site-level media directory. All contents
        of the folder are preserved. Requires `api.media.write`. Returns 422
        when something already exists at the destination. The returned
        `children_count` and `file_count` are the renamed folder's real
        counts, matching the folder listing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  description: Current folder path relative to the media root.
                  example: blog/old-name
                to:
                  type: string
                  description: New folder path relative to the media root.
                  example: blog/new-name
      responses:
        "200":
          description: Folder renamed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FolderInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/raw/{path}:
    get:
      operationId: getRawSiteMedia
      tags: [Media]
      summary: Download a site media file
      description: |
        Stream a file from the site media folder. Used for files the web server will not serve directly; everything else keeps its static URL. Only images, video, audio, fonts and PDFs are served; any other type returns 404 so the route cannot be used to read source files. Responses carry a sandboxing `Content-Security-Policy` so an uploaded SVG cannot run script when opened directly. Works as an `<img src>` because the API accepts the site's session cookie. Requires `api.media.read`.
      parameters:
        - name: path
          in: path
          required: true
          description: Path relative to the site media root. May contain `/`.
          schema:
            type: string
          example: photos/beach.jpg
      responses:
        "200":
          description: The file bytes, with its detected MIME type.
          headers:
            Content-Disposition:
              description: "`inline; filename=\"<basename>\"`"
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
                example: "default-src 'none'; style-src 'unsafe-inline'; sandbox"
            Cache-Control:
              schema:
                type: string
                example: private, max-age=600
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
            font/*:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/batch/meta:
    post:
      operationId: batchUpdateSiteMediaMeta
      tags: [Media]
      summary: Apply metadata to several site media files
      description: |
        Write the same metadata fields to many site media files at once. Only the configured fields present in `fields` change; each file keeps its other values. Every file is handled on its own, so one failure is reported in `results` without stopping the rest. The number of files is capped by `plugins.api.batch.max_items` (default 50). Requires `api.media.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, fields]
              properties:
                files:
                  type: array
                  minItems: 1
                  description: Paths relative to the site media root.
                  items:
                    type: string
                fields:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  description: Metadata field key to value. An empty string (or empty array for a `tags` field) clears that field.
            example:
              files: [photos/beach.jpg, photos/dunes.jpg]
              fields:
                tags: [beach, summer]
      responses:
        "200":
          description: Per-file results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                            status:
                              type: string
                              enum: [success, error]
                            message:
                              type: string
                              description: Present only when `status` is `error`.
                          required: [path, status]
                      total:
                        type: integer
                      successful:
                        type: integer
                      failed:
                        type: integer
              example:
                data:
                  results:
                    - { path: photos/beach.jpg, status: success }
                    - { path: photos/missing.jpg, status: error, message: Media file not found. }
                  total: 2
                  successful: 1
                  failed: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /media/order:
    post:
      operationId: setSiteMediaOrder
      tags: [Media]
      summary: Save the manual file order of a media folder
      description: |
        Store a manual ordering for the files in a site media folder. The order is written to a `media_order.yaml` file in that folder and applied when the folder is listed. Entries are reduced to base filenames. Requires `api.media.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                path:
                  type: string
                  description: Folder relative to the site media root. Omit for the root folder.
                  example: photos
                order:
                  type: array
                  description: Filenames in the desired order.
                  items:
                    type: string
            example:
              path: photos
              order: [dunes.jpg, beach.jpg, sunset.jpg]
      responses:
        "204":
          description: Order saved. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Menubar
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Taxonomy
  # ---------------------------------------------------------------------------
  /taxonomy:
    get:
      operationId: listTaxonomy
      tags: [Pages]
      summary: List all taxonomy types and values
      description: |
        Return every taxonomy type (e.g. `category`, `tag`) and the set of
        values currently in use across all pages. Every type declared in
        `site.taxonomies` is included, with an empty list when no page uses
        it yet.

        Requires `api.pages.read`.
      responses:
        "200":
          description: Taxonomy map returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Map of taxonomy type to the values in use for it.
                    additionalProperties:
                      type: array
                      items:
                        type: string
                example:
                  data:
                    category: [blog, tutorials]
                    tag: [grav, php]
                    author: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Config
  # ---------------------------------------------------------------------------
  /config/{scope}:
    get:
      operationId: getConfig
      tags: [Config]
      summary: Read configuration for a scope
      description: |
        Retrieve the current configuration for the given scope. Supported
        scopes are:

        | Scope | Maps to |
        |---|---|
        | `system` | `system` config |
        | `site` | `site` config |
        | `plugins/{name}` | `plugins.{name}` config |
        | `themes/{name}` | `themes.{name}` config |
        | `media`, `security` | the matching core config |
        | `scheduler`, `backups` | tool-managed core config, API super users only (403 otherwise) |
        | `<custom>` | a site-authored `user/config/<custom>.yaml` |

        Requires `api.config.read`. An unknown scope returns 404.

        The body is the effective configuration for the target layer
        selected by `X-Config-Environment` (see below), recomputed from the
        YAML files, with secret values (passwords, API keys, tokens) masked.
        `meta` lists the leaf paths the target layer overrides and the value
        each would fall back to.

        The response includes an `ETag` header for optimistic concurrency on
        subsequent PATCH requests. It is computed from the persisted
        overrides, not the full body.
      parameters:
        - $ref: "#/components/parameters/configScope"
        - name: X-Config-Environment
          in: header
          required: false
          description: |
            Environment layer to read. Empty, `default` or `base` targets the
            base `user/config`; when absent, the active environment is used if
            it has a config folder. An invalid name returns 422.
          schema:
            type: string
          example: localhost
      responses:
        "200":
          description: Configuration returned successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigObject"
                  meta:
                    type: object
                    properties:
                      overrides:
                        type: array
                        description: Dotted leaf paths the target layer overrides.
                        items:
                          type: string
                        example: [pages.theme]
                      fallback:
                        type: object
                        additionalProperties: true
                        description: For each override, the value it would revert to.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updateConfig
      tags: [Config]
      summary: Partially update configuration
      description: |
        Deep-merge the provided values into the existing configuration for the
        given scope. The merged result is persisted to the corresponding YAML
        file and the config cache is cleared. Only the values that differ from
        the parent layer are written, and values supplied through
        `GRAV_CONFIG__*` environment variables are never persisted.

        Requires `api.config.write`. Writes to `system`, `security` and
        `plugins/api` also need an API super user, and the tool-managed
        `scheduler` and `backups` scopes are super-only for reading and
        writing (403 otherwise). An empty body, or a changed field that fails
        blueprint validation, returns 422. Masked secrets sent back unchanged
        keep their stored value.

        Send the current `ETag` in `If-Match` to detect concurrent edits.
        The response has the same structure as `GET /config/{scope}` and
        carries an `X-Invalidates` header (`config:update:<scope>`, plus
        `plugins:update:<name>` and `plugins:list` for plugin scopes).
      parameters:
        - $ref: "#/components/parameters/configScope"
        - $ref: "#/components/parameters/ifMatch"
        - name: X-Config-Environment
          in: header
          required: false
          description: |
            Environment layer to write. Empty, `default` or `base` targets the
            base `user/config`; when absent, the active environment is used if
            it has a config folder. A name that is invalid or has no folder
            returns 422.
          schema:
            type: string
          example: localhost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigObject"
            example:
              pages:
                theme: quark
              debugger:
                enabled: false
      responses:
        "200":
          description: Configuration updated successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Invalidates:
              description: Client cache tags to evict.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigObject"
                  meta:
                    type: object
                    properties:
                      overrides:
                        type: array
                        description: Dotted leaf paths the target layer overrides after the save.
                        items:
                          type: string
                      fallback:
                        type: object
                        additionalProperties: true
                        description: For each override, the value it would revert to.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /config:
    get:
      operationId: listConfigScopes
      tags: [Config]
      summary: List configuration sections
      description: |
        Returns the configuration scopes the admin shows as tabs. Requires `api.config.read`.
        The list always starts with `system` and `site` and ends with `info` (a client-side system-information tab, not a readable scope). In between, sorted by name, come the core scopes `media` and `security` plus any site- or extension-authored custom scopes. `backups` is included for super-admins only. `scheduler` is never listed.
      responses:
        "200":
          description: Ordered list of scope names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                    example: [system, site, backups, media, security, info]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /config/accounts:
    get:
      operationId: getAccountsConfig
      tags: [Config]
      summary: Read the accounts configuration
      description: |
        Returns the Flex accounts configuration (`flex.accounts`, stored in `user/config/flex/accounts.yaml`), the Users "Configuration" tab in classic admin. Requires super-admin (`admin.super`). The response includes an `ETag` for use with `If-Match` on PATCH.
      responses:
        "200":
          description: Accounts configuration.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateAccountsConfig
      tags: [Config]
      summary: Update the accounts configuration
      description: |
        Deep-merges the body into the accounts configuration and writes it to the base `user/config/flex/accounts.yaml` (never an environment overlay). Nested maps merge; lists are replaced whole. Values injected through `GRAV_CONFIG__*` environment variables are not written to disk. Requires super-admin (`admin.super`).
        Send the current `ETag` in `If-Match` to detect concurrent edits. Fires `onApiConfigUpdated` with scope `flex/accounts`.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigObject"
      responses:
        "200":
          description: Updated accounts configuration.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Invalidates:
              description: Client cache tags to evict (`config:update:flex/accounts`).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /config/{scope}/revert:
    post:
      operationId: revertConfig
      tags: [Config]
      summary: Revert configuration overrides
      description: |
        Drops overrides from the active configuration layer so the values fall back to the parent layer (defaults for a base write, defaults plus base for an environment write). Requires `api.config.write`. Writes to `system`, `security` and `plugins/api` also need an API super user, and the tool-managed `scheduler` and `backups` scopes are super-only for reading and writing.
        Send `keys` (dotted paths) to remove individual overrides, or `reset: true` to delete the layer's file for that scope entirely. The target layer follows the same rules as `PATCH /config/{scope}`: the `X-Config-Environment` header picks it, an empty value (or `default` / `base`) means the base `user/config`, and when absent the active environment is used if it has a config folder.
        The response is the effective configuration after the revert, with secrets masked, and `meta` lists the paths that still override the parent layer. Reverting something the layer does not override (for example `reset: true` when the layer has no file) is still a 200, but `meta.reverted` is false and no `onApiConfigUpdated` event (so no `config.updated` webhook) fires.
      parameters:
        - $ref: "#/components/parameters/configScope"
        - $ref: "#/components/parameters/ifMatch"
        - name: X-Config-Environment
          in: header
          required: false
          description: Environment layer to revert. Empty, `default` or `base` targets the base `user/config`.
          schema:
            type: string
          example: localhost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide a non-empty `keys` array, or `reset` set to true.
              properties:
                keys:
                  type: array
                  description: Dotted paths of the overrides to drop.
                  items:
                    type: string
                  example: [pages.theme, debugger.enabled]
                reset:
                  type: boolean
                  description: Delete the layer's file for this scope, dropping every override at once. Takes precedence over `keys`.
                  default: false
      responses:
        "200":
          description: Effective configuration after the revert.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Invalidates:
              description: Client cache tags to evict.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigObject"
                  meta:
                    type: object
                    properties:
                      overrides:
                        type: array
                        description: Dotted leaf paths the active layer still overrides.
                        items:
                          type: string
                        example: [pages.markdown.extra]
                      fallback:
                        type: object
                        additionalProperties: true
                        description: For each remaining override, the value it would revert to.
                      reverted:
                        type: boolean
                        description: Whether anything on disk changed. False when the layer did not override what was asked.
                        example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Groups
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List all users
      description: |
        Retrieve a paginated list of user accounts, sorted by username.

        Requires `api.users.read` to see every account. A caller without it
        is not rejected: the listing is narrowed to their own account only
        (a single-row page), and the filters below are ignored.

        Each row may carry an `extra` map of plugin column values (see
        `GET /users/columns`).
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on username, email, full name and title.
          schema:
            type: string
        - name: access
          in: query
          required: false
          description: |
            Only users effectively granted this permission (group access
            included, parent keys cover children, super admins match
            everything except the super flags themselves), e.g. `admin.login`.
          schema:
            type: string
          example: admin.login
        - name: permission
          in: query
          required: false
          description: Alias for `access`, used when `access` is not sent.
          schema:
            type: string
        - name: group
          in: query
          required: false
          description: Only members of this group.
          schema:
            type: string
          example: editors
        - name: filter
          in: query
          required: false
          description: |
            Id of a plugin-declared Users tab from `GET /users/filters`. The
            owning plugin narrows the list through `onApiUserListFilter`. Omit
            for the built-in "All Users" tab. Applied on both the Flex and the
            filesystem account backends.
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      operationId: createUser
      tags: [Users]
      summary: Create a new user
      description: |
        Create a new user account. Requires `api.users.write`. The username
        must be 3-64 characters and pass Grav core's username rules (no
        leading period, no `..`, and none of `\ / ? * : ; { }` or a line
        break).

        Granting `admin.super` or `api.super` through `access` requires a
        super admin (403). `groups` is applied only for a super admin. The
        password must meet the password policy (`system.pwd_regex`, or at
        least 8 characters when none is set; see `GET /auth/password-policy`).
        The submitted fields are validated against the account blueprint,
        with failures returned as 422. Returns 409 when the username is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              username: johndoe
              password: s3cureP@ss
              email: john@example.com
              fullname: John Doe
              title: Editor
              state: enabled
              access:
                api:
                  access: true
                  pages:
                    read: true
                    write: true
      responses:
        "201":
          description: User created successfully.
          headers:
            Location:
              description: URL of the newly created user resource.
              schema:
                type: string
                example: /api/v1/users/johndoe
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{username}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a single user
      description: |
        Retrieve a user account by username. The response includes an `ETag`
        header for optimistic concurrency on PATCH requests.

        Fetching your own account needs only `api.access`; any other account
        requires `api.users.read`.
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "200":
          description: User returned successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updateUser
      tags: [Users]
      summary: Partially update a user
      description: |
        Apply a partial update to an existing user account. Users can update
        their own account with the basic `api.access` permission; updating
        other users requires `api.users.write`. Some fields carry their own
        gate (see `UpdateUserRequest`). Only a super admin may modify a super
        admin account (403).

        Send the current `ETag` in `If-Match` to detect concurrent edits; a
        stale value returns 409. The submitted fields are validated against
        the account blueprint (422 on failure), and a new `password` must meet
        the password policy from `GET /auth/password-policy`.
      parameters:
        - $ref: "#/components/parameters/username"
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              fullname: Jane Doe
              email: jane@example.com
              state: enabled
      responses:
        "200":
          description: User updated successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: |
        Permanently remove a user account. Requires `api.users.write`. You
        cannot delete your own account; a `403 Forbidden` is returned if you
        try. Only a super admin may delete a super admin account (403).
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "204":
          description: User deleted successfully. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # User Avatar
  # ---------------------------------------------------------------------------
  /users/{username}/avatar:
    post:
      operationId: uploadUserAvatar
      tags: [Users]
      summary: Upload user avatar
      description: |
        Upload or replace the avatar image for the specified user. The image is
        sent as `multipart/form-data` in an `avatar` field (`file` is accepted
        as a fallback). Users can update their own avatar with `api.access`;
        updating another user's avatar requires `api.users.write`, and only a
        super admin may change a super admin's avatar.

        The file must be a real PNG, JPEG or WebP image (checked from its
        bytes, not the declared type) of at most 8 MB; anything else returns
        422.
      parameters:
        - $ref: "#/components/parameters/username"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Avatar image file to upload (PNG, JPEG or WebP, max 8 MB).
                file:
                  type: string
                  format: binary
                  description: Fallback field name, read only when `avatar` is absent.
      responses:
        "201":
          description: Avatar uploaded successfully. Returns the full user object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteUserAvatar
      tags: [Users]
      summary: Remove user avatar
      description: |
        Remove the avatar image for the specified user. Users can remove their
        own avatar with `api.access`; removing another user's avatar requires
        `api.users.write`, and only a super admin may change a super admin's
        avatar.
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "200":
          description: Avatar removed successfully. Returns the full user object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # User 2FA
  # ---------------------------------------------------------------------------
  /users/{username}/2fa:
    post:
      operationId: generateUser2FA
      tags: [Users]
      summary: Generate 2FA secret and QR code
      description: |
        Generate a new two-factor authentication secret and QR code data URI
        for the specified user. The client should display the QR code for the
        user to scan with their authenticator app, then confirm activation by
        sending a current code to `POST /users/{username}/2fa/enable`.

        Generating (or regenerating) a secret saves it to the account and
        turns `twofa_enabled` off until a code is verified against the new
        secret. Users can generate their own secret with `api.access`; doing
        it for another user requires `api.users.write`, and only a super admin
        may do it for a super admin. Returns 500 when the Login plugin's 2FA
        support is not installed.
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "200":
          description: 2FA secret and QR code generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                        description: The TOTP secret key, in space-separated groups of four characters for readability.
                        example: JBSW Y3DP EHPK 3PXP
                      qr_code:
                        type: string
                        description: QR code as a data URI (PNG image encoded as base64).
                        example: "data:image/png;base64,iVBORw0KGgo..."
              example:
                data:
                  secret: JBSW Y3DP EHPK 3PXP
                  qr_code: "data:image/png;base64,iVBORw0KGgo..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: 2FA support is not available (the Login plugin is not installed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # API Keys
  # ---------------------------------------------------------------------------
  /users/{username}/api-keys:
    get:
      operationId: listApiKeys
      tags: [Users]
      summary: List API keys for a user
      description: |
        Return all API keys for the specified user. The response includes
        key metadata but never the key hash. Users can list their own keys
        with `api.access`; listing another user's keys requires
        `api.users.read`.
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "200":
          description: List of API keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      operationId: createApiKey
      tags: [Users]
      summary: Create a new API key
      description: |
        Generate a new API key for the specified user. The raw key value is
        returned **only once** in the `api_key` field of the response -- it
        cannot be retrieved again.

        Users can create keys for their own account with `api.access`;
        creating keys for other users requires `api.users.write`, and only a
        super admin may create keys for a super admin.

        A request authenticated with a scoped API key can only create a key
        whose scopes are a subset of its own, and cannot create an unscoped
        (full-access) key; either attempt returns 403.
      parameters:
        - $ref: "#/components/parameters/username"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A human-readable label for the key.
                  default: API Key
                  example: CI/CD Pipeline
                scopes:
                  type: array
                  items:
                    type: string
                  description: Optional list of permission scopes to restrict this key.
                  example: [api.pages.read, api.media.read]
                expiry_days:
                  type: integer
                  nullable: true
                  description: Number of days until the key expires. Omit or set to null for no expiry.
                  example: 90
            example:
              name: CI/CD Pipeline
              scopes: [api.pages.read, api.media.read]
              expiry_days: 90
      responses:
        "201":
          description: API key created. The raw key is returned only in this response.
          headers:
            Location:
              description: URL of the user's API keys collection.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/ApiKey"
                      - type: object
                        properties:
                          api_key:
                            type: string
                            description: |
                              The raw API key. Store it securely -- it is
                              shown only once and cannot be retrieved later.
                            example: grav_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{username}/api-keys/{keyId}:
    delete:
      operationId: deleteApiKey
      tags: [Users]
      summary: Revoke an API key
      description: |
        Permanently delete an API key. Any future requests using this key
        will be rejected. Users can revoke their own keys with `api.access`;
        revoking another user's key requires `api.users.write`, and only a
        super admin may revoke a super admin's key. Returns 404 when the key
        does not belong to this user.
      parameters:
        - $ref: "#/components/parameters/username"
        - name: keyId
          in: path
          required: true
          description: Unique identifier of the API key.
          schema:
            type: string
          example: a1b2c3d4e5f6a7b8
      responses:
        "204":
          description: API key revoked. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/columns:
    get:
      operationId: listUserListColumns
      tags: [Users]
      summary: List plugin columns for the users list
      description: |
        Return the extra columns plugins add to the users list through the `onApiUserListColumns` event, filtered by each column's `authorize` and sorted by priority. The values for each user arrive in that user's `extra` map on `GET /users`. Requires `api.users.read`.
      responses:
        "200":
          description: Column definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      columns:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserListColumn"
              example:
                data:
                  columns:
                    - id: my-plugin-valid-till
                      plugin: my-plugin
                      label: Valid until
                      field: subscription.valid_till
                      formatter: datetime
                      sortable: false
                      priority: 50
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/filters:
    get:
      operationId: listUserListFilters
      tags: [Users]
      summary: List filter tabs for the users list
      description: |
        Return the tabs shown above the users list. Plugins add tabs through the `onApiUserListFilters` event; selecting one sends `?filter=<id>` to `GET /users`. The built-in `all` tab leads the row unless a plugin hides it (only possible once that plugin contributes a visible tab of its own). Requires `api.users.read`.
      responses:
        "200":
          description: Filter tabs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tabs:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserListFilterTab"
                      defaultFilter:
                        type: string
                        description: Id of the tab to open when no filter is selected.
                      showAll:
                        type: boolean
                        description: Whether the built-in `all` tab is present.
              example:
                data:
                  tabs:
                    - { id: all, plugin: api, label: All Users }
                    - { id: active, plugin: my-plugin, label: Active, icon: fa-bolt, priority: 10 }
                  defaultFilter: all
                  showAll: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/row-actions:
    get:
      operationId: listUserRowActions
      tags: [Users]
      summary: List plugin row actions for the users list
      description: |
        Return the per-user action buttons plugins declare through the `onApiUserListRowActions` event, filtered by each action's `authorize`, capped at 24 and sorted by priority. Run one with `POST /users/{username}/row-action`. Requires `api.users.read`.
      responses:
        "200":
          description: Row action definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      actions:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserRowAction"
              example:
                data:
                  actions:
                    - id: impersonate-user
                      plugin: impersonate
                      label: Impersonate
                      icon: fa-user-secret
                      action: start
                      confirm: Impersonate this user?
                      priority: 80
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{username}/row-action:
    post:
      operationId: runUserRowAction
      tags: [Users]
      summary: Run a plugin row action on a user
      description: |
        Run a declared row action against one user through the `onApiUserListRowAction` event. The action's `authorize` is checked again on the server, and an action the caller may not use returns 404 just like an unknown id. Non-super callers cannot target a super-admin account. The plugin handler applies its own per-target rules on top. The result is reduced to `status`, `message` and a same-origin `url`; a handler error comes back as 200 with `status: error` rather than failing the request. Requires `api.users.read`.
      parameters:
        - $ref: "#/components/parameters/username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Id of a row action from `GET /users/row-actions`.
            example:
              id: impersonate-user
      responses:
        "200":
          description: Action result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserRowActionResult"
              example:
                data:
                  status: success
                  message: Now impersonating jane.
                  url: /
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{username}/2fa/enable:
    post:
      operationId: enableUser2FA
      tags: [Users]
      summary: Turn on 2FA
      description: |
        Confirm two-factor authentication by verifying a code against the secret generated with `POST /users/{username}/2fa`, then turn 2FA on. Only the account owner can do this, since it proves possession of the secret, and it requires `api.access`. Any other caller gets 403, whether or not the username exists. Returns 500 when the Login plugin's 2FA support is not installed.
      parameters:
        - $ref: "#/components/parameters/username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Current code from the authenticator app.
                  example: "123456"
      responses:
        "200":
          description: 2FA turned on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      twofa_enabled:
                        type: boolean
                        enum: [true]
              example:
                data:
                  twofa_enabled: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{username}/2fa/disable:
    post:
      operationId: disableUser2FA
      tags: [Users]
      summary: Turn off 2FA
      description: |
        Turn off two-factor authentication and clear the secret. The account owner needs `api.access` and must send a valid current `code`. A caller with `api.users.write` (or a super admin), acting through a token or key whose scope includes `api.users.write`, can turn it off for another user without a code, for lost-device recovery; only super admins can do so for a super-admin account.
      parameters:
        - $ref: "#/components/parameters/username"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Current authenticator code. Required when disabling your own 2FA without `api.users.write`.
                  example: "123456"
      responses:
        "200":
          description: 2FA turned off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      twofa_enabled:
                        type: boolean
                        enum: [false]
              example:
                data:
                  twofa_enabled: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------
  /system/environments:
    get:
      operationId: getEnvironments
      summary: List available environments
      tags: [System]
      description: |
        Returns the environment Grav detected for this request and the
        environments that can be selected as configuration write targets.
        Requires `api.system.read`.

        The first entry is always the base configuration (`user/config`),
        with `name: ""` and `label: "Default"`. Every other entry is an
        existing `user/env/<name>/` folder (legacy `user/<host>/config/`
        layouts are included too). The `hasOverrides` flag is always `false`
        on the base row.
      responses:
        '200':
          description: Environment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      detected:
                        type: string
                        description: Environment Grav inferred from the request URL.
                        example: localhost
                      environments:
                        type: array
                        items:
                          $ref: "#/components/schemas/EnvironmentEntry"
              example:
                data:
                  detected: localhost
                  environments:
                    - name: ""
                      label: Default
                      exists: true
                      hasOverrides: false
                    - name: staging.example.com
                      label: staging.example.com
                      exists: true
                      hasOverrides: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createEnvironment
      tags: [System]
      summary: Create an environment
      description: |
        Creates an empty environment folder at `user/env/<name>/config`. Requires `api.config.write`. The name must start with a letter or digit and contain only letters, digits, `.`, `_` and `-`. The names `default` and `base` are reserved, and an existing environment cannot be created again (both return 422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
                  description: Environment name, usually a hostname.
                  example: staging.example.com
      responses:
        "201":
          description: Environment created.
          headers:
            X-Invalidates:
              description: Always `system:environments`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EnvironmentEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/info:
    get:
      operationId: getSystemInfo
      tags: [System]
      summary: Get system information
      description: |
        Return runtime information about the Grav installation including
        Grav version, PHP version, loaded extensions, installed plugins and
        themes, plus a grouped digest of PHP configuration. Requires
        `api.system.read`. For demo accounts, `server_software` and the
        path-bearing `php_config` values are replaced with
        `(hidden in demo mode)`.
      responses:
        "200":
          description: System information returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /cache:
    delete:
      operationId: clearCache
      tags: [System]
      summary: Clear the cache
      description: |
        Clear the Grav cache. The `scope` query parameter controls which
        cache pool is purged: `images`, `assets` and `tmp` clear only that
        folder (core's `images-only`, `assets-only`, `tmp-only`). Requires
        `api.system.write`; an unknown scope returns 422.
      parameters:
        - name: scope
          in: query
          description: Cache scope to clear.
          schema:
            type: string
            enum: [all, standard, images, assets, tmp]
            default: standard
      responses:
        "200":
          description: Cache cleared successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scope:
                        type: string
                        example: standard
                      message:
                        type: string
                        example: "Cache cleared successfully (scope: standard)."
                      details:
                        type: array
                        items:
                          type: string
                        description: Per-directory results from the cache clear operation.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/logs:
    get:
      operationId: getSystemLogs
      tags: [System]
      summary: Read log entries
      description: |
        Return paginated entries from a log file (default `grav.log`).
        Entries are returned newest-first. Optionally filter by log level
        and by a message substring. Requires `api.system.read`; demo
        accounts get 403. A registered log that has not been written yet
        returns an empty page.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: file
          in: query
          description: |
            Log file to read. Must be one of the names listed by
            `GET /system/logs/files`; anything else returns 422.
          schema:
            type: string
            default: grav.log
          example: security.log
        - name: level
          in: query
          description: Filter entries by log level (case-insensitive).
          schema:
            type: string
            enum: [DEBUG, INFO, NOTICE, WARNING, ERROR, CRITICAL, ALERT, EMERGENCY]
          example: ERROR
        - name: search
          in: query
          description: Case-insensitive substring the entry's message must contain.
          schema:
            type: string
          example: not found
      responses:
        "200":
          description: Paginated list of log entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/LogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: clearSystemLog
      tags: [System]
      summary: Clear a log file
      description: |
        Empty out one of the log files listed by `GET /system/logs/files`.

        Requires super-admin (`admin.super`); the read endpoints only require
        `api.system.read`. The file is truncated rather than deleted, and a
        single entry recording who cleared it is left in its place. The target
        may be given in the body or as a `?file=` query parameter, and defaults
        to `grav.log`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Log file to clear. Must be one of the registered files.
                  default: grav.log
                  example: grav.log
      parameters:
        - name: file
          in: query
          required: false
          description: Log file to clear, when not supplied in the body.
          schema:
            type: string
            default: grav.log
          example: security.log
      responses:
        "200":
          description: Log cleared (or already empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      file:
                        type: string
                        example: grav.log
                      cleared_bytes:
                        type: integer
                        description: Size of the log before it was cleared.
                        example: 450507
                      message:
                        type: string
                        example: "Log cleared: grav.log"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/backup:
    post:
      operationId: createBackup
      tags: [System]
      summary: Create a backup
      description: |
        Trigger a full site backup and return metadata about the generated
        archive. Requires `api.system.backup` (archives carry account
        password hashes and config secrets); demo accounts get 403.
      responses:
        "201":
          description: Backup created successfully.
          headers:
            Location:
              description: URL of the backups list.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/backups:
    get:
      operationId: listBackups
      tags: [System]
      summary: List existing backups
      description: |
        Return metadata for all backup archives found on disk, newest first,
        along with the purge policy and the number of configured backup
        profiles. Requires `api.system.backup`; demo accounts get 403.
      responses:
        "200":
          description: List of backups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      backups:
                        type: array
                        items:
                          $ref: "#/components/schemas/Backup"
                      purge:
                        type: object
                        nullable: true
                        description: The `backups.purge` configuration, used to show storage limits.
                        properties:
                          trigger:
                            type: string
                            enum: [space, number, time]
                            example: space
                          max_backups_count:
                            type: integer
                            example: 25
                          max_backups_space:
                            type: integer
                            description: Maximum total size in GB.
                            example: 5
                          max_backups_time:
                            type: integer
                            description: Maximum age in days.
                            example: 365
                      profiles_count:
                        type: integer
                        description: Number of backup profiles configured in `backups.profiles`.
                        example: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/environments/{name}:
    delete:
      operationId: deleteEnvironment
      tags: [System]
      summary: Delete an environment
      description: |
        Recursively deletes the environment folder `user/env/<name>/` and everything in it. Requires API super authority (not just `api.config.write`), because the folder can hold `system` and `security` overrides that only a super user may write.
        Returns 404 when no `user/env/<name>/` folder exists. Refused with 422 when the name is invalid, when it is the environment Grav resolved for the current request, or when it only exists in the legacy `user/<name>/` layout, which must be removed by hand. A folder that is a symlink pointing outside `user/env/` is also refused.
      parameters:
        - name: name
          in: path
          required: true
          description: Environment name.
          schema:
            type: string
          example: staging.example.com
      responses:
        "204":
          description: Environment deleted.
          headers:
            X-Invalidates:
              description: Always `system:environments`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/logs/files:
    get:
      operationId: listLogFiles
      tags: [System]
      summary: List readable log files
      description: |
        Returns the log files the admin log viewer can open. Requires `api.system.read`, and is refused with 403 for demo accounts. The core logs (`grav.log`, `security.log`, `email.log`, `scheduler.log`) are always listed first, even before they exist; any other `*.log` in the `log://` folder follows, then files plugins add through the `onApiLogFiles` event. Entries are de-duplicated by file name.
      responses:
        "200":
          description: Log file list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          properties:
                            file:
                              type: string
                              description: Log file name inside `log://`.
                              example: security.log
                            label:
                              type: string
                              example: Security Log
                          required: [file, label]
                      default:
                        type: string
                        description: File the viewer opens first.
                        example: grav.log
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/backups/{filename}:
    delete:
      operationId: deleteBackup
      tags: [System]
      summary: Delete a backup
      description: Deletes a backup archive from the `backup://` folder. Requires `api.system.backup`, and is refused with 403 for demo accounts. The filename must be a plain `.zip` name with no path components.
      parameters:
        - $ref: "#/components/parameters/BackupFilename"
      responses:
        "204":
          description: Backup deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/backups/{filename}/download:
    get:
      operationId: downloadBackup
      tags: [System]
      summary: Download a backup
      description: Streams a backup archive as a file download. Requires `api.system.backup`, and is refused with 403 for demo accounts. The filename must be a plain `.zip` name with no path components. Errors are returned as `application/problem+json`.
      parameters:
        - $ref: "#/components/parameters/BackupFilename"
      responses:
        "200":
          description: The backup archive.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"<filename>\"`"
              schema:
                type: string
            Content-Length:
              description: Archive size in bytes.
              schema:
                type: integer
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Languages
  # ---------------------------------------------------------------------------
  /languages:
    get:
      operationId: listLanguages
      tags: [Languages]
      summary: List configured site languages
      description: |
        Return the language configuration for the site, including which
        languages are enabled, the default language, and which language is
        currently active based on the request context. On a single-language
        site `enabled` is false, `languages` is empty and `default`/`active`
        are `null`.

        Requires `api.pages.read`.
      responses:
        "200":
          description: Language configuration returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LanguageInfo"
              example:
                data:
                  enabled: true
                  languages:
                    - code: en
                      name: English
                      native_name: English
                      rtl: false
                      is_default: true
                    - code: fr
                      name: French
                      native_name: Français
                      rtl: false
                      is_default: false
                  default: en
                  active: en
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # GPM
  # ---------------------------------------------------------------------------
  /gpm/plugins:
    get:
      operationId: listInstalledPlugins
      tags: [GPM]
      summary: List installed plugins
      description: |
        Return a list of all installed plugins with their version, enabled
        state, and whether an update is available. Not paginated. Package
        names and descriptions written as translation keys are resolved in
        the caller's admin language.

        A plugin whose settings are drawn on an admin page (its own, or the
        page of a plugin it extends) also carries `settings_route` and, when
        that page belongs to another plugin, `settings_page`.

        Requires `api.gpm.read`.
      responses:
        "200":
          description: List of installed plugins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Package"
              example:
                data:
                  - slug: api
                    name: API
                    version: 1.0.31
                    type: plugin
                    description: RESTful API for Grav CMS.
                    description_html: "<p>RESTful API for Grav CMS.</p>"
                    author:
                      name: Team Grav
                      email: devs@getgrav.org
                      url: https://getgrav.org
                    homepage: https://github.com/getgrav/grav-plugin-api
                    enabled: true
                    is_symlink: false
                    keywords: [api, rest]
                    updatable: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/plugins/{slug}:
    get:
      operationId: getInstalledPlugin
      tags: [GPM]
      summary: Get installed plugin details
      description: |
        Return the package details of a specific installed plugin, with its
        update status. When the plugin ships Admin Next custom field
        components (`admin-next/fields/*.js`) the response lists them in
        `custom_fields`; `settings_route` / `settings_page` are included as
        in `GET /gpm/plugins`. The README and changelog are served by their
        own endpoints.

        Send the `ETag` back in `If-None-Match` to get an empty 304 while
        nothing has changed.

        Requires `api.gpm.read`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Plugin slug (e.g. `admin`, `api`).
          schema:
            type: string
          example: api
        - $ref: "#/components/parameters/ExtensionScriptIfNoneMatch"
      responses:
        "200":
          description: Plugin details returned successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Package"
        "304":
          description: The plugin details have not changed since the ETag sent in `If-None-Match`. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/themes:
    get:
      operationId: listInstalledThemes
      tags: [GPM]
      summary: List installed themes
      description: |
        Return a list of all installed themes with their version, active
        state, and whether an update is available. Not paginated. For themes,
        `enabled` means "is the active theme". Each theme also carries
        `thumbnail` and `screenshot` URLs, resized copies of the theme's own
        `thumbnail.jpg|png` / `screenshot.jpg|png` served from
        `/thumbnails/{file}` (each falls back to the other; both `null` when
        the theme ships neither).

        Requires `api.gpm.read`.
      responses:
        "200":
          description: List of installed themes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Package"
              example:
                data:
                  - slug: quark
                    name: Quark
                    version: 2.0.4
                    type: theme
                    description: Quark is the default theme for Grav CMS.
                    description_html: "<p>Quark is the default theme for Grav CMS.</p>"
                    author:
                      name: Team Grav
                      email: devs@getgrav.org
                      url: https://getgrav.org
                    homepage: https://github.com/getgrav/grav-theme-quark
                    enabled: true
                    is_symlink: false
                    updatable: false
                    thumbnail: https://example.com/api/v1/thumbnails/3f9a1c.jpg
                    screenshot: https://example.com/api/v1/thumbnails/8b2e4d.jpg
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/themes/{slug}:
    get:
      operationId: getInstalledTheme
      tags: [GPM]
      summary: Get installed theme details
      description: |
        Return the package details of a specific installed theme, with its
        update status, `thumbnail` / `screenshot` URLs (as in
        `GET /gpm/themes`) and, when the theme ships Admin Next custom field
        components, `custom_fields`. The README and changelog are served by
        their own endpoints.

        Send the `ETag` back in `If-None-Match` to get an empty 304 while
        nothing has changed.

        Requires `api.gpm.read`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Theme slug (e.g. `quark`).
          schema:
            type: string
          example: quark
        - $ref: "#/components/parameters/ExtensionScriptIfNoneMatch"
      responses:
        "200":
          description: Theme details returned successfully.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Package"
        "304":
          description: The theme details have not changed since the ETag sent in `If-None-Match`. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/plugins/{slug}/readme:
    get:
      operationId: getPluginReadme
      tags: [GPM]
      summary: Get plugin README content
      description: |
        Return the raw Markdown content of the specified plugin's README.md
        file.

        Requires `api.gpm.read`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Plugin slug (e.g. `admin`, `api`).
          schema:
            type: string
          example: api
      responses:
        "200":
          description: Plugin README content returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                        description: Raw Markdown content of the README file.
                        example: "# API Plugin\n\nRESTful API for Grav CMS."
              example:
                data:
                  content: "# API Plugin\n\nRESTful API for Grav CMS."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/plugins/{slug}/changelog:
    get:
      operationId: getPluginChangelog
      tags: [GPM]
      summary: Get plugin changelog content
      description: |
        Return the raw Markdown content of the specified plugin's CHANGELOG.md
        file.

        Requires `api.gpm.read`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Plugin slug (e.g. `admin`, `api`).
          schema:
            type: string
          example: api
      responses:
        "200":
          description: Plugin changelog content returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                        description: Raw Markdown content of the CHANGELOG file.
                        example: "# v1.0.0\n\n- Initial release"
              example:
                data:
                  content: "# v1.0.0\n\n- Initial release"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/themes/{slug}/readme:
    get:
      operationId: getThemeReadme
      tags: [GPM]
      summary: Get theme README content
      description: |
        Return the raw Markdown content of the specified theme's README.md
        file.

        Requires `api.gpm.read`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Theme slug (e.g. `quark`).
          schema:
            type: string
          example: quark
      responses:
        "200":
          description: Theme README content returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                        description: Raw Markdown content of the README file.
                        example: "# Quark Theme\n\nDefault theme for Grav CMS."
              example:
                data:
                  content: "# Quark Theme\n\nDefault theme for Grav CMS."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/themes/{slug}/changelog:
    get:
      operationId: getThemeChangelog
      tags: [GPM]
      summary: Get theme changelog content
      description: |
        Return the raw Markdown content of the specified theme's CHANGELOG.md
        file.

        Requires `api.gpm.read`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Theme slug (e.g. `quark`).
          schema:
            type: string
          example: quark
      responses:
        "200":
          description: Theme changelog content returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                        description: Raw Markdown content of the CHANGELOG file.
                        example: "# v2.0.4\n\n- Bug fixes"
              example:
                data:
                  content: "# v2.0.4\n\n- Bug fixes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/updates:
    get:
      operationId: checkUpdates
      tags: [GPM]
      summary: Check for updates
      description: |
        Check the GPM repository for available updates to Grav core,
        installed plugins, and installed themes. Only packages that have an
        update are listed under `plugins` / `themes`.

        Requires `api.gpm.read`.
      parameters:
        - name: flush
          in: query
          required: false
          description: Refresh the cached GPM repository data before checking (any boolean-like value, e.g. `1` or `true`).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Update check completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [grav, plugins, themes, total, installed]
                    properties:
                      grav:
                        type: object
                        description: Grav core version and update info. Always present.
                        required: [current, available, updatable, date, is_symlink]
                        properties:
                          current:
                            type: string
                            description: Installed Grav version.
                            example: 2.1.0
                          available:
                            type: string
                            nullable: true
                            description: Latest Grav version in the repository, or `null` when the repository could not be read.
                            example: 2.1.1
                          updatable:
                            type: boolean
                            description: Whether `available` is newer than `current`.
                            example: true
                          date:
                            type: string
                            nullable: true
                            description: Release date of the available version, as the repository reports it.
                            example: "2026-09-18"
                          is_symlink:
                            type: boolean
                            description: Whether Grav core is symlinked (a symlinked install cannot be upgraded through `POST /gpm/upgrade`).
                            example: false
                      plugins:
                        type: array
                        description: Installed plugins with an update. `version` is the installed version, `available_version` the new one.
                        items:
                          $ref: "#/components/schemas/Package"
                      themes:
                        type: array
                        description: Installed themes with an update. `version` is the installed version, `available_version` the new one.
                        items:
                          $ref: "#/components/schemas/Package"
                      total:
                        type: integer
                        description: Total number of available updates, counting Grav core as one.
                        example: 2
                      installed:
                        type: integer
                        description: Number of installed plugins and themes combined.
                        example: 14
              example:
                data:
                  grav:
                    current: 2.1.0
                    available: 2.1.1
                    updatable: true
                    date: "2026-09-18"
                    is_symlink: false
                  plugins:
                    - slug: form
                      name: Form
                      version: 8.1.0
                      type: plugin
                      description: Enables forms handling and processing.
                      description_html: "<p>Enables forms handling and processing.</p>"
                      author:
                        name: Team Grav
                        email: devs@getgrav.org
                        url: https://getgrav.org
                      homepage: https://github.com/getgrav/grav-plugin-form
                      enabled: true
                      is_symlink: false
                      available_version: 8.2.0
                      updatable: true
                  themes: []
                  total: 2
                  installed: 14
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/install:
    post:
      operationId: installPackage
      tags: [GPM]
      summary: Install a package
      description: |
        Install a plugin or theme from the GPM repository. Requires
        `api.gpm.write` permission.

        For premium packages, include a `license` field or ensure the license
        has already been registered via the license-manager plugin/API.

        Dependencies the package needs (missing or outdated plugins) are
        installed first, one at a time; their slugs are returned in
        `dependencies`. If one fails partway, the 500 detail names the
        dependencies that were already installed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  description: Package slug to install.
                  example: shortcode-core
                type:
                  type: string
                  enum: [plugin, theme]
                  default: plugin
                  description: Package type.
                  example: plugin
                license:
                  type: string
                  description: |
                    License key for premium packages, exactly as the store that sold the package sent it (a Grav Premium key looks like `XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX`, a KahunaCart key like `KC-XXXX-XXXX-XXXX-XXXX`).
                    If omitted, the system checks `user://data/licenses.yaml` for an existing license.
                    The key is saved to `licenses.yaml` only when `package` names a package in the repository, and it is removed again (or the key it replaced is put back) if the install fails.
                  example: A1B2C3D4-E5F6A7B8-C9D0E1F2-A3B4C5D6
            example:
              package: shortcode-core
              type: plugin
      responses:
        "201":
          description: Package installed successfully.
          headers:
            X-Invalidates:
              description: Client cache tags to refresh, e.g. `plugins:create:{slug}, plugins:list, gpm:update`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GpmPackageActionResult"
              example:
                data:
                  message: "Plugin 'shortcode-ui' installed successfully. Dependencies installed: shortcode-core."
                  package: shortcode-ui
                  type: plugin
                  dependencies: [shortcode-core]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            `package` is missing, `type` is not `plugin`/`theme`, the package
            is already installed, the `license` is not a valid key, a premium
            package has no license, or GPM reports the package (or one of its
            dependencies) cannot be installed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: "Plugin 'shortcode-core' is already installed. Use the update endpoint to update it."
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: A dependency or the package itself failed to install.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                title: Installation Failed
                detail: "Failed to install dependency 'shortcode-core' for plugin 'shortcode-ui'."

  /gpm/remove:
    post:
      operationId: removePackage
      tags: [GPM]
      summary: Remove a package
      description: |
        Remove an installed plugin or theme. Whether it is a plugin or a
        theme is detected from what is installed. Requires `api.gpm.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  description: Package slug to remove.
                  example: shortcode-core
            example:
              package: shortcode-core
      responses:
        "204":
          description: Package removed. No body.
          headers:
            X-Invalidates:
              description: Client cache tags to refresh, e.g. `plugins:delete:{slug}, plugins:list, gpm:update`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The package is not installed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not Found
                detail: "Package 'shortcode-core' is not installed."
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: GPM failed to remove the package.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                title: Removal Failed
                detail: "Failed to remove plugin 'shortcode-core'."

  /gpm/update:
    post:
      operationId: updatePackage
      tags: [GPM]
      summary: Update a package
      description: |
        Update a single installed plugin or theme to the latest version.
        Whether it is a plugin or a theme is detected from what is
        installed. Dependencies that are missing or outdated are installed
        first and listed in `dependencies`. Requires `api.gpm.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  description: Package slug to update.
                  example: admin
            example:
              package: admin
      responses:
        "200":
          description: Package updated successfully.
          headers:
            X-Invalidates:
              description: Client cache tags to refresh, e.g. `plugins:update:{slug}, plugins:list, gpm:update`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GpmPackageActionResult"
              example:
                data:
                  message: "Package 'admin' updated successfully."
                  package: admin
                  type: plugin
                  dependencies: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No plugin or theme with that slug is installed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not Found
                detail: "Package 'admin' is not installed."
        "422":
          description: |
            `package` is missing, the installed package has no update, or
            GPM reports the update (or one of its dependencies) cannot be
            installed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: "Plugin 'admin' is already up to date."
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: A dependency or the package itself failed to update.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                title: Update Failed
                detail: "Failed to update 'admin'."

  /gpm/update-all:
    post:
      operationId: updateAllPackages
      tags: [GPM]
      summary: Update all packages
      description: |
        Update all installed plugins and themes that have available updates.
        The repository cache is refreshed first. Each package goes through
        the same dependency checks as `POST /gpm/update`; a package that
        fails does not stop the others, so the response is 200 even when
        some (or all) packages land in `failed`. No request body.
        Requires `api.gpm.write`.
      responses:
        "200":
          description: Update run finished. Check `failed` for packages that were not updated.
          headers:
            X-Invalidates:
              description: Always `plugins:list, themes:list, gpm:update`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [updated, failed, skipped, cascaded_dependencies]
                    properties:
                      updated:
                        type: array
                        items:
                          type: string
                        description: Slugs of packages that were updated.
                        example: [admin2, api]
                      failed:
                        type: array
                        description: Packages that were not updated, each with the reason.
                        items:
                          type: object
                          required: [package, error]
                          properties:
                            package:
                              type: string
                              example: email
                            error:
                              type: string
                              example: "Failed to install dependency 'form': Download failed."
                      skipped:
                        type: array
                        description: Packages already brought up to date as a dependency of an earlier package in the same run.
                        items:
                          type: object
                          required: [package, reason]
                          properties:
                            package:
                              type: string
                              example: form
                            reason:
                              type: string
                              example: already up to date (installed as a dependency)
                      cascaded_dependencies:
                        type: array
                        items:
                          type: string
                        description: Slugs installed or updated as dependencies of other packages during this run.
                        example: [form]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/upgrade:
    post:
      operationId: upgradeGrav
      tags: [GPM]
      summary: Self-upgrade Grav core
      description: |
        Upgrade Grav to the latest available version. Requires
        `api.gpm.write`.

        Before installing, the upgrade runs Grav's preflight checks. When
        they block the upgrade (for example enabled plugins not marked
        compatible with the target version), the response is 409 with the
        report; resend with `{"override": true}` to proceed anyway.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                override:
                  type: boolean
                  default: false
                  description: Proceed even when preflight checks block the upgrade.
            example:
              override: true
      responses:
        "200":
          description: Grav upgraded successfully.
          headers:
            X-Invalidates:
              description: Always `grav:update, gpm:update`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [message, previous_version, new_version]
                    properties:
                      message:
                        type: string
                        example: Grav upgraded successfully.
                      previous_version:
                        type: string
                        example: 2.1.0
                      new_version:
                        type: string
                        example: 2.1.1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Preflight checks blocked the upgrade (only when `override` was not
            set). This is a normal JSON body in the `data` envelope, not a
            problem document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status, message, blocking, warnings, incompatible_packages, can_override]
                    properties:
                      status:
                        type: string
                        enum: [preflight_failed]
                      message:
                        type: string
                        example: Upgrade blocked by preflight checks.
                      blocking:
                        type: array
                        description: Reasons the upgrade was blocked.
                        items:
                          type: string
                      warnings:
                        type: array
                        description: Non-blocking warnings from the preflight report.
                        items:
                          type: string
                      incompatible_packages:
                        type: object
                        additionalProperties: true
                        description: Grav's report of installed packages not marked compatible with the target version (includes `target` and the `blocking` packages).
                      can_override:
                        type: boolean
                        description: Always `true`; resend with `override` to proceed.
              example:
                data:
                  status: preflight_failed
                  message: Upgrade blocked by preflight checks.
                  blocking:
                    - Some enabled plugins/themes have not been marked as compatible with Grav 2.2. Disable them before continuing.
                  warnings: []
                  incompatible_packages:
                    target: "2.2"
                  can_override: true
        "422":
          description: Grav is already at the latest version, or Grav core is installed via symlink.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: Grav is already at the latest version.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The upgrade failed (download, PHP requirement, install error).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                title: Upgrade Failed
                detail: Failed to upgrade Grav core.

  /gpm/direct-install:
    post:
      operationId: directInstallPackage
      tags: [GPM]
      summary: Install from URL or file upload
      description: |
        Install a plugin or theme directly from a URL or an uploaded ZIP
        file. This bypasses the GPM repository and allows installing custom
        or development packages. Requires `api.gpm.write`.

        Send either a JSON body with `url`, or a multipart upload with the
        ZIP in `file`; when both are present `url` wins. Dependencies are not
        resolved and the response does not name the installed package.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: An `http://` or `https://` URL pointing to a ZIP archive of the package. Anything else (a server path, a stream such as `backup://`, `file://`) is refused with a 422; upload a local ZIP as `file` instead.
                  example: https://github.com/user/grav-plugin-custom/archive/main.zip
            example:
              url: https://github.com/user/grav-plugin-custom/archive/main.zip
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP archive to install.
      responses:
        "201":
          description: Package installed from direct source.
          headers:
            X-Invalidates:
              description: Always `plugins:list, themes:list, gpm:update`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: Package installed successfully via direct install.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Neither a `url` field nor a successfully uploaded `file` was sent, or `url` is not an `http://`/`https://` address.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: Either a "url" field or an uploaded "file" is required.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Download, extraction or installation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                title: Installation Failed
                detail: Package extraction failed.

  /gpm/search:
    get:
      operationId: searchPackages
      tags: [GPM]
      summary: Search GPM repository
      description: |
        Search across all plugins and themes in the GPM repository by keyword.
        Matches against slug, name, description, author, and keywords
        (case-insensitive substring). Plugins are listed before themes. If
        the repository cannot be reached the result is simply empty. Each
        result carries `installed`.

        Requires `api.gpm.read`.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string.
          schema:
            type: string
          example: email
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Paginated search results across plugins and themes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Package"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/repository/plugins:
    get:
      operationId: browseRepositoryPlugins
      tags: [GPM]
      summary: Browse available plugins
      description: |
        Return a paginated list of plugins available in the GPM repository.
        Includes metadata about each package and whether it is already
        installed. Use the `q` parameter to filter by keyword.

        Requires `api.gpm.read`.
      parameters:
        - name: q
          in: query
          required: false
          description: Filter by keyword (matches slug, name, description, author, keywords).
          schema:
            type: string
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          required: false
          description: Number of items per page. Unlike other lists, values above the configured maximum are honoured up to 2000, so the whole repository can be fetched in one request.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 20
      responses:
        "200":
          description: Paginated list of available plugins.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Package"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/GpmRepositoryUnreachable"

  /gpm/repository/themes:
    get:
      operationId: browseRepositoryThemes
      tags: [GPM]
      summary: Browse available themes
      description: |
        Return a paginated list of themes available in the GPM repository.
        Includes metadata about each theme and whether it is already
        installed. Use the `q` parameter to filter by keyword.

        Requires `api.gpm.read`.
      parameters:
        - name: q
          in: query
          required: false
          description: Filter by keyword (matches slug, name, description, author, keywords).
          schema:
            type: string
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          required: false
          description: Number of items per page. Unlike other lists, values above the configured maximum are honoured up to 2000, so the whole repository can be fetched in one request.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 20
      responses:
        "200":
          description: Paginated list of available themes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Package"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/GpmRepositoryUnreachable"

  /gpm/repository/{slug}:
    get:
      operationId: getRepositoryPackage
      tags: [GPM]
      summary: Get repository package details
      description: |
        Return the repository metadata of a plugin or theme in the GPM
        repository (the same fields as the repository listings, including
        `installed`, premium/licence info and, for themes, the `screenshot`
        URL). README and changelog text are not included.

        Requires `api.gpm.read`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Package slug in the repository.
          schema:
            type: string
          example: admin
      responses:
        "200":
          description: Repository package details returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Package"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/plugins/{slug}/page:
    get:
      operationId: getPluginPage
      tags: [GPM]
      summary: Get plugin admin page definition
      description: |
        Returns the admin page definition for a plugin that registers a custom
        page in the admin sidebar. The response includes the page metadata,
        blueprint reference, data and save endpoints, available actions, and
        whether the plugin provides a custom web component.

        The definition is resolved in this order: the plugin's answer to the
        `onApiPluginPageInfo` event, then `admin-next/pages/{slug}.yaml`, then
        `admin-next/pages/{slug}.js` alone (which yields a minimal
        `component` definition). The server always sets
        `has_custom_component`, and keeps `settings_route` / `settings_page`
        only when they are valid.

        Requires `api.access` only: the data behind the page answers to the
        plugin's own permissions.
      parameters:
        - name: slug
          in: path
          required: true
          description: Plugin slug (e.g. `algolia-pro`, `git-sync`).
          schema:
            type: string
          example: algolia-pro
      responses:
        "200":
          description: Plugin page definition returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginPageDefinition"
              example:
                data:
                  id: algolia-pro
                  plugin: algolia-pro
                  title: Algolia Pro
                  icon: fa-magnifying-glass
                  page_type: blueprint
                  blueprint: algolia-pro
                  data_endpoint: /algolia-pro/data
                  save_endpoint: /algolia-pro/data
                  actions:
                    - id: reindex
                      label: Reindex
                      icon: fa-rotate
                      endpoint: /algolia-pro/reindex
                      confirm: Reindex every enabled Algolia index now?
                    - id: save
                      label: Save
                      icon: fa-check
                      primary: true
                  has_custom_component: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No admin page found for this plugin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not Found
                detail: "No admin page found for plugin 'api'."
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/plugins/{slug}/page-script:
    get:
      operationId: getPluginPageScript
      tags: [GPM]
      summary: Get plugin page web component script
      description: |
        Serves the JavaScript file containing the plugin's page-level web
        component, `admin-next/pages/{slug}.js`. This is used by the admin
        panel to dynamically load plugin-provided custom page UIs. Returns
        `application/javascript` content type, not JSON. The plugin must be
        enabled; a disabled plugin's script is a 404.

        Conditional GET with `ETag` and 304 is supported; `Cache-Control` is `private, no-cache`. Requires `api.access`.
      parameters:
        - $ref: "#/components/parameters/ExtensionScriptPluginSlug"
        - $ref: "#/components/parameters/ExtensionScriptIfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/ExtensionScriptJs"
        "304":
          $ref: "#/components/responses/ExtensionScriptNotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The plugin is not installed, is not enabled, or ships no page script.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not Found
                detail: "Page component not found for plugin 'data-manager'."
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/plugins/{slug}/report-script/{reportId}:
    get:
      operationId: getPluginReportScript
      tags: [GPM]
      summary: Get plugin report web component script
      description: |
        Serves the JavaScript file containing a plugin's report web component.
        Used by the admin panel to dynamically load plugin-provided report UIs
        in the Tools > Reports tab. Returns `application/javascript` content, not JSON.

        Convention: plugins place report scripts at
        `admin-next/reports/{reportId}.js` within their plugin directory. The
        plugin must be enabled; a disabled plugin's script is a 404.

        Conditional GET with `ETag` and 304 is supported; `Cache-Control` is `private, no-cache`. Requires `api.access`.
      parameters:
        - name: slug
          in: path
          required: true
          description: Plugin slug (e.g. `problems`). Must not contain `/`, `\` or be `.`/`..`.
          schema:
            type: string
          example: problems
        - name: reportId
          in: path
          required: true
          description: Report component identifier matching the `component` field from `/reports`. Only the basename is used.
          schema:
            type: string
          example: problems-report
        - $ref: "#/components/parameters/ExtensionScriptIfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/ExtensionScriptJs"
        "304":
          $ref: "#/components/responses/ExtensionScriptNotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The plugin is not installed, is not enabled, or ships no such report script.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not Found
                detail: "Report component 'problems-report' not found for plugin 'problems'."
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/grav/changelog:
    get:
      operationId: getGravChangelog
      tags: [GPM]
      summary: Get the Grav core changelog for pending versions
      description: |
        Returns the Grav core changelog entries for versions newer than the installed `GRAV_VERSION`, assembled from the GPM repository into one Markdown document. Each version gets a `# v{version} ({date})` heading followed by its notes. When the site is already on the latest version, `content` is an empty string.

        Requires `api.gpm.read`. Admin Next uses this for the "What's new" view before a core upgrade.
      parameters:
        - name: flush
          in: query
          description: When `true`, refresh the cached GPM repository data before reading the changelog.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Changelog returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                        description: Markdown changelog covering every version newer than the installed one.
              example:
                data:
                  content: "# v2.1.1 (09/20/2026)\n\n1. [](#bugfix)\n    * Fixed a thing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/plugins/{slug}/fields:
    get:
      operationId: getPluginCustomFieldBundle
      tags: [GPM]
      summary: Get all of a plugin's custom field scripts
      description: |
        Returns every Admin Next custom field web component a plugin ships (`admin-next/fields/*.js`) in one response, as a JSON map of field type to JavaScript source. Admin Next fetches this once per plugin instead of one request per field type.

        The response is NOT wrapped in the usual `data` envelope. A plugin with no fields folder returns an empty collection (serialized as `[]`). The plugin does not have to be enabled.

        Conditional GET is supported: the `ETag` is built from each file's name, mtime and size, and a matching `If-None-Match` returns 304. `Cache-Control` is `private, no-cache`. Requires `api.access`.
      parameters:
        - $ref: "#/components/parameters/ExtensionScriptPluginSlug"
        - $ref: "#/components/parameters/ExtensionScriptIfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/ExtensionScriptFieldBundle"
        "304":
          $ref: "#/components/responses/ExtensionScriptNotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ExtensionScriptNotFound"
        "422":
          $ref: "#/components/responses/ExtensionScriptInvalidSlug"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gpm/themes/{slug}/fields:
    get:
      operationId: getThemeCustomFieldBundle
      tags: [GPM]
      summary: Get all of a theme's custom field scripts
      description: |
        Theme counterpart of `GET /gpm/plugins/{slug}/fields`: returns every Admin Next custom field web component the theme ships (`admin-next/fields/*.js`) as a JSON map of field type to JavaScript source, not wrapped in the `data` envelope. The theme does not have to be active.

        Conditional GET with a stat-based `ETag` and 304 is supported; `Cache-Control` is `private, no-cache`. Requires `api.access`.
      parameters:
        - $ref: "#/components/parameters/ExtensionScriptThemeSlug"
        - $ref: "#/components/parameters/ExtensionScriptIfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/ExtensionScriptFieldBundle"
