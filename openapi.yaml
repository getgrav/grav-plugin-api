        Returns the resolved `user/group_new.yaml` blueprint used by the create-group form. Requires `api.users.read`. Plugins can adjust the fields through the `onApiBlueprintResolved` event (context `group_new`).
      responses:
        "200":
          description: New-group blueprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
