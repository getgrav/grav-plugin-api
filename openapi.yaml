          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Config
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------------
  /data/resolve:
    get:
      operationId: resolveData
      tags: [Data]
      summary: Resolve blueprint data-options@ directives
      description: |
        Resolve a `data-options@` directive from a blueprint field definition.
        The `callable` parameter names a static `Class::method` to call with
        no arguments. Results are suitable for populating select fields and
        other option-based inputs. Requires `api.pages.read` permission.

        The callable must be in `Class::method` form and on core's approved
        dynamic-data provider allowlist (themes and plugins can add their
        own); anything else returns 422. An approved callable whose class or
        method does not exist returns 404, except admin-classic's
        `pagesTypes` / `pagesModularTypes`, which fall back to core's page
        type list. The callable's `key => label` result is converted to a
        list of `{value, label}` options; a non-array result becomes an
        empty list.
      parameters:
        - name: callable
          in: query
          required: true
          description: |
            The callable string from a blueprint `data-options@` directive
            (e.g. `\Grav\Common\Page\Pages::types`). A leading backslash is
            optional.
          schema:
            type: string
          example: '\Grav\Common\Page\Pages::types'
        - name: type
          in: query
          required: false
          description: |
            Page type list to return when the callable is `pageTypes` (or the
            `pagesTypes` / `pagesModularTypes` fallback).
          schema:
            type: string
            enum: [standard, modular]
            default: standard
      responses:
        "200":
          description: Resolved data returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Resolved options, in the order the callable returned them.
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value:
                          type: string
                          description: The option key, cast to a string.
                        label:
                          type: string
                          description: The option label, or the key when the label is not a string.
              example:
                data:
                  - value: default
                    label: Default
                  - value: blog
                    label: Blog
                  - value: item
                    label: Item
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Thumbnails
  # ---------------------------------------------------------------------------
  /thumbnails/{file}:
    get:
      operationId: getThumbnail
      tags: [Thumbnails]
      summary: Serve cached thumbnail
      description: |
        Serve a thumbnail image. This endpoint is public and does not require authentication. The `file` parameter is the hashed filename found in a media item's `thumbnail_url`, a user's `avatar_url` or a theme's `thumbnail`/`screenshot`. Only the last path segment is used, and only names of the form `<32 hex characters>.<jpg|png|gif|webp|avif>` are served.

        Listings hand out these URLs without resizing anything. The first request for a URL generates the thumbnail, from the source image and at the size the listing recorded for that exact filename, and every later request is served from the cache. Nothing else can be generated here: a filename no listing handed out, or one whose source image has changed or gone since (its hash no longer matches), returns 404, and so does a source that can't be decoded.
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: Thumbnail filename (an MD5 hash plus the output extension).
          schema:
            type: string
          example: 3f2a9c1e4b5d6a7f8e9d0c1b2a394857.jpg
      responses:
        "200":
          description: Thumbnail image binary. The `Content-Type` is detected from the cached file.
          headers:
            Cache-Control:
              description: Always `public, max-age=31536000, immutable`; the filename changes when the source image does.
              schema:
                type: string
          content:
            image/avif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Translations
  # ---------------------------------------------------------------------------
  /translations/{lang}:
    get:
      operationId: getTranslations
      tags: [System]
      summary: Get translation strings for a language
      description: |
        Returns all translation strings for the specified language as a flat
        key-value object. Supports optional prefix filtering for partial loads.
        This endpoint does not require authentication.

        Keys the requested language does not translate are filled in from
        English (`en-US`), so the map is complete for any language. The admin
        UI language is not limited to the site's configured content
        languages.

        Supports conditional GET. Every 200 carries `ETag: "<checksum>"`, the
        same value as the body's `checksum`, and `Cache-Control: no-cache,
        private`. Send it back in `If-None-Match` (quoted, unquoted or with a
        `W/` prefix all match) and, while nothing has changed, the answer is an
        empty 304 carrying the same `ETag`. The server checks this against a
        fingerprint of the language files, so a 304 does not rebuild the
        dictionary. A `prefix` request has its own checksum and ETag, for the
        filtered set.
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
          description: |
            Language code (e.g., `en`, `fr`, `pt-BR`). Short codes are
            normalized to their full locale (`en` becomes `en-US`, `fr`
            becomes `fr-FR`); a value that is not a language code falls back
            to the site's default language. The resolved code is echoed back
            in `lang`.
          example: en
        - name: prefix
          in: query
          required: false
          schema:
            type: string
          description: |
            Only return keys that start with this prefix followed by a dot
            (case-insensitive), e.g. `PLUGIN_ADMIN` matches `PLUGIN_ADMIN.*`.
          example: PLUGIN_ADMIN
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` (or `checksum`) from an earlier response. When it still matches, the response is an empty 304.
          schema:
            type: string
          example: '"ca482ce9db905019b7f2be290f018553"'
      responses:
        "200":
          description: Translation strings.
          headers:
            ETag:
              description: The body's `checksum`, quoted.
              schema:
                type: string
              example: '"ca482ce9db905019b7f2be290f018553"'
            Cache-Control:
              description: Always `no-cache, private`, so clients store the response and revalidate it.
              schema:
                type: string
              example: no-cache, private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [lang, dir, count, checksum, strings]
                    properties:
                      lang:
                        type: string
                        description: The resolved locale code.
                        example: en-US
                      dir:
                        type: string
                        enum: [ltr, rtl]
                        description: Text direction of the language.
                        example: ltr
                      count:
                        type: integer
                        description: Number of strings returned.
                        example: 1868
                      checksum:
                        type: string
                        description: MD5 hash of `strings`, for cache invalidation. Also the response's `ETag`.
                        example: ca482ce9db905019b7f2be290f018553
                      strings:
                        type: object
                        additionalProperties:
                          type: string
                        description: Flat key-value map of all translation strings.
                        example:
                          PLUGIN_ADMIN.TITLE: Title
                          PLUGIN_ADMIN.CONTENT: Content
        "304":
          description: The strings have not changed since the ETag sent in `If-None-Match`. No body.
          headers:
            ETag:
              description: The current checksum, quoted.
              schema:
                type: string
              example: '"ca482ce9db905019b7f2be290f018553"'
            Cache-Control:
              schema:
                type: string
              example: no-cache, private

# =============================================================================
# Components
# =============================================================================

  # ---------------------------------------------------------------------------
  # me
  # ---------------------------------------------------------------------------
  /me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get the current user
      description: |
        Return the authenticated user's profile, resolved permission map and demo-mode state (the same `user` object the login endpoints return), plus the Grav and admin plugin versions. Requires `api.access`.
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/AuthUserProfile"
                      - type: object
                        properties:
                          grav_version:
                            type: string
                            example: 2.1.0
                          admin_version:
                            type: string
                            nullable: true
                            description: Version of the enabled `admin2` (or classic `admin`) plugin, or null when neither is enabled.
                            example: 2.1.13
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Site media extras
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # menubar
  # ---------------------------------------------------------------------------
  /menubar/items:
    get:
      operationId: listMenubarItems
      tags: [Menubar]
      summary: List plugin toolbar buttons
      description: |
        Return the toolbar buttons plugins register through the `onApiMenubarItems` event, filtered to those whose `authorize` the current user satisfies. Requires `api.access`.
      responses:
        "200":
          description: Toolbar items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenubarItem"
              example:
                data:
                  - id: warm-cache
                    plugin: warm-cache
                    label: Warm Cache
                    icon: fa-tachometer
                    action: warm
                    confirm: Warm the cache?
                    placement: start
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /menubar/actions/{plugin}/{action}:
    post:
      operationId: executeMenubarAction
      tags: [Menubar]
      summary: Run a toolbar action
      description: |
        Run a plugin's toolbar action through the `onApiMenubarAction` event. When a registered toolbar item matches this plugin and action, the caller must satisfy its `authorize`, or the call returns 403. An action with no matching item only needs `api.access`, and its handler is expected to check permissions itself. A handler that runs and reports a failure still returns 200, with `status: error` in the body; 404 means no plugin handled the action. Requires `api.access`.
      parameters:
        - name: plugin
          in: path
          required: true
          description: Slug of the plugin that owns the action.
          schema:
            type: string
          example: warm-cache
        - name: action
          in: path
          required: true
          description: Action key from the toolbar item.
          schema:
            type: string
          example: warm
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Free-form payload passed to the handler as `body`.
      responses:
        "200":
          description: The handler's result, passed through as returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      status:
                        type: string
                        example: success
                      message:
                        type: string
              example:
                data:
                  status: success
                  message: Cache warmed (42 pages).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Pages: language tools and preview
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # blueprint-upload
  # ---------------------------------------------------------------------------
  /blueprint-upload:
    post:
      operationId: uploadBlueprintFile
      tags: [Media]
      summary: Upload a file for a blueprint file field
      description: |
        Destination-aware upload for blueprint `type: file` fields (a theme logo, a plugin asset, an avatar), mirroring classic admin's `taskFilesUpload`. Requires `api.media.write`.
        The target folder comes from the field's `destination`: a Grav stream (`theme://images`, `user://media`), a `self@:subpath` token resolved against `scope`, or a plain path relative to `user/`. Absolute paths and `..` segments are rejected.
        Every multipart file part is saved (nested file arrays are flattened). Each file is capped at 64 MB, and the field's own `filesize` can only tighten that. Extensions listed in `security.uploads_dangerous_extensions` are refused in any dot-separated part of the name (so `shell.php.jpg` fails), as are config-type extensions (`yaml`, `yml`, `json`, `twig`, `env`, `neon`, `lock`), page content (`md`, `markdown`) and stylesheets (`css`, `scss`, `sass`, `less`). Uploads into `user/accounts/` are restricted to image extensions, and uploads resolving into `user/config/` or `user/env/*/config/` are refused with 403. SVG files are sanitized after saving.
        A developer can allow page content or stylesheets for one field by listing them in that field's blueprint, for example `allow_extensions: [css]`. The server reads this from the blueprint that owns `scope` (a plugin or theme config blueprint, the page template's blueprint, or the account blueprint), never from the request: the request only names the field in `field`, and the upload's `destination` must be that field's own `destination`. `allow_extensions` can only lift `md`, `markdown`, `css`, `scss`, `sass` and `less`; dangerous and config-type extensions, the accounts image-only rule and the config directory block always apply.
        `self@:` against a `users/<username>` scope for another account needs `api.users.write` or super-admin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [destination, file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload. Any field name works, and several file parts may be sent in one request.
                destination:
                  type: string
                  description: The blueprint field's `destination` value.
                  example: theme://images/logo
                scope:
                  type: string
                  description: |
                    Owner of the blueprint, used to resolve `self@:` destinations. One of `plugins/<slug>`, `themes/<slug>`, `pages/<route>`, `users/<username>`.
                  example: themes/quark
                field:
                  type: string
                  description: |
                    Full name of the blueprint field the upload belongs to, as the form knows it (`custom_css`, `header.stylesheet`). Used together with `scope` to look up the field's `allow_extensions` in the blueprint on the server. Without it, or without `scope`, page content and stylesheets are refused.
                  example: custom_css
                random_name:
                  type: boolean
                  description: Replace the file name with a random one (extension kept).
                  default: false
                avoid_overwriting:
                  type: boolean
                  description: Add a suffix instead of replacing an existing file of the same name.
                  default: false
                accept:
                  type: string
                  description: Comma-separated allowlist of extensions (`.pdf`, `*.jpg`) or MIME patterns (`image/*`). May also be sent as an array.
                  example: "image/*,.pdf"
                filesize:
                  type: number
                  description: Per-field maximum size in MB.
                  example: 5
      responses:
        "201":
          description: Files saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlueprintUploadedFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteBlueprintFile
      tags: [Media]
      summary: Delete a file saved by a blueprint file field
      description: |
        Remove a file previously saved through `POST /blueprint-upload`, plus its `.meta.yaml` sidecar when present. Requires `api.media.write`.
        `path` is the logical path the upload returned, relative to the user root (`user/` prefix optional). Absolute input, `..` and null bytes are rejected. Targets in `user/config/` or `user/env/*/config/` are refused with 403. Under `user/accounts/` only image files may be deleted, and without `api.users.write` only the caller's own avatar (403 otherwise). The same extension denylist as the upload applies, so page content (`.md`) and stylesheets can't be deleted here unless `field` and `scope` name a blueprint field that allows them with `allow_extensions` and the file sits in the folder that field's `destination` resolves to.
        The call is idempotent: a file that no longer exists returns 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Logical path of the file, relative to the user root.
                  example: user/themes/quark/images/logo/logo.png
                field:
                  type: string
                  description: Full name of the blueprint field the file belongs to. Only consulted for page content and stylesheets, to look up the field's `allow_extensions` on the server.
                  example: custom_css
                scope:
                  type: string
                  description: Owner of the field's blueprint (`plugins/<slug>`, `themes/<slug>`, `pages/<route>`, `users/<username>`). Required with `field`.
                  example: themes/quark
      responses:
        "204":
          description: File deleted, or it was already gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # blueprint-files
  # ---------------------------------------------------------------------------
  /blueprint-files:
    get:
      operationId: listBlueprintFiles
      tags: [Media]
      summary: List files for a blueprint folder field
      description: |
        Read-only file listing for blueprint fields that declare a `folder:` option (filepicker, mediapicker), mirroring classic admin's `taskGetFilesInFolder`. Requires `api.media.read`.
        `folder` may be a Grav stream (`user://media`, `theme://images`, `account://`), a `self@:subpath` token resolved against `scope`, or a plain path relative to `user/`. A folder that does not exist yet returns an empty list with `meta.exists: false`.
        The page-media literals `@self` / `self@` (with no subpath) are not handled here: the endpoint returns a 422 validation error whose `errors` entry for `folder` carries the message `PAGE_MEDIA_ONLY`, telling the client to use `GET /pages/{route}/media` instead.
        The result uses the paginated envelope but is never actually paginated: every matching file is returned on page 1.
      parameters:
        - name: folder
          in: query
          required: true
          description: Folder to list (stream, `self@:` token, or path relative to `user/`).
          schema:
            type: string
          example: theme://images
        - name: scope
          in: query
          required: false
          description: Blueprint owner used to resolve `self@:` (`plugins/<slug>`, `themes/<slug>`, `pages/<route>`, `users/<username>`).
          schema:
            type: string
          example: themes/quark
        - name: accept
          in: query
          required: false
          description: Comma-separated filter of extensions (`.pdf`, `*.jpg`) or MIME patterns (`image/*`). `*` matches everything.
          schema:
            type: string
          example: "image/*"
      responses:
        "200":
          description: Files in the folder.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaItem"
                      meta:
                        type: object
                        properties:
                          folder:
                            type: string
                            nullable: true
                            description: Logical folder path relative to the user root, when it can be derived.
                            example: themes/quark/images
                          scope:
                            type: string
                            nullable: true
                            example: themes/quark
                          exists:
                            type: boolean
                            description: Whether the resolved folder exists on disk.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Validation failed: missing `folder`, traversal, an unresolvable stream or scope, or a `@self` / `self@` folder (its `errors` entry for `folder` carries `PAGE_MEDIA_ONLY`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Blueprints (groups, accounts config)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # groups
  # ---------------------------------------------------------------------------
  /groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List user groups
      description: |
        Returns a paginated list of user groups sorted by group name. Requires `api.users.read`. Uses the Flex `user-groups` directory when it is registered and falls back to reading `groups` config otherwise.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: search
          in: query
          required: false
          description: Filter groups by text. With Flex this uses the directory's search; without it, a case-insensitive match on group name, readable name and description.
          schema:
            type: string
          example: editors
      responses:
        "200":
          description: Paginated list of groups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a user group
      description: |
        Adds a group to the base `user/config/groups.yaml` (visible in every environment) and clears the standard cache. Requires super-admin (`admin.super`). `enabled` defaults to true and `access` to an empty map. Fires `onApiGroupCreated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [groupname]
                  properties:
                    groupname:
                      type: string
                      pattern: "^[a-zA-Z0-9_-]{1,200}$"
                      description: Group identifier and storage key. Cannot be changed later.
                      example: editors
                - $ref: "#/components/schemas/GroupWriteRequest"
      responses:
        "201":
          description: Group created.
          headers:
            Location:
              description: URL of the new group.
              schema:
                type: string
            X-Invalidates:
              description: Client cache tags to evict.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A group with that name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /groups/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Group name.
        schema:
          type: string
        example: editors
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Get a user group
      description: Returns a single group. Requires `api.users.read`. The response includes an `ETag` for use with `If-Match` on PATCH.
      responses:
        "200":
          description: The group.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateGroup
      tags: [Groups]
      summary: Update a user group
      description: |
        Updates the supplied fields of a group and saves `user/config/groups.yaml`. Requires super-admin (`admin.super`). `access` replaces the whole access map rather than merging into it. Renaming is not supported: `groupname` in the body is ignored. Send the current `ETag` in `If-Match` to detect concurrent edits. Fires `onApiGroupUpdated`.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupWriteRequest"
      responses:
        "200":
          description: Updated group.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Invalidates:
              description: Client cache tags to evict.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a user group
      description: Removes a group from `user/config/groups.yaml`. Requires super-admin (`admin.super`). Accounts that still list the group are not modified. Fires `onApiGroupDeleted`.
      responses:
        "204":
          description: Group deleted.
          headers:
            X-Invalidates:
              description: Client cache tags to evict.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Demo mode
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # demo
  # ---------------------------------------------------------------------------
  /demo/status:
    get:
      operationId: getDemoStatus
      tags: [Demo]
      summary: Get demo reset status
      description: Returns the demo-mode reset state that drives the admin banner and countdown. Any authenticated user may call it; no specific permission is needed.
      responses:
        "200":
          description: Demo status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DemoStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /demo/baseline:
    post:
      operationId: captureDemoBaseline
      tags: [Demo]
      summary: Capture the demo baseline
      description: |
        Snapshots the configured writable demo resources as the baseline that resets restore. Requires super-admin (`admin.super`). Demo accounts are always refused, even when they are super. When no writable resources are configured nothing is captured and `captured` is false (still 200). Fires `onApiDemoBaselineCaptured` on success.
      responses:
        "200":
          description: Capture result.
          headers:
            X-Invalidates:
              description: "`demo:status` when a baseline was captured."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      captured:
                        type: boolean
                      message:
                        type: string
                        example: Demo baseline captured.
                      status:
                        $ref: "#/components/schemas/DemoStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /demo/reset:
    post:
      operationId: resetDemo
      tags: [Demo]
      summary: Reset demo content to the baseline
      description: |
        Restores the demo content from the captured baseline, waiting for any background reset already in progress. Requires super-admin (`admin.super`). Demo accounts are always refused, even when they are super. Without a baseline nothing happens and `reset` is false (still 200). Fires `onApiDemoReset`.
      responses:
        "200":
          description: Reset result.
          headers:
            X-Invalidates:
              description: Always `demo:status`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reset:
                        type: boolean
                      message:
                        type: string
                        example: Demo content reset to baseline.
                      status:
                        $ref: "#/components/schemas/DemoStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # admin
  # ---------------------------------------------------------------------------
  /admin/languages:
    get:
      operationId: listAdminLanguages
      tags: [Languages]
      summary: List admin interface languages
      description: |
        Returns the locales the admin interface itself can be shown in, one per `languages/*.yaml` file shipped by the admin2 plugin (as opposed to `GET /languages`, which lists the site's content languages). Requires `api.system.read`. Sorted by native name; an empty list when admin2 is not installed.
      responses:
        "200":
          description: Admin interface languages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      languages:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: fr
                            name:
                              type: string
                              description: English name, or the code when unknown.
                              example: French
                            native_name:
                              type: string
                              description: Name in the language itself, or the code when unknown.
                              example: Français
                            rtl:
                              type: boolean
                              description: Whether the language is written right to left.
                          required: [code, name, native_name, rtl]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # audit
  # ---------------------------------------------------------------------------
  /audit/status:
    get:
      operationId: getAuditStatus
      tags: [Audit]
      summary: Get audit trail status
      description: |
        Whether the audit trail is available and enabled, with its detail level and retention settings. The admin uses it to decide whether to show the Audit tab. Works even when the trail is disabled.

        Requires super admin (`api.super`); a scoped API key must carry the `admin.super` scope, the same as every other super-only endpoint. Demo accounts are rejected, since the log holds other visitors' IPs and user agents.
      responses:
        "200":
          description: Status returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: True only when `plugins.api.audit.enabled` is on and SQLite is available.
                        example: true
                      available:
                        type: boolean
                        description: Whether the `pdo_sqlite` extension is loaded.
                        example: true
                      coverage:
                        type: string
                        enum: [standard, detailed]
                        description: "`detailed` also stores field-level before/after values for page edits."
                        example: standard
                      retention:
                        type: object
                        properties:
                          days:
                            type: integer
                            description: Entries older than this are pruned; 0 keeps them indefinitely.
                            example: 90
                          max_rows:
                            type: integer
                            description: Hard cap on stored entries; 0 means no cap.
                            example: 100000
                      total:
                        type: integer
                        nullable: true
                        description: Number of stored events. Null when disabled or the count failed.
                        example: 1284
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      summary: List audit events
      description: |
        Paginated audit events, newest first, with optional filters. The trail records API-layer activity, which covers everything done through Admin Next plus API-key clients; classic admin actions that bypass the API are not recorded.

        `per_page` defaults to 50. The pagination `links` carry the active filters along with `page` and `per_page`.

        Requires super admin (`api.super`); a scoped API key needs the `admin.super` scope. Demo accounts are rejected. Returns 404 when the trail is disabled and 503 when SQLite is missing.
      parameters:
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          description: Events per page. Defaults to 50, capped at `plugins.api.pagination.max_per_page` (default 1000).
          schema:
            type: integer
            minimum: 1
            default: 50
        - $ref: "#/components/parameters/AuditFilterEvent"
        - $ref: "#/components/parameters/AuditFilterActor"
        - $ref: "#/components/parameters/AuditFilterTargetType"
        - $ref: "#/components/parameters/AuditFilterSeverity"
        - $ref: "#/components/parameters/AuditFilterFrom"
        - $ref: "#/components/parameters/AuditFilterTo"
        - $ref: "#/components/parameters/AuditFilterQuery"
      responses:
        "200":
          description: Events returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AuditDisabled"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuditUnavailable"

  /audit/facets:
    get:
      operationId: getAuditFacets
      tags: [Audit]
      summary: Get audit filter options
      description: |
        Distinct event codes and actors found in the log, for the filter drop-downs.

        Requires super admin (`api.super`); a scoped API key needs the `admin.super` scope. Demo accounts are rejected. Returns 404 when the trail is disabled and 503 when SQLite is missing.
      responses:
        "200":
          description: Facets returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: string
                        example: [config.update, page.update, user.login, user.login.failed]
                      actors:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              nullable: true
                              example: admin
                            name:
                              type: string
                              nullable: true
                              example: Admin User
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AuditDisabled"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuditUnavailable"

  /audit/export:
    get:
      operationId: exportAuditLog
      tags: [Audit]
      summary: Download the audit log
      description: |
        Downloads every event matching the filters (newest first, capped at 100,000 rows) as an attachment, not wrapped in the JSON envelope. CSV is the default; `format=json` returns a bare JSON array of events. Any other `format` value falls back to CSV.

        CSV columns: `id, ts, event, severity, actor_id, actor_name, actor_roles, auth_method, ip, user_agent, target_type, target_id, status, context`. Array values are JSON-encoded, and cells starting with `=`, `+`, `-`, `@`, tab or CR are prefixed with `'` to stop spreadsheet formula execution.

        Sent with `Cache-Control: no-store`. Requires super admin (`api.super`); a scoped API key needs the `admin.super` scope. Demo accounts are rejected. Returns 404 when the trail is disabled and 503 when SQLite is missing.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - $ref: "#/components/parameters/AuditFilterEvent"
        - $ref: "#/components/parameters/AuditFilterActor"
        - $ref: "#/components/parameters/AuditFilterTargetType"
        - $ref: "#/components/parameters/AuditFilterSeverity"
        - $ref: "#/components/parameters/AuditFilterFrom"
        - $ref: "#/components/parameters/AuditFilterTo"
        - $ref: "#/components/parameters/AuditFilterQuery"
      responses:
        "200":
          description: The log file, as `audit-log.csv` or `audit-log.json`.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"audit-log.csv\"` or `attachment; filename=\"audit-log.json\"`."
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              example: |
                id,ts,event,severity,actor_id,actor_name,actor_roles,auth_method,ip,user_agent,target_type,target_id,status,context
                42,1758441600000,page.update,info,admin,"Admin User","[""admin""]",jwt,127.0.0.1,Mozilla/5.0,page,/blog/my-first-post,,
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AuditDisabled"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuditUnavailable"

  # ---------------------------------------------------------------------------
  # Translations editor (/i18n)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # i18n
  # ---------------------------------------------------------------------------
  /i18n/sources:
    get:
      operationId: listI18nSources
      tags: [Translations Editor]
      summary: List translation sources
      description: |
        Every source (Grav core, plugins, themes, and this site's own overrides) that ships at least one string in the requested language, with the key namespaces it contributes. Drives the editor's browse pane.

        Requires `api.translations.read`.
      parameters:
        - name: lang
          in: query
          required: false
          description: Language to count keys in. Defaults to the editor's default language (the site default if any source ships it, else `en`, else the first available).
          schema:
            type: string
            pattern: "^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,4})?$"
          example: en
      responses:
        "200":
          description: Sources returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lang:
                        type: string
                        example: en
                      providers:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: "`system:core`, `plugin:<slug>`, `theme:<slug>` or `user:overrides`."
                              example: theme:quark
                            kind:
                              type: string
                              enum: [system, plugin, theme, user]
                              example: theme
                            slug:
                              type: string
                              example: quark
                            label:
                              type: string
                              example: Quark
                            enabled:
                              type: boolean
                              description: For plugins, whether the plugin is enabled; for themes, whether it is the active theme; always true for core and site overrides.
                              example: true
                            key_count:
                              type: integer
                              example: 42
                            namespaces:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    example: THEME_QUARK
                                  key_count:
                                    type: integer
                                    example: 42
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /i18n/languages:
    get:
      operationId: listI18nLanguages
      tags: [Translations Editor]
      summary: List translation languages
      description: |
        Every language code that any source ships, flagged with whether this site has an override file for it, plus the editor's default language.

        Requires `api.translations.read`.
      responses:
        "200":
          description: Languages returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      default:
                        type: string
                        example: en
                      languages:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: fr
                            has_overrides:
                              type: boolean
                              example: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /i18n/coverage:
    get:
      operationId: getI18nCoverage
      tags: [Translations Editor]
      summary: Get translation coverage per language
      description: |
        For every language, how many of the source language's keys it has (shipped or overridden) and how many are missing. Measured against the source language's key set only, so stale keys that exist only in an old translation do not count.

        Requires `api.translations.read`.
      parameters:
        - $ref: "#/components/parameters/I18nSourceLang"
      responses:
        "200":
          description: Coverage returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      source_lang:
                        type: string
                        example: en
                      coverage:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: fr
                            total:
                              type: integer
                              description: Number of keys in the source language.
                              example: 1868
                            translated:
                              type: integer
                              example: 1702
                            missing:
                              type: integer
                              example: 166
                            overridden:
                              type: integer
                              description: Number of site overrides in this language (any key, not only source keys).
                              example: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /i18n/keys:
    get:
      operationId: listI18nKeys
      tags: [Translations Editor]
      summary: List translation keys
      description: |
        The editor matrix: one row per key, sorted by key, with the source-language value and a cell per requested language. Keys that only exist as site overrides (typos, strings from removed plugins) are included so they can be fixed.

        `q` matches both the key and the source-language value, case-insensitively. `status` is applied to the composed row: a row matches when any requested language's cell has that state; `unknown` matches keys no source ships.

        `per_page` is capped at 500. Requires `api.translations.read`.
      parameters:
        - $ref: "#/components/parameters/I18nSourceLang"
        - name: langs
          in: query
          required: false
          description: Comma-separated language codes to include as cells. Codes no source ships are ignored; defaults to the source language alone.
          schema:
            type: string
          example: en,fr,de
        - name: q
          in: query
          required: false
          description: Search text, matched against the key and the source value.
          schema:
            type: string
          example: search
        - name: provider
          in: query
          required: false
          description: Limit to keys shipped by one source id (see `GET /i18n/sources`).
          schema:
            type: string
          example: theme:quark
        - name: namespace
          in: query
          required: false
          description: Limit to keys equal to or under this dotted prefix.
          schema:
            type: string
          example: PLUGIN_ADMIN
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, shipped, overridden, missing, unknown]
            default: all
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          description: Rows per page. Capped at 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
      responses:
        "200":
          description: Rows returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/I18nKeyRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /i18n/keys/{key}:
    get:
      operationId: getI18nKey
      tags: [Translations Editor]
      summary: Get one translation key
      description: |
        One key across every language any source ships. An unknown key still returns 200, with `known: false` and `missing` cells.

        Requires `api.translations.read`.
      parameters:
        - name: key
          in: path
          required: true
          description: Dotted translation key. Only letters, digits, `_`, `.` and `-` are routed; anything else is a 404.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_.\\-]+$"
          example: PLUGIN_ADMIN.TITLE
        - $ref: "#/components/parameters/I18nSourceLang"
      responses:
        "200":
          description: Key returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/I18nKeyRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /i18n/overrides/{lang}:
    get:
      operationId: getI18nOverrides
      tags: [Translations Editor]
      summary: Get a language's override file as YAML
      description: |
        The site's override file for one language (`user/languages/<lang>.yaml`), for the advanced YAML editor. Without `namespace` this is the raw file text (empty string when no file exists). With `namespace`, only overrides under that prefix are returned, re-dumped as nested YAML, so "edit as YAML" covers only what is on screen.

        Requires `api.translations.read`. An invalid language code returns 422, as it does for PATCH and PUT.
      parameters:
        - $ref: "#/components/parameters/I18nOverrideLang"
        - name: namespace
          in: query
          required: false
          description: Dotted key prefix to limit the output to.
          schema:
            type: string
          example: THEME_QUARK
      responses:
        "200":
          description: Overrides returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lang:
                        type: string
                        example: fr
                      scoped:
                        type: boolean
                        description: True when `namespace` was given.
                        example: true
                      namespace:
                        type: string
                        nullable: true
                        example: THEME_QUARK
                      count:
                        type: integer
                        description: Number of overrides included.
                        example: 2
                      yaml:
                        type: string
                        example: "THEME_QUARK:\n  SEARCH: Rechercher\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: patchI18nOverrides
      tags: [Translations Editor]
      summary: Set or remove individual overrides
      description: |
        Inline edits to one language's override file. `set` writes values; `unset` removes overrides so the shipped value shows again. A `set` whose value equals what the source ships is stored as a removal instead (reported in `reverted`), so the file only holds real differences. Keys no source ships are still written and reported in `unknown`.

        The response includes a fresh matrix row for every touched key, with a cell for this language only. Sends `X-Invalidates: i18n:update, translations:update`.

        Requires `api.translations.write`; demo accounts are rejected.
      parameters:
        - $ref: "#/components/parameters/I18nOverrideLang"
        - $ref: "#/components/parameters/I18nSourceLang"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of `set` or `unset` must be non-empty.
              properties:
                set:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of dotted key to new value. A JSON array is rejected with 422; numeric keys inside an object are ignored.
                  example:
                    THEME_QUARK.SEARCH: Rechercher
                unset:
                  type: array
                  items:
                    type: string
                  description: Keys whose override should be removed. Non-string entries are ignored.
                  example: [PLUGIN_ADMIN.TITLE]
      responses:
        "200":
          description: Overrides saved.
          headers:
            X-Invalidates:
              $ref: "#/components/headers/I18nInvalidates"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      written:
                        type: object
                        additionalProperties:
                          type: string
                        description: Keys stored as overrides, with their values.
                      removed:
                        type: array
                        items:
                          type: string
                        description: Keys whose existing override was deleted.
                      reverted:
                        type: array
                        items:
                          type: string
                        description: Keys in `set` that matched the shipped value and so were not stored.
                      unknown:
                        type: array
                        items:
                          type: string
                        description: Keys in `set` that no source ships.
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/I18nKeyRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: replaceI18nOverrides
      tags: [Translations Editor]
      summary: Replace a language's overrides from YAML
      description: |
        Advanced-mode save. Parses `yaml` (a mapping, nested or dotted) and replaces the language's overrides with it. With `namespace`, only overrides under that prefix are replaced and everything else in the file is kept; a key outside the namespace fails the whole save with 422, and the error names the out-of-scope keys (up to five). Empty `yaml` deletes every override in scope.

        Values equal to the shipped value are dropped (`dropped`); keys no source ships are saved but reported (`unknown`) rather than rejected. Sends `X-Invalidates: i18n:update, translations:update`.

        Requires `api.translations.write`; demo accounts are rejected.
      parameters:
        - $ref: "#/components/parameters/I18nOverrideLang"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml:
                  type: string
                  description: YAML mapping of keys to strings. A YAML list is rejected.
                  example: "THEME_QUARK:\n  SEARCH: Rechercher\n"
                namespace:
                  type: string
                  description: Dotted key prefix to limit the replacement to. Omit or send an empty string to replace the whole file.
                  example: THEME_QUARK
      responses:
        "200":
          description: Overrides saved.
          headers:
            X-Invalidates:
              $ref: "#/components/headers/I18nInvalidates"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Number of overrides now stored from this YAML.
                        example: 1
                      dropped:
                        type: array
                        items:
                          type: string
                        description: Keys dropped because they matched the shipped value.
                      unknown:
                        type: array
                        items:
                          type: string
                        description: Keys saved that no source ships.
                      removed:
                        type: integer
                        description: How many fewer in-scope overrides exist than before.
                        example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /i18n/translate:
    get:
      operationId: getI18nTranslateStatus
      tags: [Translations Editor]
      summary: Check whether machine translation is available
      description: |
        Whether the AI Translate plugin can propose translations, and if not, why: it is not installed, not enabled, or has no configured provider. The editor hides its translate actions when unavailable.

        Requires `api.translations.read`.
      responses:
        "200":
          description: Status returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                        example: false
                      installed:
                        type: boolean
                        example: true
                      enabled:
                        type: boolean
                        example: true
                      reason:
                        type: string
                        nullable: true
                        enum: [not_installed, not_enabled, not_configured, null]
                        example: not_configured
                      max_keys:
                        type: integer
                        description: Maximum keys accepted by one `POST /i18n/translate`.
                        example: 200
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: translateI18nKeys
      tags: [Translations Editor]
      summary: Propose machine translations
      description: |
        Sends up to 200 keys' source values to the AI Translate plugin and returns proposals. Nothing is written; the caller reviews the proposals and saves them with `PATCH /i18n/overrides/{lang}`.

        Placeholders are masked before sending and checked afterwards; a proposal whose placeholders came back altered is refused (`placeholders_mangled`). ICU strings that need a human, keys with no source value, and strings with nothing translatable are skipped without calling the provider. Proposals come back in the order the keys were sent.

        Requires `api.translations.write` (it spends provider credits); demo accounts are rejected. Returns 422 when machine translation is unavailable or the provider call fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_lang, keys]
              properties:
                source_lang:
                  type: string
                  description: Defaults to the editor's default language. Must differ from `target_lang`.
                  example: en
                target_lang:
                  type: string
                  example: fr
                keys:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                  description: Keys to translate. Non-string entries are ignored.
                  example: [THEME_QUARK.SEARCH, PLUGIN_ADMIN.TITLE]
      responses:
        "200":
          description: Proposals returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      source_lang:
                        type: string
                        example: en
                      target_lang:
                        type: string
                        example: fr
                      proposals:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              example: THEME_QUARK.SEARCH
                            source:
                              type: string
                              nullable: true
                              example: Search
                            value:
                              type: string
                              nullable: true
                              description: Proposed translation, or null when refused or skipped.
                              example: Rechercher
                            ok:
                              type: boolean
                              example: true
                            reason:
                              type: string
                              nullable: true
                              enum: [no_source, icu_needs_human, nothing_to_translate, provider_returned_nothing, placeholders_mangled, null]
                              example: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /i18n/import/translation-strings:
    get:
      operationId: getI18nImportStatus
      tags: [Translations Editor]
      summary: Preview an import from the translation-strings plugin
      description: |
        What the old translation-strings plugin has configured and what importing it would do, per language. Counts are exact; `keys` lists at most 50 keys per language. Read-only.

        Requires `api.translations.read`. Returns 422 when the plugin's config holds a language code the editor cannot store.
      responses:
        "200":
          description: Import preview returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      present:
                        type: boolean
                        description: True when the plugin has at least one override configured.
                        example: true
                      plugin_enabled:
                        type: boolean
                        description: While enabled, the plugin's values still win over `user/languages`.
                        example: true
                      config_path:
                        type: string
                        description: Absolute path of the plugin's config file. Demo accounts get `(hidden in demo mode)` instead.
                        example: /var/www/grav/user/config/plugins/translation-strings.yaml
                      pending:
                        type: integer
                        description: Keys an import would write (`new` plus `conflict`).
                        example: 4
                      total:
                        type: integer
                        example: 6
                      languages:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: fr
                            total:
                              type: integer
                              example: 6
                            new:
                              type: integer
                              example: 3
                            already:
                              type: integer
                              description: Already overridden with the same value.
                              example: 1
                            conflict:
                              type: integer
                              description: Overridden with a different value; importing replaces it with the plugin's value.
                              example: 1
                            shipped:
                              type: integer
                              description: Same as the shipped value, so importing stores nothing.
                              example: 1
                            unknown:
                              type: integer
                              example: 0
                            keys:
                              type: array
                              maxItems: 50
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                    example: THEME_QUARK.SEARCH
                                  status:
                                    type: string
                                    enum: [new, already, conflict, shipped]
                                  unknown:
                                    type: boolean
                                  current:
                                    type: string
                                    nullable: true
                                    description: The site's existing override, if any.
                                  value:
                                    type: string
                                    description: The plugin's value.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: importI18nTranslationStrings
      tags: [Translations Editor]
      summary: Import overrides from the translation-strings plugin
      description: |
        Merges every override configured in the translation-strings plugin into `user/languages/<lang>.yaml`. Existing overrides for other keys are kept; where both name the same key, the plugin's value wins because that is what the site shows today.

        The plugin is not disabled; the client does that afterwards through the config endpoint. `plugin_enabled` reports its current state. Sends `X-Invalidates: translations:update`.

        Requires `api.translations.write`; demo accounts are rejected. Returns 422 when the plugin has nothing configured, or when its config holds a language code the editor cannot store (checked before anything is written).
      responses:
        "200":
          description: Import completed.
          headers:
            X-Invalidates:
              description: Client cache tags to refresh.
              schema:
                type: string
              example: translations:update
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
                        description: Overrides written, across all languages.
                        example: 4
                      reverted:
                        type: integer
                        description: Values skipped because they matched the shipped value.
                        example: 1
                      unknown:
                        type: array
                        items:
                          type: string
                        description: Imported keys that no source ships.
                      languages:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: fr
                            written:
                              type: integer
                              example: 4
                            reverted:
                              type: integer
                              example: 1
                            unknown:
                              type: integer
                              example: 0
                            path:
                              type: string
                              description: Absolute path of the override file written.
                              example: /var/www/grav/user/languages/fr.yaml
                      plugin_enabled:
                        type: boolean
                        example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # admin-next
  # ---------------------------------------------------------------------------
  /admin-next/boot:
    get:
      operationId: getAdminNextBoot
      tags: [Admin Next]
      summary: Everything Admin Next loads at startup, in one request
      description: |
        Returns, in one response, what Admin Next otherwise fetches with nine requests when it starts. Each member of `data` is exactly the `data` of its own endpoint, produced by the same code with the same permission check:

        | Part | Same as |
        | --- | --- |
        | `preferences` | `GET /admin-next/preferences` |
        | `me` | `GET /me` |
        | `menubar` | `GET /menubar/items` |
        | `sidebar` | `GET /sidebar/items` |
        | `floating_widgets` | `GET /floating-widgets` |
        | `context_panels` | `GET /context-panels` |
        | `custom_fields` | `GET /custom-fields` |
        | `languages` | `GET /languages` |
        | `translations` | the `lang` and `checksum` of `GET /translations/{lang}` (the checksum is the ETag that endpoint sends), without the strings |

        A part the caller may not read, or one that fails, is left out of `data` and reported under the same key in `errors` with the status and title its own endpoint would have answered with (for example `languages` needs `api.pages.read`). One failing part never fails the response. `errors` is always present, as an empty object when every part succeeded.

        The translations checksum is for `?lang=` when given, otherwise the caller's admin language (`preferences.effective.adminLanguage`), resolved exactly as `/translations/{lang}` resolves its path parameter: a malformed code falls back to the site default, and short codes are expanded (`en` becomes `en-US`). A client that already holds that dictionary with the same checksum can skip `/translations` entirely; otherwise it fetches `/translations/{lang}` as before.

        Requires `api.access`.
      parameters:
        - name: lang
          in: query
          required: false
          description: Admin UI language to report the translations checksum for.
          schema:
            type: string
          example: fr
      responses:
        "200":
          description: Boot payload returned. Parts that failed are listed in `errors`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNextBoot"
              example:
                data:
                  preferences:
                    effective:
                      adminLanguage: en
                  me:
                    username: admin
                    super_admin: true
                    access:
                      api.super: true
                  menubar: []
                  sidebar: []
                  floating_widgets: []
                  context_panels: []
                  custom_fields: {}
                  translations:
                    lang: en-US
                    checksum: 05e89a7f31f11d80a4860d431c6f0c7b
                errors:
                  languages:
                    status: 403
                    title: Forbidden
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin-next/preferences:
    get:
      operationId: getAdminNextPreferences
      tags: [Admin Next]
      summary: Get resolved Admin Next preferences
      description: |
        Returns the full preferences payload Admin Next reads once on boot: site branding (with ready-to-use logo URLs), site defaults, site-only behavioral settings, media upload constraints, the current user's saved overrides, and the `effective` map that merges them all.

        Resolution order for user-overridable keys is built-in defaults, then site defaults (`ui.defaults`), then the user's overrides (`admin_next.preferences` in the account YAML). If the user has not picked an admin language, a classic-admin `language:` value on the account is honored. Site-only settings (`ui.settings`) are applied last and cannot be overridden per user.

        Requires `api.access`. The response carries an `ETag` header computed from the body (conditional GETs are not answered with 304).
      responses:
        "200":
          description: Resolved preferences returned.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreferencesPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin-next/preferences/user:
    patch:
      operationId: updateAdminNextUserPreferences
      tags: [Admin Next]
      summary: Update the current user's preference overrides
      description: |
        Patches the calling user's overrides, stored under `admin_next.preferences` in their account YAML. Only the user-overridable keys (see `PreferencesValues`) are accepted; site-only keys such as `autoSaveEnabled` or `menubarLinks` are ignored here.

        Keys not present in the body are left alone. A key set to `null` removes that override so the site default applies again. Values that fail validation (unknown enum value, wrong type) are silently dropped rather than rejected; numeric values are clamped to their allowed range.

        Requires `api.access`. Demo accounts are refused. Returns the full resolved payload, the same as `GET /admin-next/preferences`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesValues"
            example:
              colorMode: dark
              accentHue: 200
              fontSize: null
      responses:
        "200":
          description: Overrides saved; resolved preferences returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreferencesPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: resetAdminNextUserPreferences
      tags: [Admin Next]
      summary: Reset the current user's preferences to site defaults
      description: |
        Removes every override the calling user has saved (the whole `admin_next.preferences` block), backing the "Reset to site defaults" action in Admin Next. Dashboard layout (`admin_next.dashboard`) is not touched.

        Requires `api.access`. Demo accounts are refused. Returns the full resolved payload.
      responses:
        "200":
          description: Overrides cleared; resolved preferences returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreferencesPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin-next/preferences/site:
    patch:
      operationId: updateAdminNextSitePreferences
      tags: [Admin Next]
      summary: Update site-wide preference defaults and settings
      description: |
        Writes site-level preferences to `user/config/admin-next.yaml`. The flat body is split in two:

        User-overridable keys (`PreferencesValues`) are merged into `ui.defaults`, so only the keys sent change. Send `null` for a key to remove the saved default so it falls back to the built-in value. Invalid values are dropped.

        Site-only keys (`PreferencesSiteSettings`: auto-save, collaboration, menubar links) are merged into `ui.settings`, so only the keys sent change.

        Any other key is ignored. Requires super-admin (`admin.super`, subject to the API-key scope cap). Demo accounts are refused. Returns the full resolved payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PreferencesValues"
                - $ref: "#/components/schemas/PreferencesSiteSettings"
            example:
              colorMode: ""
              accentHue: 271
              fontFamily: inter
              autoSaveEnabled: true
              menubarLinks:
                - label: Docs
                  url: https://learn.getgrav.org
                  icon: book
                  external: true
      responses:
        "200":
          description: Site preferences saved; resolved preferences returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreferencesPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin-next/branding:
    patch:
      operationId: updateAdminNextBranding
      tags: [Admin Next]
      summary: Update site branding
      description: |
        Updates the site branding block (`ui.branding` in `user/config/admin-next.yaml`): logo mode, logo text, logo height, sign-in title/subtitle, and the "Powered by Grav" toggle. The body is merged over the current branding, so you can send just the fields you want to change. Every field is normalized (unknown modes fall back to `default`, text is trimmed and truncated, `logoHeight` is clamped to 16-44 or 0).

        Logo and favicon files are managed with `POST`/`DELETE /admin-next/branding/logo`; the `logoLight`, `logoDark` and `favicon` fields here accept only a basename inside `user/media/admin-next/`.

        Requires super-admin (`admin.super`, subject to the API-key scope cap). Demo accounts are refused. Returns the full resolved payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingSettings"
            example:
              mode: text
              text: Acme CMS
              title: Acme Content Admin
              showPoweredBy: false
      responses:
        "200":
          description: Branding saved; resolved preferences returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreferencesPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin-next/branding/logo:
    post:
      operationId: uploadAdminNextBrandingLogo
      tags: [Admin Next]
      summary: Upload a logo or favicon
      description: |
        Uploads a light logo, dark logo, or favicon to `user/media/admin-next/` and records it in the site branding. The file type is determined from the file contents, never the client-declared MIME type: PNG, JPEG, WebP and ICO are accepted as raster images; anything else must parse as an SVG document and is sanitized (script and foreignObject elements, `on*` attributes, and `javascript:`/`data:` URIs are removed). Maximum size is 4 MB.

        The stored file is named `logo-{variant}-{hash}.{ext}` (or `favicon-favicon-{hash}.{ext}`), and the previous file for that variant is deleted. Uploading a light or dark logo switches the branding mode to `custom` unless it is currently `text`.

        Requires super-admin (`admin.super`, subject to the API-key scope cap). Demo accounts are refused.
      parameters:
        - $ref: "#/components/parameters/BrandingLogoVariant"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file. The field may also be named `logo`.
                variant:
                  type: string
                  enum: [light, dark, favicon]
                  description: Alternative to the `variant` query parameter; the query parameter wins when both are sent.
              required: [file]
      responses:
        "201":
          description: Logo stored; resolved preferences returned (see `branding_urls` for the new file's URL).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreferencesPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Missing or invalid `variant`, no file uploaded, file larger than 4 MB, or content that is neither a supported raster image nor a valid SVG.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: Logo must be a valid SVG image.
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteAdminNextBrandingLogo
      tags: [Admin Next]
      summary: Delete a logo or favicon
      description: |
        Deletes the stored file for one branding variant and clears its path in the site branding. If both logo variants end up empty while the mode is `custom`, the mode reverts to `default` so Admin Next shows the built-in Grav logo. Succeeds even when no file was set for the variant.

        Requires super-admin (`admin.super`, subject to the API-key scope cap). Demo accounts are refused. Returns the full resolved payload.
      parameters:
        - $ref: "#/components/parameters/BrandingLogoVariant"
      responses:
        "200":
          description: Variant cleared; resolved preferences returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreferencesPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Missing or invalid `variant`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: "Query parameter 'variant' must be 'light', 'dark', or 'favicon'."
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Dashboard: widgets, layouts, security probe
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # custom-fields
  # ---------------------------------------------------------------------------
  /custom-fields:
    get:
      operationId: getCustomFieldRegistry
      tags: [UI Extensions]
      summary: List custom field types provided by plugins and themes
      description: |
        Returns a map of custom blueprint field type to the package that provides its Admin Next web component, so Admin Next can fill its field registry at startup. Enabled plugins and all installed themes are scanned for `admin-next/fields/*.js`. When two packages ship the same type, the later one wins (themes are scanned after plugins).

        Use `kind` and `slug` to build the script URL: `/gpm/{kind}/{slug}/field/{type}` or the bundle at `/gpm/{kind}/{slug}/fields`. When nothing is registered the map is serialized as an empty array (`[]`).

        Requires `api.access`, the same as the field scripts it points to: Admin Next loads it at startup for every account, including editors who cannot manage packages.
      responses:
        "200":
          description: Field registry returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/CustomFieldProvider"
              example:
                data:
                  seo-magic-preview:
                    slug: seo-magic
                    kind: plugins
                  color-swatch:
                    slug: quark
                    kind: themes
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # editor
  # ---------------------------------------------------------------------------
  /editor/toolbar-buttons:
    get:
      operationId: getEditorToolbarButtons
      tags: [UI Extensions]
      summary: List markdown editor toolbar buttons contributed by plugins
      description: |
        Collects buttons that plugins add to the Admin Next default (CodeMirror) markdown editor toolbar through the `onApiMarkdownEditorButtons` event. Buttons whose `authorize` permission the user lacks are removed, and the `authorize` field itself is stripped from the output. Buttons without `authorize` are visible to every authenticated user. The list is returned in event order.

        Requires `api.access`.
      responses:
        "200":
          description: Toolbar buttons returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EditorToolbarButton"
              example:
                data:
                  - id: youtube
                    plugin: youtube
                    label: YouTube Video
                    icon: "<svg viewBox=\"0 0 24 24\">...</svg>"
                    modal:
                      component: youtube-insert
                      title: Insert YouTube Video
                      size: md
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # floating-widgets
  # ---------------------------------------------------------------------------
  /floating-widgets:
    get:
      operationId: getFloatingWidgets
      tags: [UI Extensions]
      summary: List floating widgets contributed by plugins
      description: |
        Collects persistent floating widgets (chat assistants, notification panels and the like) that plugins register for the Admin Next shell through the `onApiFloatingWidgets` event. Widgets whose `authorize` permission the user lacks are removed and `authorize` is stripped. `routes` is normalized to a de-duplicated list of leading-slash paths and dropped when empty. The list is returned in event order.

        The widget's web component is loaded from `GET /gpm/plugins/{plugin}/widget-script`. Requires `api.access`.
      responses:
        "200":
          description: Floating widgets returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FloatingWidget"
              example:
                data:
                  - id: ai-pro-chat
                    plugin: ai-pro
                    label: AI Assistant
                    icon: bot
                    priority: 10
                    autoLoad: true
                    routes: [/pages]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # context-panels
  # ---------------------------------------------------------------------------
  /context-panels:
    get:
      operationId: getContextPanels
      tags: [UI Extensions]
      summary: List page-editor context panels contributed by plugins
      description: |
        Collects slide-in panels that plugins register for the Admin Next page editor through the `onApiContextPanels` event. Each panel adds a trigger button to the editor toolbar in the listed `contexts`, and its web component is loaded from `GET /gpm/plugins/{plugin}/panel-script`.

        A panel may declare `authorize` (a permission string, or an array where any one grants access); panels the caller doesn't pass are left out, and `authorize` is stripped from the response. The list is sorted by `priority`, highest first, keeping registration order among equal priorities. Requires `api.access`.
      responses:
        "200":
          description: Context panels returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContextPanel"
              example:
                data:
                  - id: revisions-pro
                    plugin: revisions-pro
                    label: Revision History
                    icon: history
                    contexts: [pages]
                    priority: 10
                    width: 900
                    badgeEndpoint: /revisions-pro/badge
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # settings
  # ---------------------------------------------------------------------------
  /settings/panels:
    get:
      operationId: getSettingsPanels
      tags: [UI Extensions]
      summary: List Settings page panels contributed by plugins
      description: |
        Collects blueprint-driven panels that plugins register through the `onApiAdminSettingsPanels` event. Admin Next renders them as sections inside its Settings page instead of as separate sidebar entries. Panels are sorted by `priority`, highest first. No permission filtering happens here; the registering plugin decides, using the `user` passed in the event, whether to add a panel.

        Requires `api.access`.
      responses:
        "200":
          description: Settings panels returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SettingsPanel"
              example:
                data:
                  - id: login-settings
                    plugin: api
                    label: Login & Security
                    description: Authentication, sessions and 2FA
                    icon: fa-shield-alt
                    blueprint: login-settings
                    data_endpoint: /login-settings/data
                    save_endpoint: /login-settings/save
                    priority: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Users: invitations
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # invitations
  # ---------------------------------------------------------------------------
  /invitations:
    get:
      operationId: listInvitations
      tags: [Users]
      summary: List pending invitations
      description: |
        Returns all pending user invitations, most recent first. Expired invitations are purged from the store before listing. The pre-set `access` map is not included, but each entry carries its `token`, which is the credential the invitee uses to accept.

        Requires `api.users.write`, like creating, resending and revoking: the token alone accepts the invite, so read-only users cannot list them.
      responses:
        "200":
          description: Invitations returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitations:
                        type: array
                        items:
                          $ref: "#/components/schemas/Invitation"
              example:
                data:
                  invitations:
                    - token: 9c1f0e6b2a7d4c8e5f3a1b9d0c7e2f4a
                      email: jane@example.com
                      fullname: Jane Doe
                      groups: [editors]
                      created: 1790000000
                      created_by: admin
                      created_by_name: Site Admin
                      expires: 1790604800
                      expired: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createInvitation
      tags: [Users]
      summary: Invite a new user
      description: |
        Creates a time-limited invitation for a new account with pre-set permissions and groups, and emails the invite link when the Email plugin is configured. The recipient accepts through the public `/auth/invite/{token}` endpoints and picks their own username and password; the account gets exactly the access set here.

        Super flags (`admin.super`, `api.super`, and scalar `admin`/`api` grants) are stripped from `access`, and `groups` is ignored, unless the caller is a super-admin within their API-key scope. Any earlier pending invite for the same email is replaced.

        If email is not configured or sending fails, the invite is still created and the response includes `link` and a `warning` so the admin can share it manually. The link host is taken from `admin_base_url`, the Referer or the Origin header only when that origin is the site's own or listed in the API's CORS origins.

        Requires `api.users.write`. Demo accounts are refused. The response sets `X-Invalidates: invitations:list`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
            example:
              email: jane@example.com
              fullname: Jane Doe
              access:
                api:
                  access: true
                  pages:
                    read: true
                    write: true
              groups: [editors]
              expiration: 604800
              message: Welcome aboard!
              admin_base_url: https://example.com/admin
      responses:
        "201":
          description: Invitation created.
          headers:
            Location:
              description: Points at `/auth/invite/{token}`, the public endpoint that validates the new invitation.
              schema:
                type: string
            X-Invalidates:
              description: Client cache tags to evict (`invitations:list`).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InvitationCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A user with that email already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Conflict
                detail: A user with that email already exists.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /invitations/{token}:
    delete:
      operationId: deleteInvitation
      tags: [Users]
      summary: Revoke an invitation
      description: |
        Deletes a pending invitation so its link no longer works. Requires `api.users.write`. Demo accounts are refused. The response sets `X-Invalidates: invitations:list`.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "204":
          description: Invitation revoked.
          headers:
            X-Invalidates:
              description: Client cache tags to evict (`invitations:list`).
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No invitation with that token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not Found
                detail: Invitation not found.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /invitations/{token}/resend:
    post:
      operationId: resendInvitation
      tags: [Users]
      summary: Resend an invitation email
      description: |
        Sends the invitation email again for a pending, unexpired invite. The token and expiry are unchanged. Unlike `POST /invitations`, this fails with 422 when email is not configured. The link host follows the same allowlist rules as invitation creation.

        Requires `api.users.write`. Demo accounts are refused.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Optional personal note included in the email.
                admin_base_url:
                  type: string
                  format: uri
                  description: Admin Next base URL used to build the link; accepted only for the site's own origin or a configured CORS origin.
      responses:
        "200":
          description: Email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InvitationCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No pending invitation with that token, or it has expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not Found
                detail: Invitation not found or expired.
        "422":
          description: Email is not configured on this site.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 422
                title: Unprocessable Entity
                detail: Email is not configured. Share the invite link manually.
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: |
        Recommended transport for JWT access tokens obtained from `POST /auth/token`.
        Uses a custom header so the token survives FastCGI / PHP-FPM / CGI environments
        (MAMP, shared hosts) that strip the standard `Authorization` header before it
        reaches PHP. Accepts either a bare JWT or the `Bearer <jwt>` form.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Alternative transport for JWT access tokens — standard HTTP Bearer semantics.
        Works on most hosts but may be stripped by some FastCGI / CGI setups; prefer
        `X-API-Token` when portability across hosts matters.

    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key generated via `POST /users/{username}/api-keys`.

    sessionAuth:
      type: apiKey
      in: cookie
      name: grav-site
      description: Session cookie set by the Grav admin panel login.

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------
  parameters:
    page:
      name: page
      in: query
      description: Page number for pagination (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1

    per_page:
      name: per_page
      in: query
      description: Number of items per page. Capped at `pagination.max_per_page` in the plugin config (default 1000); values below 1 count as 1.
      schema:
        type: integer
        minimum: 1
        default: 20

    pageRoute:
      name: route
      in: path
      required: true
      description: |
        The page route without leading slash (e.g. `blog/my-post`). Supports
        nested routes with `/` separators.
      schema:
        type: string
      example: blog/my-first-post

    mediaFilename:
      name: filename
      in: path
      required: true
      description: Name of the media file.
      schema:
        type: string
      example: hero-image.jpg

    mediaMetaPath:
      name: path
      in: query
      required: true
      description: |
        Path of the site media file relative to the media root
        (e.g. `photos/beach.jpg`).
      schema:
        type: string
      example: photos/beach.jpg

    configScope:
      name: scope
      in: path
      required: true
      description: |
        Configuration scope. One of: `system`, `site`, `media`, `security`,
        `scheduler`, `backups`, `plugins/{name}`, `themes/{name}`, or the
        name of a site-authored `user/config/<name>.yaml` file. The slash in
        `plugins/{name}` and `themes/{name}` is sent unencoded.
      schema:
        type: string
      examples:
        system:
          value: system
          summary: System configuration
        site:
          value: site
          summary: Site configuration
        plugin:
          value: plugins/api
          summary: Plugin configuration
        theme:
          value: themes/quark
          summary: Theme configuration

    username:
      name: username
      in: path
      required: true
      description: The username of the user account.
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{3,64}$"
      example: admin

    ifMatch:
      name: If-Match
      in: header
      required: false
      description: |
        ETag value from the most recent GET response. When provided, the
        server returns `409 Conflict` if the resource has changed since
        the ETag was generated.
      schema:
        type: string
      example: '"a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5"'

    lang:
      name: lang
      in: query
      required: false
      description: |
        Two-letter language code. When provided, the request operates on
        the page translation for that language. If omitted, the default
        site language is used.
      schema:
        type: string
      example: en

    webhookId:
      name: id
      in: path
      required: true
      description: Unique identifier of the webhook.
      schema:
        type: string
      example: wh_abc123

  # ---------------------------------------------------------------------------
  # Reusable Headers
  # ---------------------------------------------------------------------------

    BackupFilename:
      name: filename
      in: path
      required: true
      description: Backup archive file name (a plain `.zip` name, no path).
      schema:
        type: string
        pattern: "^[^/\\\\]+\\.zip$"
      example: grav-backup-2026-03-22T09-30-00.zip

    AuditFilterEvent:
      name: event
      in: query
      required: false
      description: Exact event code.
      schema:
        type: string
      example: page.update
    AuditFilterActor:
      name: actor
      in: query
      required: false
      description: Exact actor id or actor name.
      schema:
        type: string
      example: admin
    AuditFilterTargetType:
      name: target_type
      in: query
      required: false
      description: Exact target type (for example `page`, `media`, `user`, `group`, `config`, `package`).
      schema:
        type: string
      example: page
    AuditFilterSeverity:
      name: severity
      in: query
      required: false
      description: Exact severity. Recorded events use `info`, `notice` or `warning`.
      schema:
        type: string
      example: warning
    AuditFilterFrom:
      name: from
      in: query
      required: false
      description: Earliest timestamp, inclusive, in Unix epoch milliseconds.
      schema:
        type: integer
        format: int64
      example: 1758000000000
    AuditFilterTo:
      name: to
      in: query
      required: false
      description: Latest timestamp, inclusive, in Unix epoch milliseconds.
      schema:
        type: integer
        format: int64
      example: 1758441600000
    AuditFilterQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match against actor name, target id, event code and IP.
      schema:
        type: string
      example: blog
    I18nSourceLang:
      name: source_lang
      in: query
      required: false
      description: Language used as the reference. An invalid or missing code falls back to the editor's default language (the site default if any source ships it, else `en`, else the first available).
      schema:
        type: string
        pattern: "^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,4})?$"
      example: en
    I18nOverrideLang:
      name: lang
      in: path
      required: true
      description: Language code of the override file (`user/languages/<lang>.yaml`).
      schema:
        type: string
        pattern: "^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,4})?$"
      example: fr

    BrandingLogoVariant:
      name: variant
      in: query
      required: false
      description: Which branding file to act on. Required unless sent as a `variant` form/body field instead.
      schema:
        type: string
        enum: [light, dark, favicon]
      example: light

    ExtensionScriptPluginSlug:
      name: slug
      in: path
      required: true
      description: Installed plugin slug. Must not contain `/`, `\` or be `.`/`..`.
      schema:
        type: string
      example: seo-magic

    ExtensionScriptThemeSlug:
      name: slug
      in: path
      required: true
      description: Installed theme slug. Must not contain `/`, `\` or be `.`/`..`.
      schema:
        type: string
      example: quark

    ExtensionScriptFieldType:
      name: type
      in: path
      required: true
      description: Custom field type; the file `admin-next/fields/{type}.js` is served. Only the basename is used.
      schema:
        type: string
      example: seo-magic-preview

    ExtensionScriptIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from an earlier response. When it matches (or is `*`), the server answers 304 without a body.
      schema:
        type: string
      example: '"66f1c2a0-1a2b"'

    InvitationToken:
      name: token
      in: path
      required: true
      description: Invitation token, as returned by `GET /invitations` or `POST /invitations`.
      schema:
        type: string
      example: 9c1f0e6b2a7d4c8e5f3a1b9d0c7e2f4a
  headers:
    ETag:
      description: Entity tag for optimistic concurrency control.
      schema:
        type: string
      example: '"a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5"'

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------

    I18nInvalidates:
      description: Client cache tags the admin should refresh after this change.
      schema:
        type: string
      example: "i18n:update, translations:update"
  responses:
    Unauthorized:
      description: Authentication is required or the provided credentials are invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 401
            title: Unauthorized
            detail: Invalid username or password.

    Forbidden:
      description: The authenticated user does not have the required permission.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 403
            title: Forbidden
            detail: "Missing required permission: api.pages.write"

    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            title: Not Found
            detail: "Page not found at route: /nonexistent"

    Conflict:
      description: |
        The resource has been modified since the provided ETag was
        generated. Fetch the latest version and retry.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 409
            title: Conflict
            detail: The resource has been modified since you last retrieved it. Please fetch the latest version and try again.

    ValidationError:
      description: The request body failed validation.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValidationError"
          example:
            status: 422
            title: Unprocessable Entity
            detail: "Missing required fields: title, route"
            errors:
              - field: title
                message: "The 'title' field is required."
              - field: route
                message: "The 'route' field is required."

    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-RateLimit-Limit:
          description: Maximum requests allowed per window.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
        X-RateLimit-Reset:
          description: UTC epoch timestamp when the rate limit window resets.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 429
            title: Too Many Requests
            detail: Rate limit exceeded. Try again later.

  # ---------------------------------------------------------------------------
  # Request bodies
  # ---------------------------------------------------------------------------

    AuditDisabled:
      description: The audit trail is not enabled (`plugins.api.audit.enabled` is off).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            title: Not Found
            detail: The audit trail is not enabled.
    AuditUnavailable:
      description: The `pdo_sqlite` PHP extension is not installed, so the audit trail cannot run.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 503
            title: Service Unavailable
            detail: The audit trail requires the SQLite PHP extension, which is not installed.

    ExtensionScriptJs:
      description: JavaScript web component source.
      headers:
        ETag:
          description: Stat-based validator `"{mtime-hex}-{size-hex}"`.
          schema:
            type: string
        Cache-Control:
          description: Always `private, no-cache` (store, but revalidate every time).
          schema:
            type: string
      content:
        application/javascript:
          schema:
            type: string
            description: Raw JavaScript source defining the custom element.

    ExtensionScriptFieldBundle:
      description: Map of field type to JavaScript source (not wrapped in the `data` envelope).
      headers:
        ETag:
          description: MD5 of each script's name, mtime and size.
          schema:
            type: string
        Cache-Control:
          description: Always `private, no-cache`.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
              description: JavaScript source for that field type.
          example:
            seo-magic-preview: "class extends HTMLElement { /* ... */ }"
            seo-magic-score: "class extends HTMLElement { /* ... */ }"

    ExtensionScriptNotModified:
      description: The script is unchanged since the ETag sent in `If-None-Match`. No body.
      headers:
        ETag:
          description: The current validator.
          schema:
            type: string
        Cache-Control:
          description: Always `private, no-cache`.
          schema:
            type: string

    ExtensionScriptNotFound:
      description: The package is not installed, or it does not ship the requested script.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            title: Not Found
            detail: "Widget component not found for plugin 'ai-pro'."

    ExtensionScriptPluginNotFound:
      description: The plugin is not installed, is not enabled, or does not ship the requested script.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            title: Not Found
            detail: "Plugin 'ai-pro' is not enabled."

    ExtensionScriptInvalidSlug:
      description: The package slug is empty or contains a path separator.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 422
            title: Unprocessable Entity
            detail: "Invalid package slug '..'."

    GpmRepositoryUnreachable:
      description: The GPM repository could not be reached.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 502
            title: Bad Gateway
            detail: Unable to reach GPM repository.
  requestBodies:
    MediaMetadataWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              fields:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                description: |
                  Map of metadata field key to value. Only keys matching a
                  configured field are written; an empty string (or empty array
                  for a `tags` field) clears a field. A `tags` field accepts an
                  array of strings, or a comma-separated string. A bare
                  `{key: value}` object (without the `fields` wrapper) is also
                  accepted.
                example:
                  alt: A dog running on the beach
                  title: Beach Day
                  caption: ""
                  description: Our trip to the coast last summer.
                  tags: [beach, dog, summer]

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # -- Media metadata --------------------------------------------------------
    MediaMetadata:
      type: object
      description: Editable metadata for a media file, plus its read-only stored keys.
      properties:
        filename:
          type: string
          example: beach.jpg
        has_meta:
          type: boolean
          description: Whether a `.meta.yaml` sidecar currently exists for the file.
          example: true
        fields:
          type: array
          description: The configured editable fields with their current values.
          items:
            type: object
            properties:
              key:
                type: string
                example: alt
              label:
                type: string
                example: Alt Text
              type:
                type: string
                enum: [text, textarea, tags]
                example: text
              value:
                description: |
                  A string for `text`/`textarea` fields, or an array of strings
                  for a `tags` field.
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                example: A dog running on the beach
        extra:
          type: object
          additionalProperties: true
          description: |
            Other keys stored in the sidecar (EXIF, dimensions, upload info)
            that the editor does not manage and never overwrites.
          example:
            width: 1600
            height: 1067

    # -- Blueprint -------------------------------------------------------------
    BlueprintResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Blueprint"

    Blueprint:
      type: object
      description: A resolved blueprint schema defining form fields for content or configuration editing.
      properties:
        name:
          type: string
          description: Blueprint identifier (template name, plugin slug, etc.)
          example: blog
        title:
          type: string
          description: Human-readable title.
          example: Blog
        type:
          type: string
          nullable: true
          description: Blueprint type (plugin, theme, etc.)
        child_type:
          type: string
          nullable: true
          description: Default child page type for this template.
          example: item
        validation:
          type: string
          description: Validation mode (`strict` or `loose`).
          example: loose
        fields:
          type: array
          description: Top-level field definitions (typically a `tabs` container).
          items:
            $ref: "#/components/schemas/BlueprintField"

    PermissionAction:
      type: object
      description: A registered permission action, as returned by `GET /blueprints/users/permissions`.
      required: [name, label]
      properties:
        name:
          type: string
          description: Full dotted permission name.
          example: api.pages.read
        label:
          type: string
          description: Translated label in the caller's admin language.
          example: Read
        children:
          type: array
          description: Child actions. Omitted on leaf actions.
          items:
            $ref: "#/components/schemas/PermissionAction"

    BlueprintField:
      type: object
      description: A single form field definition.
      required: [name, type]
      properties:
        name:
          type: string
          description: Dot-notation field path (e.g. `header.content.limit`).
          example: header.title
        type:
          type: string
          description: |
            Field type. Standard types include: `text`, `textarea`, `select`, `toggle`,
            `checkbox`, `radio`, `markdown`, `editor`, `filepicker`, `pagemedia`,
            `taxonomy`, `list`, `array`, `tabs`, `tab`, `section`, `fieldset`,
            `columns`, `column`, `spacer`, `display`, `hidden`.
          example: text
        label:
          type: string
          description: Display label (may contain translation keys like `PLUGIN_ADMIN.TITLE`).
        help:
          type: string
          description: Help text shown below the field.
        placeholder:
          type: string
        default:
          description: Default value for the field.
        description:
          type: string
          description: Extended description (may contain HTML if `markdown` is true).
        title:
          type: string
          description: Section or spacer title.
        options:
          type: object
          additionalProperties:
            type: string
          description: Key-value options for select, radio, toggle fields.
          example: { "asc": "Ascending", "desc": "Descending" }
        validate:
          type: object
          description: Validation rules.
          properties:
            type:
              type: string
              example: int
            required:
              type: boolean
            pattern:
              type: string
            min:
              type: number
            max:
              type: number
        fields:
          type: array
          description: Nested child fields (for tabs, tab, section, fieldset, columns, list).
          items:
            $ref: "#/components/schemas/BlueprintField"
        toggleable:
          type: boolean
        multiple:
          type: boolean
        markdown:
          type: boolean
          description: If true, the description contains HTML/markdown.
        underline:
          type: boolean
        size:
          type: string
          enum: [small, medium, large]
        rows:
          type: integer
          description: Number of rows for textarea fields.

    # -- Sidebar --------------------------------------------------------------
    SidebarItem:
      type: object
      description: A sidebar navigation item contributed by a plugin.
      properties:
        id:
          type: string
          description: Unique identifier for the sidebar item.
          example: dashboard
        plugin:
          type: string
          description: Plugin slug that registered this item.
          example: admin-next
        label:
          type: string
          description: Display label for the sidebar item.
          example: Dashboard
        icon:
          type: string
          description: Icon identifier (e.g. Lucide icon name).
          example: gauge
        route:
          type: string
          description: Admin route this item navigates to.
          example: /dashboard
        priority:
          type: integer
          description: Sort priority (higher values appear first).
          example: 100
        badge:
          type: string
          nullable: true
          description: Optional static badge text (e.g. a count or status indicator). Plugins may also send a number.
          example: null
        badgeEndpoint:
          type: string
          description: "Optional API path returning `{count: N}`, fetched by the admin to show a live badge that overrides `badge`."
          example: /my-plugin/badge
      additionalProperties: true

    # -- MCP Tool --------------------------------------------------------------
    McpTool:
      type: object
      description: One MCP tool contributed by a plugin.
      properties:
        name:
          type: string
          description: The tool name an MCP client registers, `{prefix}_{name}` from the manifest. 64 characters or fewer.
          example: kahunacart_list_products
        plugin:
          type: string
          description: Slug of the plugin that contributed the tool.
          example: kahunacart
        title:
          type: string
          nullable: true
          description: Human title an MCP client may show.
          example: List products
        description:
          type: string
          description: What the tool does and returns, and when to use it.
          example: List catalog products with paging, search and status filters.
        method:
          type: string
          enum: [GET, POST, PATCH, PUT, DELETE]
          example: GET
        path:
          type: string
          description: Route path relative to the API base. `{name}` placeholders are filled from the arguments.
          example: /kahunacart/products
        permission:
          type: string
          nullable: true
          description: The permission the route enforces, checked again by the client before it calls.
          example: kahunacart.products.manage
        annotations:
          type: object
          description: Always fully populated, with the per-method defaults applied.
          properties:
            readOnly:
              type: boolean
            destructive:
              type: boolean
            idempotent:
              type: boolean
        input_schema:
          type: object
          description: |
            JSON Schema for the arguments, always present and always an object.
            A tool with no arguments carries `{"type":"object","properties":{}}`.
            Restricted to the subset an MCP client can convert: `type`,
            `description`, `default`, `enum`, `nullable`, `minimum`, `maximum`,
            `minLength`, `maxLength`, `pattern`, `format`, `items`, `properties`,
            `required` and `additionalProperties`.
            `additionalProperties: true` at the root means what it means on a
            nested object: arguments the schema does not declare are passed
            through, as query parameters for a `GET` and into the body for every
            other method. It never appears on a tool that designates a `body`.
          additionalProperties: true
        path_params:
          type: array
          description: The `{name}` placeholders in `path`, in order. Each is a required property of `input_schema`.
          items:
            type: string
          example: [id]
        query:
          type: array
          description: For write methods, the properties to send as query-string parameters rather than in the JSON body. Ignored for GET, which sends every non-path property as a query parameter.
          items:
            type: string
          example: []
        body:
          type: string
          nullable: true
          description: The one property whose value is the whole request body, or null when the body is assembled from the properties left over after the path and query parameters.
          example: null

    # -- Plugin Page Definition ------------------------------------------------
    PluginPageDefinition:
      type: object
      description: Admin page definition registered by a plugin. The plugin supplies it, so it may carry further keys of its own, which are passed through unchanged.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Unique page identifier.
          example: api-settings
        plugin:
          type: string
          description: Plugin slug that registered this page.
          example: api
        title:
          type: string
          description: Page title.
          example: API Settings
        icon:
          type: string
          description: Icon identifier for the page.
          example: plug
        page_type:
          type: string
          description: |
            Page rendering type. `blueprint` renders a blueprint form
            (`blueprint`, `data_endpoint`, `save_endpoint`); `component`
            mounts the plugin's web component from
            `GET /gpm/plugins/{slug}/page-script`.
          example: blueprint
        blueprint:
          type: string
          nullable: true
          description: Name of the plugin blueprint the form is drawn from (for `blueprint` pages).
          example: algolia-pro
        data_endpoint:
          type: string
          nullable: true
          description: API path, relative to the API base, to fetch current data for the form.
          example: /algolia-pro/data
        save_endpoint:
          type: string
          nullable: true
          description: API path, relative to the API base, to save form data.
          example: /algolia-pro/data
        actions:
          type: array
          description: Buttons for the page toolbar.
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
                description: Action identifier; `save` is the form's own save.
                example: reindex
              label:
                type: string
                example: Reindex
              icon:
                type: string
                example: fa-rotate
              endpoint:
                type: string
                description: API path the action POSTs to. Without one, Admin Next dispatches a `grav:plugin-page-action` event for the plugin's own scripts to handle.
                example: /algolia-pro/reindex
              confirm:
                type: string
                description: Confirmation prompt shown before the action runs.
              primary:
                type: boolean
                description: Render as the primary button.
              upload:
                type: boolean
                description: The action takes a file upload.
        has_custom_component:
          type: boolean
          description: Whether the plugin ships `admin-next/pages/{slug}.js`. Always set by the server.
          example: false
        settings_route:
          type: string
          description: Hash route inside the page where this plugin's settings are drawn (e.g. `#settings`). Only kept when it starts with `#`.
          example: "#settings"
        settings_page:
          type: string
          description: Slug of another plugin whose admin page draws these settings (used by add-ons without a page of their own). Only kept alongside a valid `settings_route` and when that plugin has an Admin Next page.
          example: kahunacart

    # -- Page -----------------------------------------------------------------
    Page:
      type: object
      description: Full page object including content, media, and optional children.
      properties:
        route:
          type: string
          description: The page route (e.g. `/blog/my-post`).
          example: /blog/my-first-post
        raw_route:
          type: string
          description: |
            Structural route of the page. Differs from `route` for the home
            page (`/home` instead of `/`) and for its children when
            `home.hide_in_urls` is on. Prefer this when addressing the page
            in later API calls.
          example: /blog/my-first-post
        parent_route:
          type: string
          description: |
            Structural route of the parent page, taken from the real
            hierarchy; `/` for a top-level page. Use this rather than
            splitting `route` when moving or reparenting.
          example: /blog
        slug:
          type: string
          description: URL-safe slug derived from the directory name.
          example: my-first-post
        folder:
          type: string
          description: The on-disk folder name, including any numeric ordering prefix.
          example: 01.my-first-post
        title:
          type: string
          description: The page title from the header.
          example: My First Post
        menu:
          type: string
          description: The menu label (`menu` from the header, falling back to the title).
          example: My First Post
        template:
          type: string
          description: The Twig template used to render this page.
          example: blog
        header:
          type: object
          additionalProperties: true
          description: The full frontmatter header as a key-value object.
          example:
            title: My First Post
            taxonomy:
              category: [blog]
              tag: [intro, grav]
        taxonomy:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Taxonomy types and their values for this page.
          example:
            category: [blog]
            tag: [intro, grav]
        published:
          type: boolean
          description: |
            Whether the page is published. This is a single boolean and cannot
            distinguish a draft from a page that is scheduled or expired — use
            `publish_state` for that.
          example: true
        publish_date:
          type: string
          format: date-time
          nullable: true
          description: |
            The page's `publish_date` frontmatter value as ISO 8601, parsed
            with the page's own `dateformat`. Null when unset.
          example: "2026-12-01T09:00:00+00:00"
        unpublish_date:
          type: string
          format: date-time
          nullable: true
          description: |
            The page's `unpublish_date` frontmatter value as ISO 8601, parsed
            with the page's own `dateformat`. Null when unset.
          example: "2027-01-01T00:00:00+00:00"
        publish_state:
          type: string
          enum: [published, unpublished, scheduled, expired]
          description: |
            The page's effective publishing state, resolved the way Grav core
            resolves it: an explicit `published:` in the frontmatter wins
            outright and makes both dates inert, and the dates are only
            consulted when `system.pages.publish_dates` is enabled.

            * `published` — live now.
            * `unpublished` — an explicit `published: false` draft.
            * `scheduled` — `publish_date` is in the future.
            * `expired` — `unpublish_date` is in the past.
          example: published
        visible:
          type: boolean
          description: Whether the page is visible in navigation menus.
          example: true
        routable:
          type: boolean
          description: Whether the page is routable (accessible via URL).
          example: true
        date:
          type: string
          format: date-time
          nullable: true
          description: Page date as ISO 8601.
          example: "2026-03-20T12:00:00+00:00"
        modified:
          type: string
          format: date-time
          nullable: true
          description: Last modification time as ISO 8601.
          example: "2026-03-22T09:30:00+00:00"
        order:
          $ref: "#/components/schemas/PageOrder"
        has_children:
          type: boolean
          description: Whether this page has child pages. Useful for tree/column UIs to show expand indicators without loading children.
          example: true
        content:
          type: string
          description: |
            Raw Markdown content of the page body. Left out when
            `summary=true` is requested.
          example: |
            # Hello World

            This is the body of the post.
        content_html:
          type: string
          description: |
            Rendered HTML content. Only present when `render=true` is
            requested.
          example: "<h1>Hello World</h1>\n<p>This is the body of the post.</p>"
        summary:
          type: string
          description: |
            Plain-text summary (rendered, tags stripped, truncated to
            `summary_size`, default 300 characters). Only present when
            `summary=true` is requested.
          example: This is the body of the post.
        media:
          type: array
          description: Media files attached to this page.
          items:
            $ref: "#/components/schemas/MediaItem"
        children:
          type: array
          description: |
            Child pages. Only present when `children=true` is requested.
            Each child is a full Page object (recursion depth controlled by
            `children_depth`).
          items:
            $ref: "#/components/schemas/Page"
        language:
          type: string
          nullable: true
          description: |
            Language code of the page content (e.g. `en`, `fr`). `null` for a
            page file without a language extension.
          example: en
        translated_languages:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: |
            Map of language code to the page's route in that language, for
            every language with a translation file (an untyped
            `<template>.md` counts for the default language). Serialized as
            an empty array `[]` on a single-language site. Only present when
            `translations=true` is requested.
          example:
            en: /blog/my-first-post
            fr: /blog/mon-premier-article
        untranslated_languages:
          type: array
          description: |
            Configured languages that this page has not been translated into.
            Only present when `translations=true` is requested.
          items:
            type: string
          example: [de, es]
        has_default_file:
          type: boolean
          description: |
            Whether an untyped `<template>.md` exists, which makes every
            language count as translated through the fallback. Only present
            when `translations=true` is requested.
          example: false
        explicit_language_files:
          type: array
          description: |
            Language codes backed by their own `<template>.<lang>.md` file,
            as opposed to the `<template>.md` fallback. Only present when
            `translations=true` is requested.
          items:
            type: string
          example: [en, fr]
        permissions:
          type: object
          description: |
            What the authenticated caller may do to THIS page: the account's
            `api.pages.*` permissions with the page's own `header.permissions`
            rules applied on top (a page rule can both grant and deny). Present
            on every page record the API returns, including listing rows.
          properties:
            create:
              type: boolean
              description: May add child pages under this page.
            read:
              type: boolean
            update:
              type: boolean
            delete:
              type: boolean
            publish:
              type: boolean
              description: Falls back to `update` when the page states no publish rule.
            list:
              type: boolean
          example:
            create: false
            read: true
            update: true
            delete: true
            publish: true
            list: true
      required:
        - route
        - slug
        - title
        - template
        - header
        - taxonomy
        - published
        - visible
        - routable
        - date
        - modified
        - order

    PageSummary:
      type: object
      description: |
        Lightweight page representation used in list responses. Excludes
        content, media, and children for performance.
      properties:
        route:
          type: string
          example: /blog/my-first-post
        raw_route:
          type: string
          description: Structural route of the page (see `Page.raw_route`).
          example: /blog/my-first-post
        parent_route:
          type: string
          description: Structural route of the parent page; `/` for a top-level page.
          example: /blog
        slug:
          type: string
          example: my-first-post
        folder:
          type: string
          description: The on-disk folder name, including any numeric ordering prefix.
          example: 01.my-first-post
        title:
          type: string
          example: My First Post
        menu:
          type: string
          description: The menu label (`menu` from the header, falling back to the title).
          example: My First Post
        template:
          type: string
          example: blog
        header:
          type: object
          additionalProperties: true
          description: The page's frontmatter. Left out when the list is requested with `fields=summary`.
        taxonomy:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        published:
          type: boolean
          example: true
        publish_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-01T09:00:00+00:00"
        unpublish_date:
          type: string
          format: date-time
          nullable: true
          example: "2027-01-01T00:00:00+00:00"
        publish_state:
          type: string
          enum: [published, unpublished, scheduled, expired]
          description: |
            Effective publishing state. `published` is only a boolean, so a
            scheduled or expired page needs this field to be told apart from a
            plain draft.
          example: published
        visible:
          type: boolean
          example: true
        routable:
          type: boolean
          example: true
        date:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-20T12:00:00+00:00"
        modified:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-22T09:30:00+00:00"
        order:
          $ref: "#/components/schemas/PageOrder"
        has_children:
          type: boolean
          description: Whether the page has any child pages.
          example: true
        language:
          type: string
          nullable: true
          description: Language code of the page content (e.g. `en`, `fr`).
          example: en
        translated_languages:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: |
            Map of language code to the page's route in that language (see
            `Page.translated_languages`). Only present when
            `translations=true` is requested.
          example:
            en: /blog/my-first-post
        untranslated_languages:
          type: array
          description: Only present when `translations=true` is requested.
          items:
            type: string
          example: [fr]
        has_default_file:
          type: boolean
          description: Only present when `translations=true` is requested (see `Page.has_default_file`).
          example: false
        explicit_language_files:
          type: array
          description: Only present when `translations=true` is requested (see `Page.explicit_language_files`).
          items:
            type: string
          example: [en]
        permissions:
          type: object
          description: |
            What the caller may do to this page: the account's `api.pages.*`
            permissions with the page's own `header.permissions` rules
            applied on top.
          properties:
            create:
              type: boolean
            read:
              type: boolean
            update:
              type: boolean
            delete:
              type: boolean
            publish:
              type: boolean
            list:
              type: boolean
      required:
        - route
        - slug
        - title
        - template
        - taxonomy
        - published
        - visible
        - routable
        - date
        - modified
        - order

    PageOrder:
      description: |
        The folder's numeric ordering prefix, or `false` for a folder without
        one. The type depends on the page object behind the response: Flex
        pages (used by `GET /pages` when the Flex pages directory is
        available) give an integer such as `1`, while regular pages give the
        raw prefix string including its dot, such as `"01."`.
      oneOf:
        - type: integer
        - type: string
        - type: boolean
      example: 1

    PageRouteStub:
      type: object
      description: |
        Minimal payload returned by a move or copy when the resulting page
        cannot be resolved at its new route straight away.
      required: [route, slug]
      properties:
        route:
          type: string
          example: /tutorials/renamed-post
        slug:
          type: string
          example: renamed-post
      additionalProperties: false

    # -- Media ----------------------------------------------------------------
    MediaItem:
      type: object
      description: A media file, either from a page or the site-level media folder.
      properties:
        filename:
          type: string
          description: The file name.
          example: hero-image.jpg
        path:
          type: string
          description: |
            Site media only. The folder holding the file, relative to the media
            root, without the filename (an empty string for the root).
          example: blog/2026
        url:
          type: string
          description: |
            URL of the file. For site media stored where the web server refuses
            to serve it directly (for example a multi-site `user/env/...`
            folder), this points at `GET /media/raw/{path}` instead.
          example: /user/images/hero-image.jpg
        type:
          type: string
          description: MIME type of the file.
          example: image/jpeg
        size:
          type: integer
          description: File size in bytes.
          example: 204800
        alt:
          type: string
          description: Alt text from the file's `.meta.yaml` sidecar. Only present when set.
          example: A dog running on the beach
        title:
          type: string
          description: Title from the file's `.meta.yaml` sidecar. Only present when set.
          example: Beach Day
        thumbnail_url:
          type: string
          description: URL of a cached thumbnail served by `GET /thumbnails/{file}`. Only present for raster images whose thumbnail could be generated.
          example: /api/v1/thumbnails/3f2a9c1e4b5d6a7f8e9d0c1b2a394857.jpg
        dimensions:
          type: object
          nullable: true
          description: Image dimensions. Only present for image files.
          properties:
            width:
              type: integer
              example: 1920
            height:
              type: integer
              example: 1080
        modified:
          type: string
          format: date-time
          description: Last modification time as ISO 8601.
          example: "2026-03-22T09:30:00+00:00"
      required:
        - filename
        - url
        - type
        - size
        - modified

    FolderInfo:
      type: object
      properties:
        name:
          type: string
          description: Folder name.
          example: "2026"
        path:
          type: string
          description: Full relative path from the media root.
          example: blog/2026
        children_count:
          type: integer
          description: Number of immediate subdirectories.
          example: 1
        file_count:
          type: integer
          description: Number of files in this folder (excluding metadata files).
          example: 5

    # -- User -----------------------------------------------------------------
    User:
      type: object
      description: A Grav user account.
      properties:
        username:
          type: string
          example: admin
        email:
          type: string
          format: email
          nullable: true
          example: admin@example.com
        fullname:
          type: string
          nullable: true
          example: Site Administrator
        title:
          type: string
          nullable: true
          description: Job title or role label.
          example: Administrator
        state:
          type: string
          enum: [enabled, disabled]
          description: Whether the account is active.
          example: enabled
        language:
          type: string
          description: Preferred admin language code, or an empty string when unset.
          example: en
        content_editor:
          type: string
          description: Preferred content editor, or an empty string for the default.
          example: ""
        groups:
          type: array
          items:
            type: string
          description: Groups the account belongs to.
          example: [editors]
        avatar_url:
          type: string
          nullable: true
          description: |
            URL of a 200px thumbnail of the user's avatar (served by
            `GET /thumbnails/{file}`), or `null` if no avatar is set.
          example: /api/v1/thumbnails/3f2a9c1e4b5d6a7f8e9d0c1b2a394857.jpg
        twofa_enabled:
          type: boolean
          description: Whether two-factor authentication is currently enabled for this user.
          example: false
        twofa_secret:
          type: boolean
          description: Whether a 2FA secret exists for this user (does not expose the actual secret).
          example: false
        access:
          type: object
          additionalProperties: true
          description: |
            Permission tree. Keys are dot-separated permission groups, values
            are booleans or nested objects.
          example:
            admin:
              super: true
            api:
              access: true
        created:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-15T10:00:00+00:00"
        modified:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-22T09:30:00+00:00"
        twofa_global_enabled:
          type: boolean
          description: |
            Only on `GET` and `PATCH /users/{username}`. Whether 2FA support
            is available on this site (the Login plugin is installed), so the
            client knows whether to offer enrollment. Not part of the ETag.
        extra:
          type: object
          description: |
            Only on `GET /users`. Plugin-supplied scalar values for the columns
            declared by `GET /users/columns`, keyed by each column's `field`.
            Absent when no plugin supplies values for the user.
          additionalProperties:
            description: A string, number, boolean or null.
      additionalProperties:
        description: |
          Values of custom fields the site added to the account blueprint are
          included too, when the account has a value for them.
      required:
        - username
        - state
        - access

    # -- Config ---------------------------------------------------------------
    ConfigObject:
      type: object
      additionalProperties: true
      description: |
        An arbitrary configuration object. Its structure depends on the scope.
        For scalar values, the response wraps the value as `{"value": ...}`.
      example:
        pages:
          theme: quark
        debugger:
          enabled: false

    # -- System ---------------------------------------------------------------
    SystemInfo:
      type: object
      description: Runtime information about the Grav installation.
      properties:
        grav_version:
          type: string
          description: The installed Grav core version.
          example: 1.7.48
        php_version:
          type: string
          description: PHP runtime version.
          example: 8.3.14
        php_extensions:
          type: array
          items:
            type: string
          description: List of loaded PHP extensions.
          example: [curl, gd, intl, json, mbstring, openssl, pdo, zip]
        server_software:
          type: string
          description: Web server identification string.
          example: Apache/2.4.58 (Unix)
        environment:
          type: string
          description: The active Grav environment name.
          example: localhost
        plugins:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: API
              version:
                type: string
                example: 1.0.0-beta.1
              enabled:
                type: boolean
                example: true
          description: Installed plugins with version and enabled state.
        themes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Quark
              version:
                type: string
                example: 2.0.4
              active:
                type: boolean
                example: true
          description: Installed themes with version and active state.
        php_config:
          type: object
          description: |
            PHP `ini` settings grouped by section. Keys are section labels
            (`Upload & POST`, `Memory & Execution`, `Error Handling`,
            `Paths & Environment`, `Session`, `OPcache`, `Security`,
            `Date & Locale`); each value maps a setting name to its value as
            a string.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          example:
            "Memory & Execution":
              memory_limit: 256M
              max_execution_time: 30s
      required:
        - grav_version
        - php_version
        - php_extensions
        - server_software
        - environment
        - plugins
        - themes
        - php_config

    LogEntry:
      type: object
      description: A single parsed entry from a log file such as `grav.log`.
      properties:
        date:
          type: string
          nullable: true
          description: Timestamp of the log entry, as written in the log.
          example: "2026-03-22 09:30:15"
        logger:
          type: string
          description: Monolog channel name that wrote the entry.
          example: grav
        level:
          type: string
          description: Log level.
          enum: [DEBUG, INFO, NOTICE, WARNING, ERROR, CRITICAL, ALERT, EMERGENCY]
          example: ERROR
        message:
          type: string
          description: The log message.
          example: "Class 'Grav\\Plugin\\FooPlugin' not found"
      required:
        - date
        - logger
        - level
        - message

    Backup:
      type: object
      description: Metadata about a backup archive.
      properties:
        filename:
          type: string
          description: Name of the backup archive file.
          example: grav-backup-2026-03-22T09-30-00.zip
        path:
          type: string
          description: Absolute filesystem path. Only present on creation responses.
          example: /var/www/grav/backup/grav-backup-2026-03-22T09-30-00.zip
        title:
          type: string
          nullable: true
          description: Backup profile title derived from the filename. Only present on list responses.
          example: Default Site Backup
        size:
          type: integer
          description: Archive file size in bytes.
          example: 52428800
        date:
          type: string
          nullable: true
          description: Creation timestamp in ISO 8601, on both creation and list responses.
          example: "2026-03-22T09:30:00+00:00"
      required:
        - filename
        - size

    ApiKey:
      type: object
      description: |
        API key metadata. The key hash is never exposed; only the prefix
        (first 12 characters plus `...`) is shown.
      properties:
        id:
          type: string
          description: Unique identifier for the key.
          example: a1b2c3d4e5f6a7b8
        name:
          type: string
          description: Human-readable label for the key.
          example: CI/CD Pipeline
        prefix:
          type: string
          description: First 12 characters of the key plus `...` for identification.
          example: grav_a1b2c3d4...
        scopes:
          type: array
          items:
            type: string
          description: Permission scopes this key is restricted to. Empty means unrestricted.
          example: [api.pages.read, api.media.read]
        active:
          type: boolean
          description: Whether the key is currently active.
          example: true
        created:
          type: integer
          nullable: true
          description: Unix timestamp when the key was created.
          example: 1711094400
        last_used:
          type: integer
          nullable: true
          description: Unix timestamp when the key was last used, or `null` if never used.
          example: 1711180800
        expires:
          type: integer
          nullable: true
          description: Unix timestamp when the key expires, or `null` for no expiry.
          example: null
      required:
        - id
        - name
        - prefix
        - scopes
        - active

    # -- Auth -----------------------------------------------------------------
    TokenResponse:
      type: object
      description: |
        The bare JWT token pair. Every auth endpoint that issues tokens also
        includes the `user` profile; see `AuthTokenPairWithUser`.
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Long-lived refresh token for obtaining new access tokens.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          description: Token type. Always `Bearer`.
          example: Bearer
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 3600
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in

    # -- Pagination Envelope --------------------------------------------------
    PaginatedEnvelope:
      type: object
      description: Standard paginated response wrapper.
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  description: Current page number (1-based).
                  example: 1
                per_page:
                  type: integer
                  description: Items per page.
                  example: 20
                total:
                  type: integer
                  description: Total number of items across all pages.
                  example: 42
                total_pages:
                  type: integer
                  description: Total number of pages.
                  example: 3
                located_at_index:
                  type: integer
                  description: |
                    Zero-based position of the item requested with a `locate`
                    query in the full result set. Present only when the
                    endpoint supports `locate` and the item was found.
                  example: 37
              required: [page, per_page, total, total_pages]
          required: [pagination]
        links:
          type: object
          description: Pagination links. Each carries the request's other query parameters (filters, search, sort), so following one stays within the same filtered list; only `page` and `per_page` change.
          properties:
            self:
              type: string
              description: URL of the current page.
              example: "/api/v1/pages?page=1&per_page=20"
            first:
              type: string
              description: URL of the first page. Present when `page > 1`.
              example: "/api/v1/pages?page=1&per_page=20"
            prev:
              type: string
              description: URL of the previous page. Present when `page > 1`.
              example: "/api/v1/pages?page=1&per_page=20"
            next:
              type: string
              description: URL of the next page. Present when more pages exist.
              example: "/api/v1/pages?page=2&per_page=20"
            last:
              type: string
              description: URL of the last page. Present when more pages exist.
              example: "/api/v1/pages?page=3&per_page=20"
          required: [self]
      required: [data, meta, links]

    # -- Error ----------------------------------------------------------------
    ErrorResponse:
      type: object
      description: |
        Error response following RFC 7807 Problem Details. Returned with
        content type `application/problem+json`.
      properties:
        status:
          type: integer
          description: HTTP status code.
          example: 422
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: Unprocessable Entity
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "Missing required fields: title"
        errors:
          type: array
          description: |
            Field-level validation errors. Only present on 422 responses
            when individual field errors are available.
          items:
            $ref: "#/components/schemas/ValidationError"
      required:
        - status
        - title
        - detail

    ValidationError:
      type: object
      description: A single field-level validation error.
      properties:
        field:
          type: string
          description: The name of the field that failed validation.
          example: title
        message:
          type: string
          description: Human-readable description of the validation failure.
          example: "The 'title' field is required."
      required:
        - field
        - message

    # -- Request Bodies -------------------------------------------------------
    CreatePageRequest:
      type: object
      description: Request body for creating a new page.
      required: [route, title]
      properties:
        route:
          type: string
          description: Full route for the new page (e.g. `/blog/my-new-post`).
          example: /blog/my-new-post
        title:
          type: string
          description: Page title.
          example: My New Post
        template:
          type: string
          description: Template name. Defaults to `default` if omitted.
          default: default
          example: blog
        content:
          type: string
          description: Raw Markdown body content.
          default: ""
          example: |
            # Hello World

            This is the body of my new post.
        header:
          type: object
          additionalProperties: true
          description: |
            Additional frontmatter fields to merge into the page header.
            The `title` from the top-level field is always included.
          example:
            taxonomy:
              category: [blog]
              tag: [new]
        order:
          oneOf:
            - type: integer
              nullable: true
            - type: string
              enum: [auto]
          description: |
            Numeric ordering prefix. When set to an integer, creates a visible
            (ordered) page directory (e.g. `03.my-new-post`). When `null`,
            creates an unordered page. Pass the string `"auto"` to mirror the
            admin-classic add-page behavior: the API scans the parent's direct
            children and assigns the next available number when any sibling
            already uses numeric prefixes; otherwise the new page is created
            without a numeric prefix.
          example: 3
        kind:
          type: string
          enum: [page, folder, module]
          default: page
          description: |
            What to create. `page` writes the folder plus `<template>.md`.
            `folder` creates only the directory (a routing/grouping
            container, no Markdown file). `module` creates a modular
            sub-page: the slug is prefixed with `_` unless it already is.
          example: page
        lang:
          type: string
          description: |
            Language code. When provided, creates the page in the specified
            language (as `<template>.<lang>.md`). Must be one of the site's
            configured languages (422 otherwise). If omitted, uses the default
            site language.
          example: en

    UpdatePageRequest:
      type: object
      description: |
        Request body for partially updating a page. All fields are optional;
        only provided fields are changed.
      properties:
        title:
          type: string
          description: New page title.
          example: Updated Post Title
        content:
          type: string
          description: New raw Markdown body content.
          example: |
            # Updated

            New content here.
        template:
          type: string
          description: Change the page template.
          example: blog
        header:
          type: object
          additionalProperties: true
          description: |
            Header fields to merge into the existing frontmatter. Existing
            fields not included here are preserved, and a `null` value removes
            that key. Lists are replaced wholesale rather than merged. With
            `header_mode: replace` the header is replaced instead of merged.
          example:
            taxonomy:
              tag: [updated]
        header_mode:
          type: string
          enum: [merge, replace]
          default: merge
          description: |
            `replace` treats `header` as the complete frontmatter (as sent by
            a raw-frontmatter editor), so keys left out are deleted. Any other
            value merges.
          example: merge
        published:
          type: boolean
          description: Set the published state.
          example: true
        visible:
          type: boolean
          description: Set the visible state.
          example: true

    MovePageRequest:
      type: object
      description: Request body for moving a page.
      required: [parent]
      properties:
        parent:
          type: string
          description: Route of the new parent page (use `/` for root).
          example: /tutorials
        slug:
          type: string
          description: New slug. Defaults to the current slug if omitted.
          example: renamed-post
        order:
          type: integer
          nullable: true
          description: |
            New ordering prefix. Defaults to the current order if omitted;
            `null` moves the page to an unnumbered folder.
          example: 5

    CreateUserRequest:
      type: object
      description: Request body for creating a new user account.
      required: [username, password, email]
      properties:
        username:
          type: string
          description: |
            Unique username, 3-64 characters. Validated by Grav core's
            `User::isValidUsername()`: it may not contain `\ / ? * : ; { }` or a
            newline, may not contain `..`, and may not start with a period.
            Letters, numbers, periods, hyphens and underscores are the
            recommended set.
          minLength: 3
          maxLength: 64
          example: johndoe
        password:
          type: string
          format: password
          description: Password for the new account.
          example: s3cureP@ss
        email:
          type: string
          format: email
          description: Email address.
          example: john@example.com
        fullname:
          type: string
          description: Full display name.
          default: ""
          example: John Doe
        title:
          type: string
          description: Job title or role label.
          default: ""
          example: Editor
        state:
          type: string
          enum: [enabled, disabled]
          description: Initial account state.
          default: enabled
          example: enabled
        access:
          type: object
          additionalProperties: true
          description: |
            Permission tree for the new user. Granting `admin.super` or
            `api.super` requires the caller to be a super admin (403 otherwise).
          example:
            api:
              access: true
              pages:
                read: true
                write: true
        groups:
          type: array
          items:
            type: string
          description: Group memberships. Only applied when the caller is a super admin; silently ignored otherwise.
          example: [editors]
      additionalProperties:
        description: |
          Custom fields the site added to the account blueprint
          (`user/blueprints/user/account.yaml`) are saved too. Keys the
          blueprint doesn't declare are ignored.

    UpdateUserRequest:
      type: object
      description: |
        Request body for partially updating a user. All fields are optional;
        only provided fields are changed, but the body may not be empty (422).

        Field gates: `email`, `fullname`, `title`, `language`,
        `content_editor` and `password` are open to anyone
        allowed to edit the account (including the account owner). `twofa_enabled`
        and `twofa_secret` are ignored here: two-factor state only changes through
        the `/users/{username}/2fa` endpoints, which check a code. `state` and
        `access` require `api.users.write` (403 when sent without it).
        `groups` requires a super admin (403 otherwise). Changing the password
        or disabling the account invalidates every outstanding API token for
        that account.
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        fullname:
          type: string
          example: Jane Doe
        title:
          type: string
          example: Senior Editor
        language:
          type: string
          description: Preferred admin language code.
          example: en
        content_editor:
          type: string
          description: Preferred content editor; empty for the default.
          example: ""
        state:
          type: string
          enum: [enabled, disabled]
          description: Requires `api.users.write`.
          example: enabled
        password:
          type: string
          format: password
          description: New password. Only set if a non-empty value is provided.
        access:
          type: object
          additionalProperties: true
          description: |
            Updated permission tree. Requires `api.users.write`; granting
            `admin.super` or `api.super` also requires a super admin.
        groups:
          type: array
          items:
            type: string
          description: Group memberships. Requires a super admin.
      additionalProperties:
        description: |
          Custom fields the site added to the account blueprint are saved too.
          Keys the blueprint doesn't declare are ignored.

    # -- Languages ------------------------------------------------------------
    LanguageInfo:
      type: object
      description: Site language configuration.
      properties:
        enabled:
          type: boolean
          description: Whether multi-language support is enabled.
          example: true
        languages:
          type: array
          description: The configured languages, in configuration order.
          items:
            type: object
            required: [code, name, native_name, rtl, is_default]
            properties:
              code:
                type: string
                example: fr
              name:
                type: string
                description: English name of the language (falls back to the code).
                example: French
              native_name:
                type: string
                description: The language's own name for itself (falls back to the code).
                example: Français
              rtl:
                type: boolean
                description: Whether the language is written right to left.
                example: false
              is_default:
                type: boolean
                example: false
        default:
          type: string
          nullable: true
          description: The default language code, or `null` when multi-language is off.
          example: en
        active:
          type: string
          nullable: true
          description: |
            The currently active language based on the request context,
            falling back to the default. `null` when multi-language is off.
          example: en
      required:
        - enabled
        - languages
        - default
        - active

    TranslationInfo:
      type: object
      description: Translation status for a page across configured languages.
      properties:
        route:
          type: string
          description: The page route.
          example: /blog/my-first-post
        default_language:
          type: string
          nullable: true
          description: The default language code, or `null` when none is configured.
          example: en
        translated:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: |
            Map of language code to the page's route in that language (with
            each ancestor's slug localized too), for every language that has
            a translation file. A default-language entry is included when the
            page has an untyped `<template>.md`. `null` when the route cannot
            be composed. Serialized as an empty array `[]` on a
            single-language site.
          example:
            en: /blog/my-first-post
            fr: /blog/mon-premier-article
        untranslated:
          type: array
          items:
            type: string
          description: Language codes that do not yet have a translation.
          example: [de, es]
      required:
        - route
        - default_language
        - translated
        - untranslated

    # -- GPM ------------------------------------------------------------------
    Package:
      type: object
      description: |
        A Grav plugin or theme package. Which optional fields appear depends
        on the endpoint: installed-package responses carry `enabled`,
        `is_symlink` and `updatable`; repository responses carry `installed`;
        optional blueprint fields (`docs`, `bugs`, `dependencies`,
        `compatibility`, `keywords`, `icon`, premium info) appear only when
        the package sets them.
      properties:
        slug:
          type: string
          nullable: true
          description: Package slug identifier.
          example: admin2
        name:
          type: string
          nullable: true
          description: Human-readable package name. A translation key is resolved in the caller's admin language.
          example: Admin2
        version:
          type: string
          nullable: true
          description: Installed version for installed packages, or the latest version for repository packages. Always a string, even when the blueprint writes a bare number.
          example: 2.1.13
        type:
          type: string
          enum: [plugin, theme]
          description: Package type.
          example: plugin
        description:
          type: string
          nullable: true
          description: Short description as authored (Markdown allowed). A translation key is resolved in the caller's admin language.
          example: The next-generation admin for Grav.
        description_html:
          type: string
          nullable: true
          description: "`description` rendered to HTML (safe mode), or `null` when there is no description."
          example: "<p>The next-generation admin for Grav.</p>"
        author:
          type: object
          nullable: true
          description: Package author, or `null` when the blueprint names none.
          properties:
            name:
              type: string
              nullable: true
              example: Team Grav
            email:
              type: string
              nullable: true
              example: devs@getgrav.org
            url:
              type: string
              nullable: true
              example: https://getgrav.org
        homepage:
          type: string
          nullable: true
          description: URL to the package homepage (falls back to the blueprint's `url`).
          example: https://github.com/getgrav/grav-plugin-admin2
        docs:
          type: string
          description: Documentation URL. Only present when the blueprint sets it.
        bugs:
          type: string
          description: Issue tracker URL. Only present when the blueprint sets it.
        enabled:
          type: boolean
          description: Installed packages only. For plugins, whether the plugin is enabled; for themes, whether it is the active theme.
          example: true
        is_symlink:
          type: boolean
          description: Installed packages only. Whether the package folder is a symlink.
          example: false
        updatable:
          type: boolean
          description: Installed packages only. Whether a newer version is available in the repository.
          example: false
        available_version:
          type: string
          nullable: true
          description: The newer version available in the repository. Only present when `updatable` is true.
          example: 2.1.14
        installed:
          type: boolean
          description: Repository and search responses only. Whether the package is installed locally.
          example: true
        premium:
          type: boolean
          description: Present (and `true`) only for premium packages.
          example: true
        licensed:
          type: boolean
          description: Premium packages only. Whether a licence key covering this package is on file.
          example: false
        vendor:
          type: string
          description: Premium packages only, when set. Who sells the package.
          example: Trilby Media
        purchase_url:
          type: string
          description: Premium packages only, when known. Where to buy a licence.
          example: https://licensing.getgrav.org/buy/algolia-pro
        dependencies:
          type: array
          description: Dependencies as written in the package blueprint (slug strings or `{name, version}` objects). Only present when set.
          items: {}
        compatibility:
          type: object
          description: Compatibility metadata, e.g. `grav` and `api` version constraints. Values are strings or lists of strings. Only present when known.
          additionalProperties: {}
          example:
            grav: ">=2.0.0"
        keywords:
          type: array
          items:
            type: string
          description: Tags or keywords associated with the package. Only present when set.
          example: [admin, panel, manager]
        icon:
          type: string
          description: Font Awesome icon name. Only present when set.
          example: empire
        screenshot:
          type: string
          nullable: true
          description: |
            Themes only. In repository responses, the full URL of the
            repository screenshot (only present when there is one). In
            installed-theme responses, a `/thumbnails/{file}` URL of the
            theme's own screenshot, or `null`.
        thumbnail:
          type: string
          nullable: true
          description: Installed themes only. A `/thumbnails/{file}` URL of the theme's thumbnail (capped at 500px), or `null`.
        custom_fields:
          type: object
          description: "`GET /gpm/plugins/{slug}` and `GET /gpm/themes/{slug}` only, when the package ships Admin Next custom fields. Maps each field type to itself."
          additionalProperties:
            type: string
          example:
            seo-magic-preview: seo-magic-preview
        settings_route:
          type: string
          description: Installed plugins only, when set. Hash route inside the admin page where the plugin's settings are drawn.
          example: "#settings"
        settings_page:
          type: string
          description: Installed plugins only, when set. Slug of the plugin whose admin page draws these settings.
          example: kahunacart
      required:
        - slug
        - name
        - version
        - type
        - description
        - description_html
        - author
        - homepage

    GpmPackageActionResult:
      type: object
      description: Result of installing or updating a single package.
      required: [message, package, type, dependencies]
      properties:
        message:
          type: string
          description: Human-readable summary; names installed dependencies when there were any.
          example: "Plugin 'shortcode-ui' installed successfully."
        package:
          type: string
          example: shortcode-ui
        type:
          type: string
          enum: [plugin, theme]
          example: plugin
        dependencies:
          type: array
          description: Slugs of dependencies installed or updated first.
          items:
            type: string
          example: [shortcode-core]

    # -- Scheduler ------------------------------------------------------------
    Job:
      type: object
      description: A configured scheduler job.
      properties:
        id:
          type: string
          description: Unique job identifier.
          example: default-site-backup
        command:
          type: string
          description: The command or callable to execute, or `(closure)` for a job registered as a PHP closure.
          example: Grav\Common\Backup\Backups::backup
        expression:
          type: string
          nullable: true
          description: Cron expression for the schedule.
          example: "0 3 * * *"
        enabled:
          type: boolean
          description: Whether the job is enabled.
          example: true
        status:
          type: string
          enum: [success, failure, pending]
          description: Status of the last run; `pending` when the job has never run.
          example: success
        last_run:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last execution.
          example: "2026-03-26T03:00:00+00:00"
        last_run_trigger:
          type: string
          nullable: true
          enum: [cron, manual, null]
          description: >
            What started the last execution: `cron` for an automated trigger,
            `manual` for a run somebody asked for. `null` for a job that has
            never run, or one last run by a version that did not record this.
          example: cron
        next_run:
          type: string
          format: date-time
          nullable: true
          description: When the schedule next calls for this job to run.
          example: "2026-03-27T03:00:00+00:00"
        overdue:
          type: boolean
          description: >
            Whether the job has missed the last slot its schedule gave it.
            These are the jobs a run in `overdue` mode picks up.
          example: false
        error:
          type: string
          nullable: true
          description: Error message from the last run, or `null` if successful.
          example: null
      required:
        - id
        - command
        - expression
        - enabled
        - status

    # -- Webhooks -------------------------------------------------------------
    Webhook:
      type: object
      description: An outbound webhook configuration.
      properties:
        id:
          type: string
          description: Unique webhook identifier.
          example: wh_abc123
        url:
          type: string
          format: uri
          description: Destination URL for deliveries.
          example: https://example.com/hooks/grav
        secret:
          type: string
          description: |
            HMAC-SHA256 signing secret (`whsec_` prefix). Returned in full only
            by `POST /webhooks`; every other response masks it, keeping the
            first 6 and last 4 characters.
          example: whsec_************************************************a1b2
        events:
          type: array
          items:
            type: string
            enum:
              - "*"
              - page.created
              - page.updated
              - page.deleted
              - page.moved
              - page.translated
              - pages.reordered
              - media.uploaded
              - media.deleted
              - user.created
              - user.updated
              - user.deleted
              - config.updated
              - gpm.installed
              - gpm.removed
              - grav.upgraded
          description: Event types subscribed to. `*` means all events (the default).
          example: [page.created, page.updated]
        enabled:
          type: boolean
          description: Whether the webhook is active.
          example: true
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Custom HTTP headers included in deliveries. An empty set is
            serialized as an empty JSON array (`[]`).
          example: {}
        created:
          type: integer
          description: Creation time as a Unix timestamp.
          example: 1774008000
        failure_count:
          type: integer
          description: Consecutive failed deliveries. Reset to 0 on a successful delivery; the webhook is disabled at 5.
          example: 0
        disabled_reason:
          type: string
          description: Present only when the webhook was disabled automatically after repeated failures.
          example: Auto-disabled after 5 consecutive failures
      required:
        - id
        - url
        - secret
        - events
        - enabled
        - created

    WebhookDelivery:
      type: object
      description: A record of a single webhook delivery attempt.
      properties:
        id:
          type: string
          description: Unique delivery identifier (also sent as the `X-Grav-Delivery` header).
          example: dlv_1a2b3c4d5e6f7a8b
        event:
          type: string
          description: The event type that triggered this delivery (`test` for test deliveries).
          example: page.updated
        url:
          type: string
          format: uri
          description: The URL the payload was delivered to.
          example: https://example.com/hooks/grav
        request_headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers sent with the delivery, including `X-Grav-Signature`, `X-Grav-Event` and `X-Grav-Delivery`.
        request_body:
          type: object
          description: The JSON payload that was sent.
          properties:
            event:
              type: string
              example: page.updated
            timestamp:
              type: string
              format: date-time
              example: "2026-03-25T14:30:00+00:00"
            data:
              type: object
              additionalProperties: true
            webhook_id:
              type: string
              example: wh_abc123
        created:
          type: integer
          description: Time of the delivery attempt as a Unix timestamp.
          example: 1774449000
        status_code:
          type: integer
          description: HTTP status code returned by the receiver, or `0` when the request failed before a response.
          example: 200
        response_body:
          type: string
          description: Response body from the receiver, truncated to 1000 characters. Absent when the request failed.
        error:
          type: string
          description: Transport error message. Present only when the request failed before a response.
        success:
          type: boolean
          description: Whether the delivery was successful (2xx response).
          example: true
        duration_ms:
          type: integer
          description: Request duration in milliseconds.
          example: 234
      required:
        - id
        - event
        - url
        - status_code
        - success
        - created

    # -- Dashboard ------------------------------------------------------------
    Notification:
      type: object
      description: |
        A dashboard notification. Notifications are published by getgrav.org
        (`notifications2.json`) and passed through as-is, and plugins can add
        their own through the `onApiDashboardNotifications` event, so fields
        beyond `id` are optional and extra fields may appear.
      additionalProperties: true
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          description: Notification identifier, used by the hide endpoint.
          example: 214
        date:
          type: string
          description: Publication date as published (for example `2026-07-31 12:00`).
          example: "2026-07-31 12:00"
        type:
          type: string
          description: Notification kind, such as `info`, `warning` or `promo`.
          example: info
        location:
          type: array
          items:
            type: string
          description: Locations the notification is shown in.
          example: [feed]
        title:
          type: string
          description: Optional heading.
          example: KahunaCart
        message:
          type: string
          description: Notification text (Markdown).
          example: Run a real community on your own site with **Forum Pro** for Grav 2, now available.
        link:
          type: string
          description: Optional URL for more information.
          example: https://getgrav.org/premium/forum-pro
        icon:
          type: string
          description: Optional icon (usually an emoji).
        image:
          type: string
          description: Optional image URL.
        action:
          type: object
          description: Optional call-to-action button.
          properties:
            label:
              type: string
              example: Learn more
            url:
              type: string
              example: https://kahunacart.com
        reappear_after:
          type: string
          description: |
            Relative time (a PHP date modifier such as `+1 week`) after which a
            hidden notification is shown again. Without it, hiding is permanent.
      required:
        - id

    FeedItem:
      type: object
      description: A news item from the getgrav.org blog Atom feed.
      properties:
        title:
          type: string
          description: Article title.
          example: Grav 2.1 Released
        url:
          type: string
          format: uri
          description: URL to the full article.
          example: https://getgrav.org/blog/grav-2-1-released
        date:
          type: string
          format: date-time
          description: The entry's `updated` date.
          example: "2026-09-11T12:00:00+00:00"
        summary:
          type: string
          description: The entry's summary; empty when the feed has none.
          example: ""
      required:
        - title
        - url
        - date
        - summary

    DashboardStats:
      type: object
      description: Summary statistics for the dashboard overview.
      properties:
        pages:
          type: object
          properties:
            total:
              type: integer
              description: Number of pages (the root is not counted).
              example: 42
            published:
              type: integer
              example: 40
        users:
          type: object
          properties:
            total:
              type: integer
              description: Number of user accounts.
              example: 5
        plugins:
          type: object
          properties:
            total:
              type: integer
              description: Number of installed plugins.
              example: 12
            active:
              type: integer
              description: Number of enabled plugins.
              example: 10
            updatable:
              type: integer
              nullable: true
              description: Plugins with an update available in GPM, or null when the GPM repository data has not been fetched yet (unknown).
              example: 2
        themes:
          type: object
          properties:
            total:
              type: integer
              example: 2
            updatable:
              type: integer
              nullable: true
              description: Themes with an update available in GPM, or null when unknown.
              example: 0
            active_updatable:
              type: boolean
              nullable: true
              description: Whether the active theme has an update available, or null when unknown.
              example: false
        grav:
          type: object
          properties:
            updatable:
              type: boolean
              nullable: true
              description: Whether a Grav core update is available, or null when unknown.
              example: false
        media:
          type: object
          properties:
            total:
              type: integer
              description: Number of files under `user/media` (sidecar `.meta.yaml`, `media_order.yaml` and dot files are not counted). Cached for 5 minutes.
              example: 120
        theme:
          type: string
          nullable: true
          description: Currently active theme slug.
          example: quark
        grav_version:
          type: string
          description: Installed Grav version.
          example: 2.1.0
        php_version:
          type: string
          description: PHP runtime version.
          example: 8.3.14
        last_backup:
          type: string
          format: date-time
          nullable: true
          description: Modification time of the most recent backup archive, or `null` if no backups exist.
          example: "2026-03-26T03:00:00+00:00"
      required:
        - pages
        - users
        - plugins
        - themes
        - grav
        - media
        - theme
        - grav_version
        - php_version
        - last_backup

    # -- Batch ----------------------------------------------------------------
    BatchResult:
      type: object
      description: Result of a single operation within a batch request.
      properties:
        route:
          type: string
          description: The page route that was operated on.
          example: /blog/draft-one
        status:
          type: string
          enum: [success, error]
          description: Whether this individual operation succeeded.
          example: success
        message:
          type: string
          description: Error message. Present only when `status` is `error`.
          example: Page permissions deny 'publish' on this page.
      required:
        - route
        - status

    AuthUserProfile:
      type: object
      description: The logged-in user's profile and resolved permissions, as returned by `GET /me` and inside every login token response.
      properties:
        username:
          type: string
          example: admin
        fullname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        super_admin:
          type: boolean
        access:
          type: object
          additionalProperties: true
          description: Resolved permission map, including permissions inherited from groups.
        content_editor:
          type: string
          description: Preferred content editor, or an empty string for the default.
        demo_mode:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether this is a demo account whose writes are blocked.
            writable:
              type: array
              description: Routes a demo account may still write to. Empty for normal accounts.
              items:
                type: string
            reset_interval:
              type: integer
              description: Minutes between automatic demo content resets.
            seconds_until_reset:
              type: integer
              nullable: true
              description: Seconds until the next demo reset; null for normal accounts.
      required: [username, super_admin, access]

    AuthTokenPairWithUser:
      description: A JWT token pair plus the profile of the user it was issued to.
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/AuthUserProfile"
          required: [user]

    AuthTwoFactorChallenge:
      type: object
      description: Returned instead of tokens when the account has 2FA enabled. Finish the login with `POST /auth/2fa/verify`.
      properties:
        requires_2fa:
          type: boolean
          enum: [true]
        challenge_token:
          type: string
        expires_in:
          type: integer
          description: Challenge lifetime in seconds.
        token_type:
          type: string
          enum: [Challenge]
      required: [requires_2fa, challenge_token, expires_in, token_type]

    AuthPasswordPolicy:
      type: object
      description: The site's password policy, for client-side validation.
      properties:
        regex:
          type: string
          description: The raw `system.pwd_regex` value; empty when none is set.
        min_length:
          type: integer
          description: Minimum length parsed from the regex (0 when the regex has none), or 8 when no regex is set, since that floor is enforced instead.
        rules:
          type: array
          description: Checklist rules, from `system.pwd_rules` when configured, otherwise parsed from the regex, or a single 8-character length rule when no regex is set.
          items:
            type: object
            properties:
              id:
                type: string
                example: digit
              label:
                type: string
                example: At least one number
              pattern:
                type: string
                description: Regex fragment the password must contain a match for.
                example: "\\d"
            required: [id, label, pattern]

    AuthSsoProvider:
      type: object
      description: A single sign-on button for the login screen.
      properties:
        id:
          type: string
          description: Provider id used in `/auth/sso/{provider}/start`.
        label:
          type: string
        icon:
          type: string
          description: Icon class, or empty.
        plugin:
          type: string
          description: Slug of the plugin that provides it, or empty.
      required: [id, label, icon, plugin]

    MenubarItem:
      type: object
      description: A plugin toolbar button. Plugins may add further keys, which are passed through.
      additionalProperties: true
      properties:
        id:
          type: string
        plugin:
          type: string
          description: Owning plugin slug; the first path segment of the action route.
        label:
          type: string
        icon:
          type: string
          description: Font Awesome icon class.
        action:
          type: string
          description: Action key for `POST /menubar/actions/{plugin}/{action}`.
        confirm:
          type: string
          description: Optional confirmation prompt shown before running the action.
        variant:
          type: string
          description: Visual emphasis mapped to theme tokens. Unknown values fall back to the default style.
          example: primary
        showLabel:
          type: boolean
        size:
          type: string
          enum: [sm, md]
        placement:
          type: string
          enum: [start, end]
        priority:
          type: integer
          description: Order within the zone; higher renders earlier.

    PageLanguageVersion:
      type: object
      description: One language version of a page, as returned by the compare endpoint.
      properties:
        lang:
          type: string
        exists:
          type: boolean
          description: Whether the page has its own file for this language, rather than a fallback.
        title:
          type: string
        content:
          type: string
          description: Raw Markdown body.
        header:
          type: object
          additionalProperties: true
          description: Frontmatter.
        modified:
          type: string
          format: date-time
          nullable: true

    UserListColumn:
      type: object
      description: A plugin-declared extra column for the users list. Other keys the plugin sets are passed through.
      additionalProperties: true
      properties:
        id:
          type: string
        plugin:
          type: string
        label:
          type: string
        field:
          type: string
          description: Key looked up in each user's `extra` map.
        formatter:
          type: string
          enum: [text, link, date, datetime, boolean, number, badge]
        labelField:
          type: string
          description: For the `link` formatter only, the `extra` key holding the visible link text.
        sortable:
          type: boolean
          description: Client-side sort of the current page only.
        priority:
          type: integer
      required: [id, field, formatter, sortable]

    UserListFilterTab:
      type: object
      description: A tab above the users list. Other keys the plugin sets are passed through.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Sent as `?filter=<id>` to `GET /users`. `all` is the built-in tab.
        plugin:
          type: string
        label:
          type: string
        icon:
          type: string
        priority:
          type: integer
        badge:
          type: string
          nullable: true
          description: Static badge text or count.
        badgeEndpoint:
          type: string
          description: "API path that returns `{ count: N }` for a live badge."
      required: [id]

    UserRowAction:
      type: object
      description: A plugin-declared action button for each row of the users list.
      properties:
        id:
          type: string
        plugin:
          type: string
        label:
          type: string
        icon:
          type: string
        action:
          type: string
          description: Verb passed back to the plugin's handler.
        confirm:
          type: string
          description: Optional confirmation prompt.
        priority:
          type: integer
      required: [id, plugin, label, priority]

    UserRowActionResult:
      type: object
      description: The outcome of a row action.
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
          description: Toast text, at most 512 characters.
        url:
          type: string
          description: Same-origin URL to navigate to; dropped when the handler returns anything else.
      required: [status]

    Group:
      type: object
      description: A user group and the access rules it grants.
      properties:
        groupname:
          type: string
          description: Group identifier and storage key.
          example: editors
        readableName:
          type: string
          description: Display name (empty string when unset).
          example: Editors
        description:
          type: string
          example: Can edit and publish pages.
        icon:
          type: string
          description: Icon name (empty string when unset).
          example: users
        enabled:
          type: boolean
          example: true
        access:
          type: object
          additionalProperties: true
          description: Nested permission map. Always a JSON object, `{}` when empty.
          example:
            api:
              access: true
              pages:
                read: true
                write: true
      required: [groupname, readableName, description, icon, enabled, access]

    GroupWriteRequest:
      type: object
      description: Writable group fields. On create, omitted fields fall back to defaults; on update, only the fields sent are changed.
      properties:
        readableName:
          type: string
          example: Editors
        description:
          type: string
          example: Can edit and publish pages.
        icon:
          type: string
          example: users
        enabled:
          type: boolean
          default: true
        access:
          type: object
          additionalProperties: true
          description: Nested permission map. Replaces the stored map whole; a non-object value is stored as an empty map.

    DemoStatus:
      type: object
      description: Demo-mode reset state.
      properties:
        baseline_exists:
          type: boolean
          description: Whether a baseline has been captured. Resets do nothing without one.
        writable:
          type: array
          description: Permissions demo accounts may still write with (`plugins.api.demo.writable`), e.g. `api.pages.write`.
          items:
            type: string
        roots:
          type: array
          description: Names of the writable folders a reset restores (e.g. `pages`, `media`), limited to folders that exist on disk.
          items:
            type: string
        reset_interval:
          type: integer
          description: Minutes between automatic resets.
          example: 30
        reset_on_request:
          type: boolean
          description: Whether stale content is reset lazily during API requests.
        reset_on_schedule:
          type: boolean
          description: Whether a scheduler job performs resets.
        last_reset:
          type: integer
          nullable: true
          description: Unix timestamp of the last reset, or null if none has run.
          example: 1790000000
        seconds_until_reset:
          type: integer
          nullable: true
          description: Seconds until the next reset is due; 0 means due now, null when no baseline exists.
          example: 1234

    EnvironmentEntry:
      type: object
      description: An environment configuration folder.
      properties:
        name:
          type: string
          description: Environment name (empty string for the base configuration).
          example: staging.example.com
        label:
          type: string
          example: staging.example.com
        exists:
          type: boolean
        hasOverrides:
          type: boolean
          description: Whether the environment folder contains any configuration overrides.

    BlueprintUploadedFile:
      type: object
      description: A file saved by a blueprint file-field upload.
      properties:
        name:
          type: string
          description: Saved file name (may differ from the uploaded name with `random_name` or `avoid_overwriting`).
          example: logo.png
        path:
          type: string
          description: Logical path relative to the Grav root; pass it back to `DELETE /blueprint-upload`.
          example: user/themes/quark/images/logo/logo.png
        size:
          type: integer
          example: 20480
        type:
          type: string
          description: Detected MIME type.
          example: image/png
        url:
          type: string
          nullable: true
          description: Public URL of the file.
          example: /user/themes/quark/images/logo/logo.png
      required: [name, path, size, type]

    # -- Audit -----------------------------------------------------------------
    AuditEvent:
      type: object
      description: One recorded API action.
      properties:
        id:
          type: integer
          example: 42
        ts:
          type: integer
          format: int64
          description: Time of the action in Unix epoch milliseconds.
          example: 1758441600000
        event:
          type: string
          description: Event code in `namespace.action` form.
          example: page.update
        severity:
          type: string
          description: RFC 5424 level. Recorded events use `info`, `notice` or `warning`.
          example: info
        actor_id:
          type: string
          nullable: true
          example: admin
        actor_name:
          type: string
          nullable: true
          example: Admin User
        actor_roles:
          type: array
          items:
            type: string
          example: [admin]
        auth_method:
          type: string
          nullable: true
          description: How the caller authenticated.
          enum: [apikey, jwt, session, null]
          example: jwt
        ip:
          type: string
          nullable: true
          description: Client IP; the last part is masked when `audit.anonymize_ip` is on.
          example: 127.0.0.1
        user_agent:
          type: string
          nullable: true
          example: Mozilla/5.0
        target_type:
          type: string
          nullable: true
          example: page
        target_id:
          type: string
          nullable: true
          example: /blog/my-first-post
        status:
          type: integer
          nullable: true
          description: Reserved; currently always null.
          example: null
        context:
          type: object
          nullable: true
          additionalProperties: true
          description: "Event-specific detail. With `coverage: detailed`, page edits include field-level before/after values."

    # -- Twig in Content -------------------------------------------------------
    TwigContentLeak:
      type: object
      description: A page whose raw Twig markers render verbatim to visitors.
      properties:
        route:
          type: string
          example: /blog/my-first-post
        requested:
          type: boolean
          description: Whether the page asks for Twig processing (`process.twig`).
          example: true
        gate:
          type: boolean
          description: Master gate state when checked.
          example: false
        reason:
          type: string
          enum: [gate_off, page_off]
          description: "`gate_off`: the site-wide gate is off. `page_off`: the gate is on but this page does not request Twig."
          example: gate_off

    TwigContentEvent:
      type: object
      description: A recent blocked or blanked content-Twig token from the diagnostics ring buffer (last 50 kept).
      properties:
        type:
          type: string
          enum: [gate_blocked, sandbox_tag, sandbox_filter, sandbox_function, sandbox_method, sandbox_property, xss_blanked]
          example: sandbox_filter
        route:
          type: string
          example: /blog/my-first-post
        token:
          type: string
          example: markdown
        class:
          type: string
          description: Owning class for method/property blocks; empty otherwise.
          example: ""
        hint:
          type: string
          description: Plain-text remediation hint.
        timestamp:
          type: integer
          description: Unix epoch seconds.
          example: 1758441600
        allowlist:
          type: object
          allOf:
            - $ref: "#/components/schemas/TwigContentAllowlistDescriptor"
          nullable: true

    TwigContentAllowlistDescriptor:
      type: object
      description: What `POST /reports/twig-content/allowlist` needs to allow this token. Null for events with no allowlist remedy.
      properties:
        rule:
          type: string
          enum: [tag, filter, function, method, property]
          example: filter
        key:
          type: string
          enum: [allowed_tags, allowed_filters, allowed_functions, allowed_methods, allowed_properties]
          example: allowed_filters
        kind:
          type: string
          enum: [list, map]
          example: list
        token:
          type: string
          example: markdown
        class:
          type: string
          example: ""

    TwigContentClassMembersRow:
      type: object
      properties:
        class:
          type: string
          example: Grav\Common\Page\Page
        methods:
          type: string
          description: Comma-separated member names.
          example: title, url

    TwigContentTokenRoutes:
      type: object
      description: Map of token name to the routes using it. Arrives as `[]` when empty.
      additionalProperties:
        type: array
        items:
          type: string

    TwigContentSandboxFlatList:
      type: object
      properties:
        defaults:
          type: array
          items:
            type: string
        added:
          type: array
          items:
            type: string
        denied:
          type: array
          items:
            type: string
        effective:
          type: array
          items:
            type: string

    TwigContentSandboxClassList:
      type: object
      description: Each entry maps a class name to its allowed member names. An empty map arrives as `[]`.
      properties:
        defaults:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        added:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        denied:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        effective:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    # -- Translations editor ---------------------------------------------------
    I18nKeyRow:
      type: object
      description: One translation key with its source value and a cell per language.
      properties:
        key:
          type: string
          example: THEME_QUARK.SEARCH
        namespace:
          type: string
          description: The part of the key before the first dot.
          example: THEME_QUARK
        source_value:
          type: string
          nullable: true
          description: Value in the source language (the site override if one exists).
          example: Search
        providers:
          type: array
          items:
            type: string
          description: Source ids that ship this key.
          example: ["theme:quark"]
        owner:
          type: string
          nullable: true
          description: Source id whose value wins at runtime.
          example: theme:quark
        known:
          type: boolean
          description: False when no source ships the key (only a site override names it).
          example: true
        values:
          type: object
          description: Keyed by language code.
          additionalProperties:
            $ref: "#/components/schemas/I18nCell"
          example:
            fr:
              value: Rechercher
              state: overridden
              shipped: Recherche

    I18nCell:
      type: object
      properties:
        value:
          type: string
          nullable: true
          description: What the site shows for this language; null when missing.
        state:
          type: string
          enum: [shipped, overridden, missing]
          description: "`shipped` comes from a plugin, theme or core; `overridden` is this site's own wording; `missing` means a fallback is being shown."
        shipped:
          type: string
          nullable: true
          description: The value the sources ship, ignoring site overrides.

    # -- Admin Next preferences ------------------------------------------------
    PreferencesValues:
      type: object
      description: |
        User-overridable preference keys (site defaults in `ui.defaults`, per-user overrides in `admin_next.preferences`). In a PATCH body every key is optional; in `PATCH /admin-next/preferences/user` a `null` value removes that override.
      properties:
        colorMode:
          type: string
          nullable: true
          enum: ["", light, dark]
          description: Empty string follows the operating system.
        accentHue:
          type: integer
          nullable: true
          minimum: 0
          maximum: 360
          example: 271
        accentSaturation:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          example: 91
        fontFamily:
          type: string
          nullable: true
          enum: [inter, google-sans, public-sans, nunito-sans, jost, albert-sans]
        fontSize:
          type: string
          nullable: true
          enum: [small, normal, large, xlarge, null]
        editorMode:
          type: string
          nullable: true
          enum: [normal, expert]
        editorKeymap:
          type: string
          nullable: true
          enum: [default, vim]
        editorStickyToolbar:
          type: boolean
          nullable: true
        editorFixedHeight:
          type: integer
          nullable: true
          description: 0 lets the editor grow with its content; any other value is clamped to 300-1200 pixels.
          example: 0
        adminLanguage:
          type: string
          nullable: true
          maxLength: 32
          example: en
        pagesPerPage:
          type: integer
          nullable: true
          minimum: 1
          maximum: 200
          example: 20
        pagesViewMode:
          type: string
          nullable: true
          enum: [tree, list, miller]
        usersViewMode:
          type: string
          nullable: true
          enum: [cards, table]
        groupsViewMode:
          type: string
          nullable: true
          enum: [cards, table]
        pluginsViewMode:
          type: string
          nullable: true
          enum: [cards, table]
        themesViewMode:
          type: string
          nullable: true
          enum: [cards, table]
        flexAfterSave:
          type: string
          nullable: true
          enum: ["", create-new, edit, list]
          description: What Flex editors do after saving. Empty string follows the directory blueprint.

    PreferencesSiteSettings:
      type: object
      description: Site-only behavioral settings stored in `ui.settings`. Users cannot override these.
      properties:
        autoSaveEnabled:
          type: boolean
          example: false
        autoSaveToolbarUndo:
          type: boolean
          example: true
        autoSaveBatchWindowMs:
          type: integer
          minimum: 0
          example: 0
        collabEnabled:
          type: boolean
          example: true
        menubarLinks:
          type: array
          description: Custom links shown in the Admin Next menubar. Entries without both `label` and `url` are dropped.
          items:
            $ref: "#/components/schemas/PreferencesMenubarLink"

    PreferencesMenubarLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          maxLength: 64
          example: Docs
        url:
          type: string
          maxLength: 512
          example: https://learn.getgrav.org
        icon:
          type: string
          maxLength: 64
          example: book
        external:
          type: boolean
          example: true

    PreferencesMediaUpload:
      type: object
      description: Client-side image resize constraints, read from the classic admin plugin's `pagemedia` settings (all zeros when the classic admin is not installed). Read-only.
      properties:
        resizeWidth:
          type: integer
        resizeHeight:
          type: integer
        resizeQuality:
          type: number
          format: float
          example: 0.8
        minWidth:
          type: integer
        minHeight:
          type: integer
        maxWidth:
          type: integer
        maxHeight:
          type: integer

    BrandingSettings:
      type: object
      description: Site branding stored under `ui.branding` in `user/config/admin-next.yaml`.
      properties:
        mode:
          type: string
          enum: [default, text, custom]
          description: "`default` shows the Grav logo, `text` shows `text`, `custom` shows the uploaded logos."
        text:
          type: string
          maxLength: 64
          description: Logo text for `text` mode. Empty falls back to `Grav`.
          example: Grav
        logoLight:
          type: string
          description: Basename of the light logo inside `user/media/admin-next/`, or empty.
        logoDark:
          type: string
          description: Basename of the dark logo inside `user/media/admin-next/`, or empty.
        logoHeight:
          type: integer
          description: Custom logo height in CSS pixels, clamped to 16-44. 0 uses the built-in 28px.
          example: 0
        title:
          type: string
          maxLength: 64
          description: Sign-in screen and browser tab title. Empty uses the built-in copy.
        subtitle:
          type: string
          maxLength: 128
          description: Sign-in screen subtitle. Empty uses the built-in copy.
        showPoweredBy:
          type: boolean
          description: Show the "Powered by Grav CMS" line on the login and setup screens.
          example: true
        favicon:
          type: string
          description: Basename of a custom favicon inside `user/media/admin-next/`, or empty for the generated accent-colored favicon.

    BrandingUrls:
      type: object
      description: URLs for the branding files relative to the site root, without the site's base path (Admin Next prefixes its own `serverUrl`), or empty strings when unset. Built from the real location of the user folder, so a custom user path is honored.
      properties:
        light:
          type: string
          example: /user/media/admin-next/logo-light-3f9c2a7e5b.svg
        dark:
          type: string
          example: ""
        favicon:
          type: string
          example: ""

    AdminNextBoot:
      type: object
      description: Response of `GET /admin-next/boot`. Every member of `data` is optional; a part that is missing is listed in `errors`.
      required: [data, errors]
      properties:
        data:
          type: object
          properties:
            preferences:
              $ref: "#/components/schemas/PreferencesPayload"
            me:
              allOf:
                - $ref: "#/components/schemas/AuthUserProfile"
                - type: object
                  properties:
                    grav_version:
                      type: string
                    admin_version:
                      type: string
                      nullable: true
            menubar:
              type: array
              items:
                $ref: "#/components/schemas/MenubarItem"
            sidebar:
              type: array
              items:
                $ref: "#/components/schemas/SidebarItem"
            floating_widgets:
              type: array
              items:
                $ref: "#/components/schemas/FloatingWidget"
            context_panels:
              type: array
              items:
                $ref: "#/components/schemas/ContextPanel"
            custom_fields:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/CustomFieldProvider"
            languages:
              $ref: "#/components/schemas/LanguageInfo"
            translations:
              type: object
              required: [lang, checksum]
              properties:
                lang:
                  type: string
                  description: The language the checksum is for, as `/translations/{lang}` resolves it.
                  example: en-US
                checksum:
                  type: string
                  description: The checksum `GET /translations/{lang}` returns in its body and sends as its ETag.
                  example: 05e89a7f31f11d80a4860d431c6f0c7b
        errors:
          type: object
          description: Parts that were left out of `data`, keyed by part name.
          additionalProperties:
            type: object
            required: [status, title]
            properties:
              status:
                type: integer
                description: The status the part's own endpoint would have answered with.
                example: 403
              title:
                type: string
                example: Forbidden

    PreferencesPayload:
      type: object
      description: The full resolved Admin Next preferences payload.
      properties:
        branding:
          $ref: "#/components/schemas/BrandingSettings"
        branding_urls:
          $ref: "#/components/schemas/BrandingUrls"
        site:
          allOf:
            - $ref: "#/components/schemas/PreferencesValues"
          description: Site defaults merged over built-in defaults (every key present).
        site_settings:
          $ref: "#/components/schemas/PreferencesSiteSettings"
        media_upload:
          $ref: "#/components/schemas/PreferencesMediaUpload"
        user:
          type: object
          additionalProperties: true
          description: The caller's raw saved overrides (only keys they have set).
        effective:
          allOf:
            - $ref: "#/components/schemas/PreferencesValues"
            - $ref: "#/components/schemas/PreferencesSiteSettings"
          description: Final values to apply (built-in defaults, then site defaults, then user overrides, then site-only settings).
        can_edit_site:
          type: boolean
          description: Whether the caller is a super-admin and may write site preferences and branding.
      example:
        branding:
          mode: default
          text: Grav
          logoLight: ""
          logoDark: ""
          logoHeight: 0
          title: ""
          subtitle: ""
          showPoweredBy: true
          favicon: ""
        branding_urls:
          light: ""
          dark: ""
          favicon: ""
        site:
          colorMode: ""
          accentHue: 271
          accentSaturation: 91
          fontFamily: google-sans
          fontSize: normal
          editorMode: normal
          editorKeymap: default
          editorStickyToolbar: true
          editorFixedHeight: 0
          adminLanguage: en
          pagesPerPage: 20
          pagesViewMode: miller
          usersViewMode: cards
          groupsViewMode: cards
          pluginsViewMode: cards
          themesViewMode: cards
          flexAfterSave: ""
        site_settings:
          autoSaveEnabled: false
          autoSaveToolbarUndo: true
          autoSaveBatchWindowMs: 0
          collabEnabled: true
          menubarLinks: []
        media_upload:
          resizeWidth: 0
          resizeHeight: 0
          resizeQuality: 0.8
          minWidth: 0
          minHeight: 0
          maxWidth: 0
          maxHeight: 0
        user:
          colorMode: dark
        effective:
          colorMode: dark
          accentHue: 271
          fontFamily: google-sans
          autoSaveEnabled: false
          collabEnabled: true
          menubarLinks: []
        can_edit_site: true

    # -- Dashboard widgets -----------------------------------------------------
    DashboardWidget:
      type: object
      description: A dashboard widget from the core registry or a plugin, annotated with its effective layout. Plugin widgets may carry extra plugin-defined keys.
      properties:
        id:
          type: string
          example: core.stats
        source:
          type: string
          enum: [core, plugin]
        label:
          type: string
          description: Display label or translation key.
          example: ADMIN_NEXT.DASHBOARD.WIDGETS.STATS
        icon:
          type: string
          example: BarChart3
        sizes:
          type: array
          description: Sizes this widget supports. A plugin widget that declares none (or no valid ones) gets `[sm, md, lg]`.
          items:
            type: string
            enum: [xs, sm, md, lg, xl]
        defaultSize:
          type: string
          enum: [xs, sm, md, lg, xl]
          description: Always one of `sizes`. A plugin widget that declares none gets `md`, or its first size when `md` isn't supported.
        priority:
          type: integer
          description: Default ordering weight (higher appears first when no layout sets `order`).
        visible:
          type: boolean
          description: Effective visibility (user layout, else site layout, else true).
        size:
          type: string
          enum: [xs, sm, md, lg, xl]
          description: Effective size, always one of `sizes`.
        order:
          type: integer
          description: Effective sort position (ascending).
      additionalProperties: true

    DashboardWidgetLayoutEntry:
      type: object
      required: [id]
      properties:
        id:
          type: string
          example: core.stats
        visible:
          type: boolean
          default: true
        size:
          type: string
          nullable: true
          enum: [xs, sm, md, lg, xl, null]
        order:
          type: integer
          description: Sort position. Leave it out to keep the widget's priority-based position.

    DashboardWidgetLayout:
      type: object
      description: A stored dashboard layout (per user or site-wide). Saving replaces the whole layout.
      properties:
        preset:
          type: string
          enum: [default, minimal, compact, custom]
          default: custom
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/DashboardWidgetLayoutEntry"

    DashboardWidgetsResult:
      type: object
      properties:
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/DashboardWidget"
        user_layout:
          $ref: "#/components/schemas/DashboardWidgetLayout"
        site_layout:
          $ref: "#/components/schemas/DashboardWidgetLayout"
        can_edit_site:
          type: boolean
          description: Whether the caller may save the site-wide layout.

    DashboardExposureProbe:
      type: object
      properties:
        location:
          type: string
          description: Folder path relative to the web root.
          example: user/data
        extension:
          type: string
          enum: [dat, txt, zip, json]
        url:
          type: string
          format: uri
          description: Absolute URL the browser should fetch.
        token:
          type: string
          description: Expected file contents (32-64 hex characters), or empty when the sentinel could not be created or read.
        available:
          type: boolean
          description: Whether a token is available, meaning the probe can be run.

    DashboardExposureProbeResult:
      type: object
      properties:
        url:
          type: string
          description: Legacy field, the first `user://data` probe URL (empty if none).
        token:
          type: string
          description: Legacy field, the first `user://data` probe token.
        available:
          type: boolean
          description: Legacy field, whether the first `user://data` probe is usable.
        probes:
          type: array
          items:
            $ref: "#/components/schemas/DashboardExposureProbe"

    # -- UI extension registries -----------------------------------------------
    CustomFieldProvider:
      type: object
      properties:
        slug:
          type: string
          description: Plugin or theme slug that ships the field.
          example: seo-magic
        kind:
          type: string
          enum: [plugins, themes]
          description: Package kind, used in the script URL `/gpm/{kind}/{slug}/field/{type}`.

    EditorToolbarButton:
      type: object
      description: A markdown editor toolbar button contributed by a plugin. Plugins may add extra keys, which are passed through.
      properties:
        id:
          type: string
          example: youtube
        plugin:
          type: string
          example: youtube
        label:
          type: string
          description: Tooltip and aria-label.
          example: YouTube Video
        icon:
          type: string
          description: Inline SVG markup or an icon class.
        modal:
          type: object
          description: Open a plugin modal (served by `/gpm/plugins/{plugin}/modal-script/{component}`).
          properties:
            component:
              type: string
              example: youtube-insert
            title:
              type: string
            size:
              type: string
              example: md
        insert:
          type: object
          description: Insert content directly without a modal.
          properties:
            content:
              type: string
            mode:
              type: string
              enum: [insert-at-cursor, append, replace]
      additionalProperties: true

    FloatingWidget:
      type: object
      description: A floating widget contributed by a plugin. Plugins may add extra keys, which are passed through.
      properties:
        id:
          type: string
          example: ai-pro-chat
        plugin:
          type: string
          description: Owning plugin slug; its script is served by `/gpm/plugins/{plugin}/widget-script`.
          example: ai-pro
        label:
          type: string
        icon:
          type: string
          description: Lucide icon name.
        priority:
          type: integer
          description: Sort weight (higher first). Sorting is done by the client.
        autoLoad:
          type: boolean
          description: Load the widget script eagerly instead of on first open.
        routes:
          type: array
          description: Admin Next routes that scope `autoLoad`. Not a permission boundary. Omitted means everywhere.
          items:
            type: string
          example: [/users, /pages]
      additionalProperties: true

    ContextPanel:
      type: object
      description: A page-editor slide-in panel contributed by a plugin. Returned exactly as the plugin built it.
      properties:
        id:
          type: string
          example: revisions-pro
        plugin:
          type: string
          description: Owning plugin slug; its script is served by `/gpm/plugins/{plugin}/panel-script`.
          example: revisions-pro
        label:
          type: string
        icon:
          type: string
          description: Lucide icon name.
        contexts:
          type: array
          description: Where the trigger button appears.
          items:
            type: string
          example: [pages]
        priority:
          type: integer
          description: Sort weight (higher first). Sorting is done by the client.
        width:
          type: integer
          description: Panel width in pixels.
        badgeEndpoint:
          type: string
          description: Optional API path returning a `count` number for a badge on the trigger button.
      additionalProperties: true

    SettingsPanel:
      type: object
      description: A blueprint-driven section for the Admin Next Settings page, contributed by a plugin.
      properties:
        id:
          type: string
          example: login-settings
        plugin:
          type: string
          description: Plugin that owns the blueprint.
          example: api
        label:
          type: string
        description:
          type: string
        icon:
          type: string
        blueprint:
          type: string
          description: Blueprint file name.
        data_endpoint:
          type: string
          description: API path to GET the panel data from.
        save_endpoint:
          type: string
          description: API path to PATCH the panel data to.
        priority:
          type: integer
          description: Sort weight (higher first); the server sorts by it.
      additionalProperties: true

    # -- Invitations -----------------------------------------------------------
    Invitation:
      type: object
      properties:
        token:
          type: string
          description: The invite credential used in `/auth/invite/{token}`.
        email:
          type: string
          format: email
        fullname:
          type: string
        groups:
          type: array
          items:
            type: string
        created:
          type: integer
          description: Unix timestamp.
        created_by:
          type: string
          description: Username of the inviting admin.
        created_by_name:
          type: string
        expires:
          type: integer
          description: Unix timestamp.
        expired:
          type: boolean

    InvitationCreated:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          properties:
            link:
              type: string
              format: uri
              description: Accept link, `{adminBase}/invite?token={token}`.
              example: https://example.com/admin/invite?token=9c1f0e6b2a7d4c8e5f3a1b9d0c7e2f4a
            email_sent:
              type: boolean
            warning:
              type: string
              description: Present when the email was not sent; share `link` manually.

    InvitationCreateRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Must not belong to an existing account.
        fullname:
          type: string
          description: Prefilled on the accept form.
        access:
          type: object
          additionalProperties: true
          description: Permission map the new account receives. Super flags are removed unless the caller is a super-admin.
        groups:
          type: array
          items:
            type: string
          description: Groups the new account joins. Honored only for super-admin callers.
        expiration:
          type: integer
          description: Lifetime in seconds. Values under 300 fall back to `plugins.api.invitations.expiration` (default 604800, 7 days); values over 2592000 (30 days) are capped at 30 days.
          example: 604800
        message:
          type: string
          description: Optional personal note included in the email.
        admin_base_url:
          type: string
          format: uri
          description: Admin Next base URL used to build the link; accepted only for the site's own origin or a configured CORS origin.
